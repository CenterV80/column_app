<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事まとめ | column_app</title>
<link rel="stylesheet" href="hub.css">
<style>
  #hub {
    max-width: 760px;
  }

  header h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .section-label {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #6d5bd0;
    background: #efecfb;
    padding: 5px 12px;
    border-radius: 999px;
    margin: 32px 0 16px;
  }

  .section-label:first-child {
    margin-top: 0;
  }

  .a-card {
    background: #fff;
    border: 1px solid #ececec;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 14px;
    transition: box-shadow 0.15s, transform 0.15s;
  }

  .a-card:hover {
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    transform: translateY(-2px);
  }

  .a-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 10px;
  }

  .a-icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
  }

  .a-head h3 {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 4px;
  }

  .a-links {
    font-size: 12px;
    margin: 0;
  }

  .a-links a {
    color: #999;
    text-decoration: none;
  }

  .a-links a:hover {
    color: #6d5bd0;
    text-decoration: underline;
  }

  .a-desc {
    font-size: 14px;
    line-height: 1.8;
    color: #444;
    margin: 0;
  }

  .a-desc strong {
    color: #222;
  }

  .loading {
    color: #999;
    font-size: 14px;
  }

  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }

  .pdf-button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #6d5bd0;
    background: #efecfb;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .pdf-button:hover {
    background: #e2ddf7;
  }

  @media print {
    .back-link,
    .toolbar {
      display: none;
    }

    .a-card {
      border: none;
      box-shadow: none;
      padding: 12px 0;
      break-inside: avoid;
    }

    .a-card:hover {
      transform: none;
      box-shadow: none;
    }

    body {
      background: #fff;
    }
  }
</style>
</head>
<body>
<div id="hub">
  <a class="back-link" href="index.html">← トップに戻る</a>
  <header>
    <h1>📚 AI記事まとめ</h1>
    <p>ローカルAIまわりの気になるニュースをまとめています。</p>
  </header>
  <div class="toolbar">
    <button class="pdf-button" onclick="window.print()">📄 PDFとして保存</button>
  </div>
  <div id="content" class="loading">読み込み中…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
<script>
  const PALETTE = [
    { bg: "#eef2ff", emoji: "🎬" },
    { bg: "#fff7ed", emoji: "⚡" },
    { bg: "#ecfdf5", emoji: "🧩" },
    { bg: "#fdf2f8", emoji: "✨" },
    { bg: "#f0f9ff", emoji: "📄" },
  ];

  function buildLayout(markdown) {
    const raw = document.createElement("div");
    raw.innerHTML = marked.parse(markdown);

    const out = document.createDocumentFragment();
    let card = null;
    let head = null;
    let pCount = 0;
    let colorIndex = 0;

    for (const el of Array.from(raw.children)) {
      if (el.tagName === "H2") {
        const label = document.createElement("div");
        label.className = "section-label";
        label.textContent = el.textContent;
        out.appendChild(label);
        card = null;
        continue;
      }

      if (el.tagName === "H3") {
        card = document.createElement("article");
        card.className = "a-card";

        head = document.createElement("div");
        head.className = "a-head";

        const icon = document.createElement("span");
        const style = PALETTE[colorIndex % PALETTE.length];
        colorIndex++;
        icon.className = "a-icon";
        icon.style.background = style.bg;
        icon.textContent = style.emoji;

        const titleWrap = document.createElement("div");
        const h3 = document.createElement("h3");
        h3.innerHTML = el.innerHTML;
        titleWrap.appendChild(h3);

        head.appendChild(icon);
        head.appendChild(titleWrap);
        card.appendChild(head);
        out.appendChild(card);

        pCount = 0;
        continue;
      }

      if (el.tagName === "P" && card) {
        pCount++;
        if (pCount === 1) {
          const links = document.createElement("p");
          links.className = "a-links";
          links.innerHTML = el.innerHTML;
          head.querySelector("div").appendChild(links);
        } else {
          const desc = document.createElement("p");
          desc.className = "a-desc";
          desc.innerHTML = el.innerHTML;
          card.appendChild(desc);
        }
      }
    }

    return out;
  }

  fetch("articles.md")
    .then((res) => res.text())
    .then((markdown) => {
      const content = document.getElementById("content");
      content.classList.remove("loading");
      content.innerHTML = "";
      content.appendChild(buildLayout(markdown));
    })
    .catch(() => {
      document.getElementById("content").textContent = "記事を読み込めませんでした。";
    });
</script>
</body>
</html>
