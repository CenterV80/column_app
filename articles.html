<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事まとめ | column_app</title>
<link rel="stylesheet" href="hub.css">
<style>
  #articles {
    max-width: 720px;
  }

  #content h2 {
    font-size: 13px;
    font-weight: 600;
    color: #999;
    letter-spacing: 0.04em;
    margin: 36px 0 4px;
  }

  #content h2:first-child {
    margin-top: 0;
  }

  #content h3 {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.4;
    margin: 28px 0 8px;
    padding-top: 24px;
    border-top: 1px solid #ececec;
  }

  #content h2 + h3 {
    margin-top: 12px;
    padding-top: 0;
    border-top: none;
  }

  #content h3 + p {
    font-size: 13px;
    margin: 0 0 10px;
  }

  #content h3 + p a {
    color: #777;
    text-decoration: none;
  }

  #content h3 + p a:hover {
    color: #222;
    text-decoration: underline;
  }

  #content p {
    font-size: 14px;
    line-height: 1.8;
    color: #444;
    margin: 0;
  }

  #content strong {
    color: #222;
  }

  .loading {
    color: #999;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="hub">
  <a class="back-link" href="index.html">← トップに戻る</a>
  <header>
    <h1>📚 記事まとめ</h1>
    <p>気になる記事をまとめています。</p>
  </header>
  <div id="articles">
    <div id="content" class="loading">読み込み中…</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  fetch("articles.md")
    .then((res) => res.text())
    .then((markdown) => {
      document.getElementById("content").classList.remove("loading");
      document.getElementById("content").innerHTML = marked.parse(markdown);
    })
    .catch(() => {
      document.getElementById("content").textContent = "記事を読み込めませんでした。";
    });
</script>
</body>
</html>
