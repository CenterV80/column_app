  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --shell: #b9b7a6;
    --shell-hi: #d6d4c4;
    --shell-lo: #86847a;
    --bezel: #3f4048;
    --bezel-hi: #5a5b64;
    --btn: #8f2547;
    --btn-lo: #5f1730;
    --pad: #2e2f36;
    --pad-lo: #17181d;
    --page: #23242a;
    --page-text: #cfcdc0;
  }

  body {
    background: var(--page);
    color: var(--page-text);
    font-family: "DotGothic16", "Hiragino Sans", monospace;
    display: flex;
    justify-content: center;
    padding: 8px;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  #console { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; }

  /* ---- handheld shell: a thin bezel, so the screen dominates ---- */
  #shell {
    background: linear-gradient(165deg, var(--shell-hi) 0%, var(--shell) 34%, var(--shell-lo) 100%);
    border-radius: 8px 8px 30px 8px;
    padding: 9px 9px 11px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.22),
                0 5px 0 #6d6b61, 0 9px 16px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #bezel {
    background: var(--bezel);
    border-radius: 6px 6px 18px 6px;
    padding: 7px 10px 8px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.65);
  }

  .bezel-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .bezel-rule { flex: 1; height: 1px; background: var(--bezel-hi); }
  .bezel-title { font-size: 7px; letter-spacing: .16em; color: #a9a8b6; white-space: nowrap; }

  canvas#screen {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 320 / 288;
    background: #9bbc0f;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .power {
    display: flex; align-items: center; gap: 4px;
    font-size: 7px; letter-spacing: .1em; color: #a9a8b6; margin-top: 5px;
  }
  .led { width: 6px; height: 6px; border-radius: 50%; background: #ff4d4d; box-shadow: 0 0 5px #ff4d4d; }

  /* ---- controls ---- */
  #pads { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }

  #dpad { position: relative; width: 84px; height: 84px; }
  #dpad button {
    position: absolute;
    background: var(--pad);
    border: none;
    color: #b9b9c4;
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    width: 28px; height: 28px;
  }
  #dpad button:active { background: var(--pad-lo); }
  #dpad .up { left: 28px; top: 0; border-radius: 5px 5px 0 0; }
  #dpad .left { left: 0; top: 28px; border-radius: 5px 0 0 5px; }
  #dpad .right { left: 56px; top: 28px; border-radius: 0 5px 5px 0; }
  #dpad .down { left: 28px; top: 56px; border-radius: 0 0 5px 5px; }
  #dpad .hub {
    position: absolute; left: 28px; top: 28px; width: 28px; height: 28px;
    background: var(--pad);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #dpad .hub::after {
    content: ""; width: 13px; height: 13px; border-radius: 50%;
    background: var(--pad-lo);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.8);
  }

  #ab { display: flex; gap: 11px; transform: rotate(-18deg); }
  #ab button {
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: var(--btn); color: #ffd6e2; font-size: 13px;
    font-family: inherit; cursor: pointer;
    box-shadow: 0 3px 0 var(--btn-lo), inset 0 -2px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.18);
    touch-action: manipulation;
  }
  #ab button:active { background: var(--btn-lo); transform: translateY(3px); box-shadow: inset 0 2px 3px rgba(0,0,0,.4); }

<script>
(function () {
  "use strict";

  // =====================================================================
  // ENGINE START  (dev-scripts/verify-auto-battle.js extracts this block)
  // =====================================================================

  const CARDS = {
    attack:   { id:"attack",   name:"こうげき",     kind:"action", short:"こうげき",

  const START_CARDS = ["attack", "heal"];

  const STAGES = [
    {
      id: 1, name: "スライム", sprite: "slime", hp: 6, armor: 0,

    {

      pattern: [{ t:"attack", v:2 }, { t:"heal", v:3 }, { t:"attack", v:2 }, { t:"strong", v:6 }],

      hint: "じぶんを 3かいふくする。けずる はやさで まけると たおせない。",

      pattern: [{ t:"attack", v:3 }, { t:"attack", v:3 }, { t:"charge" }, { t:"strong", v:10 }],
      reward: [],
      hint: "HP30。ふつうに たたかっては ぜったいに たりない。ピンチで かくせいし るいじょうを うて。",
    },
  ];

  const MAX_DECK = 6;
  const MAX_TURNS = 30;
  const PLAYER_MAX_HP = 10;
  const PLAYER_BASE_ATK = 2;
  const AWAKEN_HP = 2;

  // Jump target when a condition fails: skip past this block's action card.
  function skipBlock(deck, i) {
    for (let j = i + 1; j < deck.length; j++) {
      if (CARDS[deck[j]].kind === "action") return j + 1;
    }
    return deck.length;
  }

  function nextEnemyAct(stage, idx) {
    return stage.pattern[idx % stage.pattern.length];
  }

  function evalCond(id, P, E, stage) {
    if (id === "ifPinch") return P.hp <= AWAKEN_HP;
    if (id === "ifHalf") return P.hp * 2 <= P.maxHp;
    if (id === "ifStrong") return nextEnemyAct(stage, E.idx).t === "strong";
    return false;
  }

  // Fully deterministic: the same deck against the same stage always
  // produces the same event list. No randomness anywhere.
  function simulate(stage, deck) {
    const P = { hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP, atk: PLAYER_BASE_ATK,
                awaken: false, used: {}, guard: 0 };
    const E = { hp: stage.hp, maxHp: stage.hp, armor: stage.armor || 0, idx: 0 };
    const events = [];
    let result = "draw";

    const snap = () => ({
      php: P.hp, patk: P.atk, ehp: E.hp, awaken: P.awaken,
      used: Object.assign({}, P.used), eidx: E.idx, guard: P.guard,
    });
    const push = (o) => { o.s = snap(); events.push(o); };

    const checkAwaken = () => {
      if (P.hp > 0 && P.hp <= AWAKEN_HP && !P.awaken) {
        P.awaken = true;
        push({ t: "awaken" });
      }
    };

    for (let turn = 1; turn <= MAX_TURNS; turn++) {
      push({ t: "turn", turn });

      let i = 0, acted = false;
      while (i < deck.length) {
        const c = CARDS[deck[i]];

        if (c.kind === "cond") {
          const ok = evalCond(c.id, P, E, stage);
          push({ t: "cond", card: c.id, idx: i, ok });
          i = ok ? i + 1 : skipBlock(deck, i);
          continue;
        }

        // Boosts and states are once-per-battle resources: they resolve
        // without ending the turn, so a block can brace and still act.
        if (c.kind === "boost" || c.kind === "state") {
          const blocked = P.used[c.id] ? "used" : (c.needAwaken && !P.awaken ? "noawaken" : null);
          if (blocked) {
            push({ t: "boostFail", card: c.id, idx: i, reason: blocked });
          } else if (c.id === "guard") {
            P.guard = 4;
            P.used[c.id] = true;
            push({ t: "guard", card: c.id, idx: i });
          } else {
            const from = P.atk;
            if (c.id === "plus2") P.atk += 2;
            else if (c.id === "times2") P.atk *= 2;
            else if (c.id === "power") { P.atk = P.atk * P.atk; P.awaken = false; }
            P.used[c.id] = true;
            push({ t: "boost", card: c.id, idx: i, from, to: P.atk });
          }
          i++;
          continue;
        }

        acted = true;
        if (c.id === "attack") {
          const dmg = Math.max(1, P.atk - E.armor);
          E.hp -= dmg;
          push({ t: "attack", card: c.id, idx: i, dmg });
        } else if (c.id === "heal") {
          const before = P.hp;
          P.hp = Math.min(P.maxHp, P.hp + 3);
          push({ t: "heal", card: c.id, idx: i, amt: P.hp - before });
        } else if (c.id === "reckless") {
          P.hp -= 2; P.atk += 2;
          push({ t: "reckless", card: c.id, idx: i });
        }
        break;
      }
      if (!acted) push({ t: "idle" });

      checkAwaken();
      if (E.hp <= 0) { result = "win"; break; }
      if (P.hp <= 0) { result = "lose"; break; }

      const act = nextEnemyAct(stage, E.idx);
      E.idx++;
      if (act.t === "attack" || act.t === "strong") {
        const dmg = Math.max(0, act.v - P.guard);
        P.hp -= dmg;
        push({ t: "enemyAtk", kind: act.t, raw: act.v, dmg, guarded: P.guard > 0 });
      } else if (act.t === "charge") {
        push({ t: "enemyCharge" });
      } else if (act.t === "heal") {
        const before = E.hp;
        E.hp = Math.min(E.maxHp, E.hp + act.v);
        push({ t: "enemyHeal", amt: E.hp - before });
      }
      P.guard = 0;

      checkAwaken();
      if (P.hp <= 0) { result = "lose"; break; }
      if (E.hp <= 0) { result = "win"; break; }
    }

    push({ t: "end", result });
    return { events, result };
  }

  const SPR = 32;

  // ------------------------------------------------------------ renderer
  const W = 320, H = 288;
  const PAL = [[15,56,15], [48,98,48], [139,172,15], [155,188,15]];
  const cv = document.getElementById("screen");
  const ctx = cv.getContext("2d", { willReadFrequently: true });

  const rgb = (t) => `rgb(${PAL[t][0]},${PAL[t][1]},${PAL[t][2]})`;
  function rect(x, y, w, h, tone) { ctx.fillStyle = rgb(tone); ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

  // 2px checkerboards give the mid tones real texture instead of flat fills.
  function makePat(a, b) {
    const p = document.createElement("canvas");
    p.width = p.height = 4;
    const c = p.getContext("2d");
    c.fillStyle = rgb(a); c.fillRect(0, 0, 4, 4);
    c.fillStyle = rgb(b); c.fillRect(0, 0, 2, 2); c.fillRect(2, 2, 2, 2);
    return ctx.createPattern(p, "repeat");
  }
  let PAT_FIELD, PAT_GROUND, PAT_DARK;
  function initPatterns() {
    PAT_FIELD = makePat(2, 1);   // page background: dark enough for windows to read
    PAT_GROUND = makePat(1, 0);  // floor bands, empty slots, bar tracks
    PAT_DARK = makePat(1, 0);    // deep shade (sky plates)
  }
  function patFill(pat, x, y, w, h) { ctx.fillStyle = pat; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

  // Every screen sits on a dithered field so windows have figure/ground.
  function field() { patFill(PAT_FIELD, 0, 0, W, H); }

  const FONT = 16, FONT_BIG = 32;
  function setFont(size) { ctx.font = `${size}px "DotGothic16", monospace`; }
  function txt(s, x, y, tone, size) {
    setFont(size || FONT);
    ctx.fillStyle = rgb(tone === undefined ? 0 : tone);
    ctx.textBaseline = "top";
    ctx.fillText(s, (x | 0), (y | 0));
  }
  function txtW(s, size) { setFont(size || FONT); return ctx.measureText(s).width; }
  function txtMid(s, y, tone, size) { txt(s, ((W - txtW(s, size)) / 2) | 0, y, tone, size); }
  // Right-aligned, for stat numerals.
  function txtR(s, right, y, tone, size) { txt(s, (right - txtW(s, size)) | 0, y, tone, size); }

  // Console window: solid light interior, hard frame, inner rule.
  function win(x, y, w, h) {
    rect(x, y, w, h, 3);
    rect(x, y, w, 2, 0); rect(x, y + h - 2, w, 2, 0);
    rect(x, y, 2, h, 0); rect(x + w - 2, y, 2, h, 0);
    rect(x + 4, y + 4, w - 8, 1, 1); rect(x + 4, y + h - 5, w - 8, 1, 1);
    rect(x + 4, y + 4, 1, h - 8, 1); rect(x + w - 5, y + 4, 1, h - 8, 1);
  }

  // A window with an inverted title strip: the console equivalent of a header.
  function titledWin(x, y, w, h, title) {
    win(x, y, w, h);
    rect(x + 2, y + 2, w - 4, 20, 0);
    txt(title, x + 8, y + 3, 3);
  }

  // Inverted plate — the GB convention for a status tag.
  function plate(s, x, y) {
    const w = txtW(s) + 10;
    rect(x, y, w, 20, 0);
    txt(s, x + 5, y + 2, 3);
    return w;
  }

  // Button prompt: a key cap plus its label. Returns the next free x.
  function keyHint(x, y, key, labelText) {
    const kw = Math.max(18, txtW(key) + 8);
    rect(x, y, kw, 18, 0);
    txt(key, x + (kw - txtW(key)) / 2, y + 1, 3);
    txt(labelText, x + kw + 5, y + 1, 0);
    return x + kw + 5 + txtW(labelText) + 12;
  }

  // Button prompts belong on a framed strip, never loose on the field.
  function hintWin(y, pairs) {
    win(8, y, 304, 26);
    let x = 16;
    pairs.forEach((p) => { x = keyHint(x, y + 4, p[0], p[1]); });
  }

  function bar(x, y, w, ratio) {
    const h = 12;
    rect(x, y, w, h, 0);
    patFill(PAT_GROUND, x + 2, y + 2, w - 4, h - 4);
    const inner = Math.max(0, Math.round((w - 4) * Math.max(0, Math.min(1, ratio))));
    rect(x + 2, y + 2, inner, h - 4, 0);
    if (inner > 2) rect(x + 2, y + 2, inner, 1, 1);
  }

  function sprite(name, x, y, scale, flash) {
    const art = SPRITES[name];
    if (!art) return;
    const s = scale || 2;
    for (let r = 0; r < art.length; r++) {
      const row = art[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === ".") continue;
        let tone = ch.charCodeAt(0) - 48;
        if (flash) tone = 3 - tone;
        rect(x + c * s, y + r * s, s, s, tone);
      }
    }
  }

    rect(cx - w / 2, y, w, 4, 1);

    rect(cx - w / 2 + 4, y + 4, w - 8, 2, 1);
  }

  function cursor(x, y, tone) {
    const t = tone === undefined ? 0 : tone;
    for (let i = 0; i < 6; i++) {
      rect(x, y + i, 6 - i, 1, t);
      rect(x, y + 11 - i, 6 - i, 1, t);
    }
  }

  // Card kind glyphs drawn as pixels, not font characters.
  function kindIcon(kind, x, y, tone) {
    const t = tone === undefined ? 0 : tone;
    if (kind === "cond") {           // diamond
      for (let i = 0; i < 5; i++) { rect(x + 5 - i, y + i, 1 + i * 2, 1, t); rect(x + 5 - i, y + 9 - i, 1 + i * 2, 1, t); }
    } else if (kind === "boost") {   // up triangle
      for (let i = 0; i < 5; i++) rect(x + 5 - i, y + 4 + i, 1 + i * 2, 1, t);
    } else if (kind === "state") {   // filled square
      rect(x + 1, y + 3, 9, 7, t);
    } else {                          // action: filled circle
      rect(x + 3, y + 2, 5, 9, t); rect(x + 2, y + 3, 7, 7, t);
    }
  }

  function quantize() {
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const lum = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
      let best = 0, bestD = 1e9;
      for (let p = 0; p < 4; p++) {
        const c = PAL[p];
        const pl = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
        const dist = Math.abs(pl - lum);
        if (dist < bestD) { bestD = dist; best = p; }
      }
      d[i] = PAL[best][0]; d[i + 1] = PAL[best][1]; d[i + 2] = PAL[best][2]; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  // --------------------------------------------------------------- audio
  const Snd = {
    ac: null, on: true,
    init() {
      if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ac = new AC();
    },
    tone(freq, dur, when, vol) {
      if (!this.on || !this.ac) return;
      const t0 = this.ac.currentTime + (when || 0);
      const osc = this.ac.createOscillator();
      const g = this.ac.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol === undefined ? 0.05 : vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.ac.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.01);
    },
    move() { this.tone(520, 0.05); },
    ok() { this.tone(700, 0.06); this.tone(950, 0.08, 0.06); },
    back() { this.tone(320, 0.08); },
    hit() { this.tone(200, 0.06); this.tone(130, 0.1, 0.04); },
    hurt() { this.tone(150, 0.14, 0, 0.06); },
    buff() { this.tone(600, 0.05); this.tone(800, 0.05, 0.05); this.tone(1050, 0.08, 0.1); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, i * 0.12)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, i * 0.16)); },
  };

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (Array.isArray(o.cleared)) save.cleared = o.cleared;
      if (Array.isArray(o.seen)) save.seen = o.seen;
      if (o.decks && typeof o.decks === "object") save.decks = o.decks;
    } catch (e) { /* private mode: play without saving */ }
  }
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }

  // ---- deck edit
  // Depth per card, so conditional blocks read as indented groups.
  function deckIndents(deck) {
    const out = [];
    let inBlock = false;
    deck.forEach((id) => {
      const c = CARDS[id];
      if (c.kind === "cond") { out.push(0); inBlock = true; return; }
      out.push(inBlock ? 1 : 0);
      if (c.kind === "action") inBlock = false;
    });
    return out;
  }

      case "guard": return ["ぼうぎょの かまえ！", "うけるダメージ -4"];
      case "boostFail": return [c.name + " は つかえない", e.reason === "used" ? "→ もう つかった" : "→ かくせい していない"];
      case "attack": return ["こうげき！", "てきに " + e.dmg + " ダメージ"];
      case "heal": return ["かいふく！", e.amt > 0 ? "HPが " + e.amt + " かいふく" : "HPは まんタン"];
      case "reckless": return ["すてみ！", "HP-2 こうげき力+2"];

      case "enemyCharge": return ["てきは ちからを ためている", "つぎの こうげきに ちゅうい"];
      case "enemyHeal": return ["てきは かいふくした", "HPが " + e.amt + " もどった"];
      case "end": return [e.result === "win" ? "てきを たおした！" : e.result === "lose" ? "ちからつきた…" : "じかんぎれ…", ""];
      default: return ["", ""];
    }
  }

  function stepBattle() {
    const b = G.battle;
    b.i++;
    if (b.i >= b.events.length) { finishBattle(); return; }
    const e = b.events[b.i];
    b.state = e.s;
    b.msg = eventText(e);
    b.cardIdx = e.idx === undefined ? -1 : e.idx;
    if (e.t === "turn") b.turn = e.turn;
    if (e.t === "attack") { b.flashE = 6; b.lungeP = 8; b.pop = { v: "-" + e.dmg, x: 250, y: 40, life: 16 }; Snd.hit(); }
    if (e.t === "enemyAtk" && e.dmg > 0) { b.flashP = 6; b.lungeE = 8; b.pop = { v: "-" + e.dmg, x: 52, y: 140, life: 16 }; Snd.hurt(); }
    if (e.t === "boost" || e.t === "awaken") Snd.buff();
    if (e.t === "reckless") { b.pop = { v: "-2", x: 52, y: 140, life: 14 }; Snd.hurt(); }
    if (e.t === "heal") { b.pop = { v: "+" + e.amt, x: 52, y: 140, life: 14 }; Snd.move(); }
    if (e.t === "enemyHeal") { b.pop = { v: "+" + e.amt, x: 250, y: 40, life: 14 }; Snd.move(); }
    if (e.t === "guard") Snd.move();
    if (e.t === "end") { b.done = true; if (e.result === "win") Snd.win(); else Snd.lose(); }
  }

    const b = G.battle;
    G.result = b.result;

      G.gained = G.stage.reward.slice();

    }

    // --- message window
    win(8, 220, 304, 60);
    txt(b.msg[0], 20, 230, 0);
    txt(b.msg[1], 20, 254, 0);

    // --- floating damage numeral, the clearest "this is a game" cue
    if (b.pop && b.pop.life > 0) {
      const rise = (16 - b.pop.life) / 2;
      const y = b.pop.y - rise;
      txt(b.pop.v, b.pop.x + 2, y + 2, 3, FONT_BIG);
      txt(b.pop.v, b.pop.x, y, 0, FONT_BIG);
    }

    if (b.done && Math.floor(G.frame / 12) % 2 === 0) txt("▼", 290, 254, 0);
  }

  // ---- result
  function drawResult() {
    const won = G.result === "win";
    field();
    patFill(PAT_GROUND, 0, 96, W, 22);
    rect(0, 94, W, 2, 0);

    sprite(won ? "hero" : G.stage.sprite, 128, 32, 2);
    shadow(160, 100, 54);

    const head = won ? "しょうり！" : G.result === "lose" ? "はいぼく…" : "じかんぎれ";
    rect(8, 8, 304, 26, 0);
    txtMid(head, 11, 3);

    if (won) {
      titledWin(8, 128, 304, 108, G.gained.length ? "カードを おぼえた！" : "クリアずみ");
      if (G.gained.length) {
        G.gained.forEach((id, i) => {
          const c = CARDS[id], y = 158 + i * 30;
          rect(24, y, 272, 26, 0);
          rect(26, y + 2, 268, 22, 3);
          kindIcon(c.kind, 32, y + 7);
          txt(c.name, 48, y + 3, 0);
          txtR(c.desc.length > 16 ? c.desc.slice(0, 16) : c.desc, 290, y + 3, 1);
        });
      } else {
        txt("この ステージは クリアずみ。", 24, 170);
      }
    } else {
      titledWin(8, 128, 304, 108, "ヒント");
      txt("さくせんを くみなおして", 24, 158);
      txt("もういちど いどもう。", 24, 182);
      txt(G.stage.hint.slice(0, 20), 24, 206, 1);
    }

    hintWin(250, [["A", "さくせん"], ["B", "マップ"]]);
  }

  // ---- ending
  function drawEnding() {
    field();
    patFill(PAT_GROUND, 0, 120, W, 24);
    rect(0, 118, W, 2, 0);
    rect(8, 8, 304, 26, 0);
    txtMid("ぜんステージ クリア！", 11, 3);
    sprite("dragon", 128, 56, 2);
    shadow(160, 124, 54);
    win(8, 152, 304, 94);
    txt("さくせんだけで りゅうを たおした。", 20, 166);
    txt("つよさは ステータスでは なく", 20, 190);
    txt("くみたてた さくせんの ことだった。", 20, 214);
    hintWin(254, [["A", "タイトルへ"]]);
  }

  // ------------------------------------------------------------- drawing
  function draw() {
    switch (G.screen) {
      case "title": drawTitle(); break;
      case "howto": drawHowto(); break;
      case "map": drawMap(); break;
      case "info": drawInfo(); break;
      case "deck": drawDeck(); break;
      case "pick": drawPick(); break;
      case "battle": drawBattle(); break;
      case "result": drawResult(); break;
      case "ending": drawEnding(); break;
    }
    quantize();
  }

  // --------------------------------------------------------------- input
  function saveDeck() {
    if (!G.stage) return;
    save.decks[G.stage.id] = G.deck.slice();
    writeSave();
  }

  function press(btn) {
    Snd.init();
    const s = G.screen;

    if (s === "title") {
      if (btn === "START" || btn === "A") { Snd.ok(); setScreen("map"); }
      else if (btn === "SELECT") { Snd.ok(); G.howtoPage = 0; setScreen("howto"); }
      return;
    }

    if (s === "howto") {
      if (btn === "A" || btn === "RIGHT" || btn === "START") {
        if (G.howtoPage < HOWTO.length - 1) { G.howtoPage++; Snd.move(); }
        else { Snd.back(); setScreen("title"); }
      } else if (btn === "LEFT") { if (G.howtoPage > 0) { G.howtoPage--; Snd.move(); } }
      else if (btn === "B") { Snd.back(); setScreen("title"); }
      return;
    }

    if (s === "map") {
      if (btn === "UP" || btn === "LEFT") { G.mapCur = (G.mapCur + STAGES.length - 1) % STAGES.length; Snd.move(); }
      else if (btn === "DOWN" || btn === "RIGHT") { G.mapCur = (G.mapCur + 1) % STAGES.length; Snd.move(); }
      else if (btn === "A" || btn === "START") {
        const st = STAGES[G.mapCur];
        if (!stageUnlocked(st)) { Snd.back(); return; }
        Snd.ok();
        G.stage = st; G.deck = deckOf(st.id); G.deckCur = 0;
        setScreen("info");
      } else if (btn === "B") { Snd.back(); setScreen("title"); }
      return;
    }

    if (s === "info") {
      if (btn === "A" || btn === "START") { Snd.ok(); setScreen("deck"); }
      else if (btn === "B") { Snd.back(); setScreen("map"); }
      return;
    }

    if (s === "deck") {
      if (btn === "UP") { G.deckCur = (G.deckCur + MAX_DECK - 1) % MAX_DECK; Snd.move(); }
      else if (btn === "DOWN") { G.deckCur = (G.deckCur + 1) % MAX_DECK; Snd.move(); }
      else if (btn === "LEFT" || btn === "RIGHT") {
        const j = btn === "LEFT" ? G.deckCur - 1 : G.deckCur + 1;
        if (G.deckCur < G.deck.length && j >= 0 && j < G.deck.length) {
          const t = G.deck[G.deckCur]; G.deck[G.deckCur] = G.deck[j]; G.deck[j] = t;
          G.deckCur = j; Snd.move(); saveDeck();
        } else Snd.back();
      } else if (btn === "A") { Snd.ok(); G.pickCur = 0; setScreen("pick"); }
      else if (btn === "SELECT") {
        if (G.deckCur < G.deck.length && G.deck.length > 1) {
          G.deck.splice(G.deckCur, 1);
          if (G.deckCur >= G.deck.length) G.deckCur = Math.max(0, G.deck.length - 1);
          Snd.back(); saveDeck();
        } else Snd.back();
      } else if (btn === "START") {
        if (!G.deck.length) { Snd.back(); return; }
        saveDeck(); Snd.ok(); startBattle();
      } else if (btn === "B") { saveDeck(); Snd.back(); setScreen("map"); }
      return;
    }

    if (s === "pick") {
      const n = ALL_CARDS.length;
      if (btn === "UP") { G.pickCur = (G.pickCur + n - 2) % n; Snd.move(); }
      else if (btn === "DOWN") { G.pickCur = (G.pickCur + 2) % n; Snd.move(); }
      else if (btn === "LEFT") { G.pickCur = (G.pickCur + n - 1) % n; Snd.move(); }
      else if (btn === "RIGHT") { G.pickCur = (G.pickCur + 1) % n; Snd.move(); }
      else if (btn === "A" || btn === "START") {
        const id = ALL_CARDS[G.pickCur];
        if (ownedCards().indexOf(id) < 0) { Snd.back(); return; }
        if (G.deckCur < G.deck.length) G.deck[G.deckCur] = id;
        else if (G.deck.length < MAX_DECK) { G.deck.push(id); G.deckCur = G.deck.length - 1; }
        saveDeck(); Snd.ok(); setScreen("deck");
      } else if (btn === "B") { Snd.back(); setScreen("deck"); }
      return;
    }

    if (s === "battle") {
      const b = G.battle;
      if (b.done && (btn === "A" || btn === "START" || btn === "B")) { finishBattle(); return; }
      if (btn === "A") { b.speed = 8; stepBattle(); }
      else if (btn === "START") { while (!b.done) stepBattle(); }
      return;
    }

    if (s === "result") {
      if (btn === "A" || btn === "START") {
        Snd.ok();
        if (G.result === "win" && G.stage.id === STAGES[STAGES.length - 1].id) { setScreen("ending"); return; }
        setScreen("deck");
      } else if (btn === "B") { Snd.back(); setScreen("map"); }
      return;
    }

    if (s === "ending") {
      if (btn === "A" || btn === "B" || btn === "START") { Snd.ok(); setScreen("title"); }
      return;
    }
  }

  document.querySelectorAll("[data-btn]").forEach((el) => {
    el.addEventListener("pointerdown", (ev) => { ev.preventDefault(); press(el.dataset.btn); });
  });

  const KEYMAP = {
    ArrowUp: "UP", ArrowDown: "DOWN", ArrowLeft: "LEFT", ArrowRight: "RIGHT",
    z: "A", Z: "A", x: "B", X: "B", Enter: "START", Shift: "SELECT", " ": "A",
  };
  window.addEventListener("keydown", (e) => {
    const b = KEYMAP[e.key];
    if (!b) return;
    e.preventDefault();
    press(b);
  });

  // ---------------------------------------------------------------- loop
  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < 33) return;
    last = t;
    G.frame++;

    const b = G.battle;
    if (b) {
      if (b.flashE > 0) b.flashE--;
      if (b.flashP > 0) b.flashP--;
      if (b.lungeP > 0) b.lungeP--;
      if (b.lungeE > 0) b.lungeE--;
      if (b.pop && b.pop.life > 0) b.pop.life--;
      if (G.screen === "battle" && !b.done) {
        b.timer++;
        if (b.i < 0 || b.timer >= b.speed / 2) { b.timer = 0; stepBattle(); }
      }
    }
    draw();
  }

  loadSave();
  const boot = () => { initPatterns(); draw(); requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.load) {
    Promise.race([
      document.fonts.load('16px "DotGothic16"').then(() => document.fonts.ready),
      new Promise((r) => setTimeout(r, 1500)),
    ]).then(boot, boot);
  } else boot();
})();
</script>
</body>
</html>
