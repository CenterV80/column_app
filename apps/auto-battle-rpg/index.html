  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --shell: #b8b6a8;
    --shell-dark: #8f8d80;
    --shell-light: #d4d2c4;
    --bezel: #4a4a52;
    --bezel-line: #6d6d76;
    --btn: #9a2c50;
    --btn-dark: #6d1d38;
    --pad: #33333a;
    --pad-dark: #1e1e24;
    --screen-on: #9bbc0f;
    --page: #2a2a30;
    --page-text: #d8d6c8;
  }

  body {
    background: var(--page);
    color: var(--page-text);
    font-family: "DotGothic16", "Hiragino Sans", monospace;
    display: flex;
    justify-content: center;
    padding: 10px;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  #console {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ---- handheld shell ---- */
  #shell {
    background: linear-gradient(160deg, var(--shell-light) 0%, var(--shell) 30%, var(--shell-dark) 100%);
    border-radius: 10px 10px 42px 10px;
    padding: 12px 12px 16px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.25), 0 6px 0 #6f6d61, 0 10px 18px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #bezel {
    background: var(--bezel);
    border-radius: 8px 8px 26px 8px;
    padding: 10px 14px 12px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.6);
  }

  .bezel-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }
  .bezel-rule { flex: 1; height: 1px; background: var(--bezel-line); }
  .bezel-rule.left { margin-right: 8px; }
  .bezel-rule.right { margin-left: 8px; }
  .bezel-title {
    font-size: 8px;
    letter-spacing: .18em;
    color: #b9b7c4;
  }

  #screen-wrap { position: relative; display: block; }

  canvas#screen {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 320 / 288;
    background: var(--screen-on);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .power {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 8px;
    letter-spacing: .1em;
    color: #b9b7c4;
    margin-top: 6px;
  }
  .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ff4d4d;
    box-shadow: 0 0 6px #ff4d4d;
  }

  #brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 4px;
  }
  #brand .logo {
    font-size: 15px;
    letter-spacing: .04em;
    color: #3b3a63;
  }
  #brand .sub {
    font-size: 8px;
    letter-spacing: .12em;
    color: #6b6a58;
  }

  /* ---- controls ---- */
  #pads {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px;
  }

  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 34px);
    grid-template-rows: repeat(3, 34px);
  }
  #dpad button {
    background: var(--pad);
    border: none;
    color: #cfcfd8;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  #dpad button:active { background: var(--pad-dark); }
  #dpad .up { grid-area: 1 / 2; border-radius: 6px 6px 0 0; }
  #dpad .left { grid-area: 2 / 1; border-radius: 6px 0 0 6px; }
  #dpad .mid { grid-area: 2 / 2; background: var(--pad); }
  #dpad .right { grid-area: 2 / 3; border-radius: 0 6px 6px 0; }
  #dpad .down { grid-area: 3 / 2; border-radius: 0 0 6px 6px; }
  #dpad .mid::after {
    content: "";
    display: block;
    width: 12px; height: 12px;
    border-radius: 50%;

<script>
(function () {
  "use strict";

  // =====================================================================
  // ENGINE START  (dev-scripts/verify-auto-battle.js extracts this block)
  // =====================================================================

  const CARDS = {
    attack:   { id:"attack",   name:"こうげき",     kind:"action", short:"こうげき",
                desc:"こうげき力ぶん てきに ダメージ" },
    heal:     { id:"heal",     name:"かいふく",     kind:"action", short:"かいふく",
                desc:"じぶんの HPを 3かいふく する" },
    guard:    { id:"guard",    name:"ぼうぎょ",     kind:"state",  short:"ぼうぎょ",
                desc:"このターン うけるダメージ-4 1バトル1かい" },
    reckless: { id:"reckless", name:"すてみ",       kind:"action", short:"すてみ",
                desc:"HP-2 して こうげき力+2" },
    plus2:    { id:"plus2",    name:"+2",           kind:"boost",  short:"+2",
                desc:"こうげき力+2 1バトルに1かい" },
    times2:   { id:"times2",   name:"×2",           kind:"boost",  short:"×2",
                desc:"こうげき力×2 1バトルに1かい" },
    power:    { id:"power",    name:"るいじょう",   kind:"boost",  short:"るいじょう", needAwaken:true,
                desc:"こうげき力を 2じょう かくせい中のみ" },
    ifPinch:  { id:"ifPinch",  name:"ピンチ?",      kind:"cond",   short:"ピンチ?",
                desc:"じぶんの HPが 2いかなら すすむ" },
    ifHalf:   { id:"ifHalf",   name:"HPはんぶん?",  kind:"cond",   short:"はんぶん?",
                desc:"じぶんの HPが はんぶんいかなら" },
    ifStrong: { id:"ifStrong", name:"つよこうげき?",kind:"cond",   short:"つよこう?",
                desc:"てきの つぎの手が つよこうげきなら" },
  };

  const START_CARDS = ["attack", "heal"];

  const STAGES = [
    {
      id: 1, name: "スライム", sprite: "slime", hp: 6, armor: 0,
      pattern: [{ t:"attack", v:2 }],
      reward: ["reckless", "plus2"],
      hint: "まいターン こうげき2。まずは なぐり合いで かてる。",
    },
    {
      id: 2, name: "ゴブリン", sprite: "goblin", hp: 12, armor: 0,
      pattern: [{ t:"attack", v:3 }, { t:"attack", v:3 }, { t:"strong", v:6 }],
      reward: ["guard", "ifStrong"],
      hint: "3ターンめに つよこうげき6。こうげき力を あげないと 3ターンで たおせない。",
    },
    {
      id: 3, name: "ゴーレム", sprite: "golem", hp: 12, armor: 1,
      pattern: [{ t:"attack", v:3 }, { t:"charge" }, { t:"strong", v:9 }],
      reward: ["times2", "ifHalf"],
      hint: "ダメージを1へらす いわのからだ。つよこうげき9は ぼうぎょで うけろ。",
    },
    {
      id: 4, name: "ウィッチ", sprite: "witch", hp: 26, armor: 0,
      pattern: [{ t:"attack", v:2 }, { t:"heal", v:3 }, { t:"attack", v:2 }, { t:"strong", v:6 }],
      reward: ["power", "ifPinch"],
      hint: "じぶんを 3かいふくする。けずる はやさで まけると たおせない。",
    },
    {
      id: 5, name: "らいりゅう", sprite: "dragon", hp: 34, armor: 1,
      pattern: [{ t:"attack", v:3 }, { t:"attack", v:3 }, { t:"charge" }, { t:"strong", v:10 }],
      reward: [],
      hint: "HP30。ふつうに たたかっては ぜったいに たりない。ピンチで かくせいし るいじょうを うて。",
    },
  ];

  const MAX_DECK = 6;
  const MAX_TURNS = 30;
  const PLAYER_MAX_HP = 10;
  const PLAYER_BASE_ATK = 2;
  const AWAKEN_HP = 2;

  // Jump target when a condition fails: skip past this block's action card.
  function skipBlock(deck, i) {
    for (let j = i + 1; j < deck.length; j++) {
      if (CARDS[deck[j]].kind === "action") return j + 1;
    }
    return deck.length;
  }

  function nextEnemyAct(stage, idx) {
    return stage.pattern[idx % stage.pattern.length];
  }

  function evalCond(id, P, E, stage) {
    if (id === "ifPinch") return P.hp <= AWAKEN_HP;
    if (id === "ifHalf") return P.hp * 2 <= P.maxHp;
    if (id === "ifStrong") return nextEnemyAct(stage, E.idx).t === "strong";
    return false;
  }

  // Fully deterministic: the same deck against the same stage always
  // produces the same event list. No randomness anywhere.
  function simulate(stage, deck) {
    const P = { hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP, atk: PLAYER_BASE_ATK,
                awaken: false, used: {}, guard: 0 };
    const E = { hp: stage.hp, maxHp: stage.hp, armor: stage.armor || 0, idx: 0 };
    const events = [];
    let result = "draw";

    const snap = () => ({
      php: P.hp, patk: P.atk, ehp: E.hp, awaken: P.awaken,
      used: Object.assign({}, P.used), eidx: E.idx, guard: P.guard,
    });
    const push = (o) => { o.s = snap(); events.push(o); };

    const checkAwaken = () => {
      if (P.hp > 0 && P.hp <= AWAKEN_HP && !P.awaken) {
        P.awaken = true;
        push({ t: "awaken" });
      }
    };

    for (let turn = 1; turn <= MAX_TURNS; turn++) {
      push({ t: "turn", turn });

      let i = 0, acted = false;
      while (i < deck.length) {
        const c = CARDS[deck[i]];

        if (c.kind === "cond") {
          const ok = evalCond(c.id, P, E, stage);
          push({ t: "cond", card: c.id, idx: i, ok });
          i = ok ? i + 1 : skipBlock(deck, i);
          continue;
        }

        // Boosts and states are once-per-battle resources: they resolve
        // without ending the turn, so a block can brace and still act.
        if (c.kind === "boost" || c.kind === "state") {
          const blocked = P.used[c.id] ? "used" : (c.needAwaken && !P.awaken ? "noawaken" : null);
          if (blocked) {
            push({ t: "boostFail", card: c.id, idx: i, reason: blocked });
          } else if (c.id === "guard") {
            P.guard = 4;
            P.used[c.id] = true;
            push({ t: "guard", card: c.id, idx: i });
          } else {
            const from = P.atk;
            if (c.id === "plus2") P.atk += 2;
            else if (c.id === "times2") P.atk *= 2;
            else if (c.id === "power") { P.atk = P.atk * P.atk; P.awaken = false; }
            P.used[c.id] = true;
            push({ t: "boost", card: c.id, idx: i, from, to: P.atk });
          }
          i++;
          continue;
        }

        acted = true;
        if (c.id === "attack") {
          const dmg = Math.max(1, P.atk - E.armor);
          E.hp -= dmg;
          push({ t: "attack", card: c.id, idx: i, dmg });
        } else if (c.id === "heal") {
          const before = P.hp;
          P.hp = Math.min(P.maxHp, P.hp + 3);
          push({ t: "heal", card: c.id, idx: i, amt: P.hp - before });
        } else if (c.id === "reckless") {
          P.hp -= 2; P.atk += 2;
          push({ t: "reckless", card: c.id, idx: i });
        }
        break;
      }
      if (!acted) push({ t: "idle" });

      checkAwaken();
      if (E.hp <= 0) { result = "win"; break; }
      if (P.hp <= 0) { result = "lose"; break; }

      const act = nextEnemyAct(stage, E.idx);
      E.idx++;
      if (act.t === "attack" || act.t === "strong") {
        const dmg = Math.max(0, act.v - P.guard);
        P.hp -= dmg;
        push({ t: "enemyAtk", kind: act.t, raw: act.v, dmg, guarded: P.guard > 0 });
      } else if (act.t === "charge") {
        push({ t: "enemyCharge" });
      } else if (act.t === "heal") {
        const before = E.hp;
        E.hp = Math.min(E.maxHp, E.hp + act.v);
        push({ t: "enemyHeal", amt: E.hp - before });
      }
      P.guard = 0;

      checkAwaken();
      if (P.hp <= 0) { result = "lose"; break; }
      if (E.hp <= 0) { result = "win"; break; }
    }

    push({ t: "end", result });
    return { events, result };
  }

  // =====================================================================
  // ENGINE END
  // =====================================================================

  // ---------------------------------------------------------------- art
  // 16x16 sprites. '.'=transparent, a=darkest .. d=lightest
  const SPRITES = {
    slime: [
      "................",

      "...abbbbbbbba...",

    ],
    goblin: [
      "................",
      "..a..........a..",
      "..aa........aa..",
      "..aba......aba..",
      "..abba....abba..",
      "...abbaaaabba...",
      "...abbbbbbbba...",
      "..abbabbbbabba..",
      "..abbbbbbbbbba..",
      "..abbbaaaabbba..",

      "..abbaabbaabba..",

    ],
    witch: [
      "........a.......",
      ".......aba......",
      "......abbba.....",
      ".....abbbbba....",
      "....abbbbbbba...",
      "..aaaaaaaaaaaaa.",
      "......acca......",

    ],
    hero: [
      "................",
      ".....aaaa.......",
      "....abbbba......",
      "....abccba......",
      "....abccba...a..",
      ".....abba....a..",
      "...aaabbaaa..a..",
      "..abbbbbbbba.a..",
      "..abbbbbbbbbaa..",
      "..abbbbbbbba.a..",
      "...abbbbbba..a..",
      "....abbbba...a..",
      "....ab..ba......",
      "....ab..ba......",
      "...aab..baa.....",
      "................",
    ],
  };

  const TONE = { a: 0, b: 1, c: 2, d: 3 };

  // ------------------------------------------------------------ renderer
  const W = 320, H = 288;
  const PAL = [[15,56,15], [48,98,48], [139,172,15], [155,188,15]];
  const cv = document.getElementById("screen");
  const ctx = cv.getContext("2d", { willReadFrequently: true });

  function fill(tone) { ctx.fillStyle = rgb(tone); ctx.fillRect(0, 0, W, H); }
  function rgb(t) { const c = PAL[t]; return `rgb(${c[0]},${c[1]},${c[2]})`; }
  function rect(x, y, w, h, tone) { ctx.fillStyle = rgb(tone); ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

  function setFont(size) { ctx.font = `${size}px "DotGothic16", monospace`; }
  function txt(s, x, y, tone, size) {
    setFont(size || 16);
    ctx.fillStyle = rgb(tone === undefined ? 0 : tone);
    ctx.textBaseline = "top";
    ctx.fillText(s, x | 0, y | 0);
  }
  function txtW(s, size) { setFont(size || 16); return ctx.measureText(s).width; }
  function txtCenter(s, y, tone, size) { txt(s, (W - txtW(s, size)) / 2, y, tone, size); }

  // Classic menu window: solid frame, light interior.
  function win(x, y, w, h, opts) {
    const o = opts || {};
    rect(x, y, w, h, o.fill === undefined ? 3 : o.fill);
    rect(x, y, w, 2, 0); rect(x, y + h - 2, w, 2, 0);
    rect(x, y, 2, h, 0); rect(x + w - 2, y, 2, h, 0);
    rect(x + 3, y + 3, w - 6, 1, 1); rect(x + 3, y + h - 4, w - 6, 1, 1);
    rect(x + 3, y + 3, 1, h - 6, 1); rect(x + w - 4, y + 3, 1, h - 6, 1);
  }

  function label(s, x, y) {
    const w = txtW(s, 12) + 8;
    rect(x, y, w, 14, 3);
    txt(s, x + 4, y + 1, 0, 12);
  }

  function bar(x, y, w, ratio, h) {
    const hh = h || 8;
    rect(x, y, w, hh, 0);
    rect(x + 1, y + 1, w - 2, hh - 2, 3);
    const inner = Math.max(0, Math.round((w - 4) * Math.max(0, Math.min(1, ratio))));
    rect(x + 2, y + 2, inner, hh - 4, 1);
  }

  function sprite(name, x, y, scale, flash) {
    const art = SPRITES[name];
    if (!art) return;
    const s = scale || 3;
    for (let r = 0; r < art.length; r++) {
      const row = art[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === "." || ch === " ") continue;
        let tone = TONE[ch];
        if (flash) tone = tone === 0 ? 2 : 3;
        rect(x + c * s, y + r * s, s, s, tone);
      }
    }
  }

  function cursor(x, y, tone) {
    const t = tone === undefined ? 0 : tone;
    for (let i = 0; i < 5; i++) {
      rect(x, y + i, 5 - i, 1, t);
      rect(x, y + 9 - i, 5 - i, 1, t);
    }
  }

  // Snap everything (including antialiased text) to the 4-tone palette.
  function quantize() {
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const lum = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
      let best = 0, bestD = 1e9;
      for (let p = 0; p < 4; p++) {
        const c = PAL[p];
        const pl = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
        const dist = Math.abs(pl - lum);
        if (dist < bestD) { bestD = dist; best = p; }
      }
      d[i] = PAL[best][0]; d[i + 1] = PAL[best][1]; d[i + 2] = PAL[best][2]; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  // --------------------------------------------------------------- audio
  const Snd = {
    ac: null, on: true,
    init() {
      if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ac = new AC();
    },
    tone(freq, dur, when, vol) {
      if (!this.on || !this.ac) return;
      const t0 = this.ac.currentTime + (when || 0);
      const osc = this.ac.createOscillator();
      const g = this.ac.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol === undefined ? 0.05 : vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.ac.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.01);
    },
    move() { this.tone(520, 0.05); },
    ok() { this.tone(700, 0.06); this.tone(950, 0.08, 0.06); },
    back() { this.tone(320, 0.08); },
    hit() { this.tone(180, 0.08); this.tone(120, 0.1, 0.05); },
    hurt() { this.tone(140, 0.14, 0, 0.06); },
    buff() { this.tone(600, 0.05); this.tone(800, 0.05, 0.05); this.tone(1000, 0.07, 0.1); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, i * 0.12)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, i * 0.16)); },
  };

  // ---------------------------------------------------------------- save
  const SAVE_KEY = "abrpg.save.v2";
  const save = { cleared: [], seen: [], decks: {} };

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (Array.isArray(o.cleared)) save.cleared = o.cleared;
      if (Array.isArray(o.seen)) save.seen = o.seen;
      if (o.decks && typeof o.decks === "object") save.decks = o.decks;
    } catch (e) { /* private mode etc: play without saving */ }
  }
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }
  }

  function ownedCards() {
    const owned = START_CARDS.slice();
    STAGES.forEach((st) => {
      if (save.cleared.indexOf(st.id) >= 0) st.reward.forEach((c) => { if (owned.indexOf(c) < 0) owned.push(c); });
    });
    return owned;
  }
  function stageUnlocked(st) {
    return st.id === 1 || save.cleared.indexOf(st.id - 1) >= 0;
  }
  function deckOf(stageId) {
    const d = save.decks[stageId];
    return Array.isArray(d) ? d.slice() : ["attack"];
  }

  // ---------------------------------------------------------------- game
  const G = {
    screen: "title",
    frame: 0,
    mapCur: 0,
    stage: null,
    deck: [],
    deckCur: 0,
    pickCur: 0,
    howtoPage: 0,

  // ---- title
  function drawTitle() {
    fill(3);
    rect(0, 0, W, 92, 1);
    for (let x = 0; x < W; x += 8) rect(x, 92, 4, 3, 0);
    sprite("dragon", 232, 18, 4);
    txt("オート", 20, 22, 3, 26);
    txt("バトル", 20, 48, 3, 26);
    txt("RPG", 118, 48, 3, 26);
    txt("- TACTICS BOY -", 20, 100, 1, 12);

    win(24, 128, 272, 92);
    txt("カードで さくせんを くみ", 44, 144, 0, 16);
    txt("あとは じどうで たたかう", 44, 166, 0, 16);
    txt("らんすうは いっさい なし。", 44, 190, 1, 14);

    if (Math.floor(G.frame / 20) % 2 === 0) txtCenter("PRESS START", 238, 0, 16);
    txtCenter("SELECT: あそびかた", 264, 1, 12);
  }

  // ---- how to play
  const HOWTO = [
    {
      title: "1. さくせんの くみかた",
      lines: [
        "カードを たてに ならべると",
        "それが そのまま さくせんに",
        "なる。うえから じゅんばんに",
        "よみとられる。",
        "",
        "◇じょうけん △きょうか",
        "■まもり ●こうどう の 4しゅるい。",
      ],
    },
    {
      title: "2. 1ターンの ながれ",
      lines: [
        "うえから カードを よむ",
        " ・じょうけん: せいりつ→つぎへ",
        "   ふせいりつ→この ブロックを",
        "   とばして つぎの さくせんへ",
        " ・きょうか: こうげき力をあげる",
        " ・こうどう: じっこうして",
        "   ターンしゅうりょう",
      ],
    },
    {
      title: "3. ブロックの かたち",
      lines: [
        "[ピンチ?]  ←じょうけん",
        "  るいじょう ←きょうか",
        "  こうげき   ←こうどう",
        "[こうげき]  ←ふだんは これ",
        "",
        "うえの ブロックが だめなら",
        "したの ブロックが つかわれる。",
      ],
    },
    {
      title: "4. たいせつな ルール",
      lines: [
        "・きょうかカードは 1バトルに",
        "  1かいだけ。つかう じゅんばんで",
        "  けっかが かわる (+2→×2=8)",
        "・HP2いかで「かくせい」。",
        "  るいじょうは かくせい中のみ。",
        "・てきの こうどうは かたまり。",
        "  よんで さきに てを うて。",
      ],
    },
  ];

  function drawHowto() {
    fill(3);
    rect(0, 0, W, 26, 1);
    txt("あそびかた " + (G.howtoPage + 1) + "/" + HOWTO.length, 8, 4, 3, 16);
    const p = HOWTO[G.howtoPage];
    txt(p.title, 12, 36, 0, 16);
    rect(12, 58, W - 24, 2, 1);
    p.lines.forEach((l, i) => txt(l, 14, 68 + i * 22, 0, 16));
    rect(0, H - 22, W, 22, 1);
    txt("A/→: つぎ   B: もどる", 8, H - 20, 3, 14);
  }

  // ---- map
  function drawMap() {
    fill(3);
    rect(0, 0, W, 26, 1);
    txt("ステージ せんたく", 8, 4, 3, 16);
    txt("カード " + ownedCards().length + "/" + Object.keys(CARDS).length, 210, 6, 3, 14);

    STAGES.forEach((st, i) => {
      const y = 34 + i * 40;
      const open = stageUnlocked(st);
      const clear = save.cleared.indexOf(st.id) >= 0;
      win(20, y, 280, 34, { fill: 3 });
      if (i === G.mapCur) cursor(26, y + 12, 0);
      const nm = open ? st.id + ". " + st.name : st.id + ". ？？？？";
      txt(nm, 38, y + 8, open ? 0 : 1, 16);
      if (clear) txt("クリア", 236, y + 10, 1, 14);
      else if (!open) txt("ロック", 236, y + 10, 1, 14);
      else txt("HP" + st.hp, 240, y + 10, 1, 14);
    });

    rect(0, H - 22, W, 22, 1);
    txt("A: すすむ   B: タイトル", 8, H - 20, 3, 14);
  }

  // ---- enemy info
  function actName(a) {
    if (a.t === "attack") return "こうげき" + a.v;
    if (a.t === "strong") return "つよこうげき" + a.v;
    if (a.t === "charge") return "ためる";
    if (a.t === "heal") return "かいふく" + a.v;
    return "？";
  }

  function drawInfo() {
    const st = G.stage;
    const seen = save.seen.indexOf(st.id) >= 0;
    fill(3);
    rect(0, 0, W, 26, 1);
    txt("てきの じょうほう", 8, 4, 3, 16);

    sprite(st.sprite, 24, 40, 4);
    txt(st.name, 116, 44, 0, 20);
    txt("HP " + st.hp, 116, 70, 0, 16);
    if (st.armor) txt("ダメージ -" + st.armor, 116, 92, 0, 16);

    win(16, 116, 288, 84);
    txt("こうどう パターン", 28, 124, 1, 14);
    if (seen) {
      st.pattern.forEach((a, i) => {
        const y = 144 + Math.floor(i / 2) * 22;
        const x = 28 + (i % 2) * 140;
        txt((i + 1) + ") " + actName(a), x, y, 0, 16);
      });
    } else {
      txt("？？？", 28, 146, 0, 16);
      txt("1どでも たたかえば わかる", 28, 170, 1, 14);
    }

    win(16, 206, 288, 54);
    txt(seen ? st.hint : "まずは たたかって かんさつしよう", 28, 222, 0, 14);

    rect(0, H - 22, W, 22, 1);
    txt("A: さくせんへ   B: もどる", 8, H - 20, 3, 14);
  }

  // ---- deck edit
  // Returns depth per card so conditional blocks read as indented groups.
  function deckIndents(deck) {
    const out = [];
    let inBlock = false;
    deck.forEach((id) => {
      const c = CARDS[id];
      if (c.kind === "cond") { out.push(0); inBlock = true; return; }
      out.push(inBlock ? 1 : 0);
      if (c.kind === "action") inBlock = false;
    });
    return out;
  }

  function drawDeck() {
    fill(3);
    rect(0, 0, W, 26, 1);
    txt("さくせん", 8, 4, 3, 16);
    txt("VS " + G.stage.name, 150, 6, 3, 14);

    win(12, 32, 296, 150);
    const ind = deckIndents(G.deck);
    for (let i = 0; i < MAX_DECK; i++) {
      const y = 42 + i * 23;
      if (i === G.deckCur) cursor(20, y + 4, 0);
      if (i >= G.deck.length) { txt("- - -", 40, y, 1, 16); continue; }
      const c = CARDS[G.deck[i]];
      const x = 40 + ind[i] * 18;
      if (ind[i] === 1) rect(x - 10, y + 2, 2, 14, 1);
      const nm = c.kind === "cond" ? "[" + c.name + "]" : c.name;
      txt(nm, x, y, 0, 16);
      if (c.kind === "boost" || c.kind === "state") txt("1かい", 244, y + 2, 1, 12);
    }

    win(12, 188, 296, 52);
    const cur = G.deck[G.deckCur];
    txt(cur ? CARDS[cur].desc : "あきスロット  Aで カードを ついか", 24, 204, 0, 14);
    txt(cur ? "" : "", 24, 220, 1, 14);

    rect(0, 246, W, 42, 1);
    txt("A:ついか/こうかん  B:もどる", 8, 250, 3, 13);
    txt("SELECT:けす  ←→:いれかえ  START:たたかう", 8, 268, 3, 13);
  }

  // ---- card picker
  function drawPick() {
    const owned = ownedCards();
    fill(3);
    rect(0, 0, W, 26, 1);
    txt("カードを えらぶ", 8, 4, 3, 16);

    win(12, 32, 296, 186);
    owned.forEach((id, i) => {
      const c = CARDS[id];
      const y = 42 + i * 17;
      if (i === G.pickCur) cursor(20, y + 2, 0);
      const kindMark = c.kind === "cond" ? "◇" : c.kind === "boost" ? "△" : c.kind === "state" ? "■" : "●";
      txt(kindMark + " " + c.name, 38, y - 1, 0, 15);
    });

    win(12, 224, 296, 44);
    txt(CARDS[owned[G.pickCur]].desc, 24, 238, 0, 14);

    rect(0, H - 20, W, 20, 1);
    txt("◇じょうけん △きょうか ■まもり ●こうどう  B:やめる", 8, H - 19, 3, 11);
  }

  // ---- battle
  function startBattle() {
    const sim = simulate(G.stage, G.deck);
    G.battle = {
      events: sim.events,
      result: sim.result,
      i: -1,
      state: { php: PLAYER_MAX_HP, patk: PLAYER_BASE_ATK, ehp: G.stage.hp, awaken: false, used: {}, eidx: 0 },
      msg: ["", ""],
      cardIdx: -1,
      turn: 1,
      timer: 0,
      speed: 34,
      flashE: 0,
      flashP: 0,
      shake: 0,
      done: false,
    };
    if (save.seen.indexOf(G.stage.id) < 0) { save.seen.push(G.stage.id); writeSave(); }
    setScreen("battle");
  }

  function eventText(e) {
    const c = e.card ? CARDS[e.card] : null;
    switch (e.t) {
      case "turn": return ["- ターン " + e.turn + " -", ""];
      case "cond": return ["[" + c.name + "]", e.ok ? "→ せいりつ！ つぎへ" : "→ ふせいりつ とばす"];
      case "boost": return [c.name + " はつどう！", "こうげき力 " + e.from + " → " + e.to];
      case "boostFail": return [c.name + " は つかえない", e.reason === "used" ? "→ もう つかった" : "→ かくせい していない"];
      case "attack": return ["こうげき！", "てきに " + e.dmg + " ダメージ"];
      case "heal": return ["かいふく！", e.amt > 0 ? "HPが " + e.amt + " かいふく" : "HPは まんタン"];
      case "guard": return ["ぼうぎょの かまえ！", "つぎの ダメージ -4"];
      case "reckless": return ["すてみ！", "HP-2 こうげき力+2"];
      case "idle": return ["ようすを みている…", "じっこうできる カードが ない"];
      case "awaken": return ["HPが 2いか！", "かくせい した！"];
      case "enemyAtk": return [e.kind === "strong" ? "てきの つよこうげき！" : "てきの こうげき！",
                               e.guarded ? e.dmg + " ダメージ (ぼうぎょ)" : e.dmg + " ダメージ"];
      case "enemyCharge": return ["てきは ちからを ためている", "つぎの こうげきに ちゅうい"];
      case "enemyHeal": return ["てきは じぶんを かいふくした", "HPが " + e.amt + " もどった"];
      case "end": return [e.result === "win" ? "てきを たおした！" : e.result === "lose" ? "ちからつきた…" : "じかんぎれ…", ""];
      default: return ["", ""];
    }
  }

  function stepBattle() {
    const b = G.battle;
    b.i++;
    if (b.i >= b.events.length) { finishBattle(); return; }
    const e = b.events[b.i];
    b.state = e.s;
    b.msg = eventText(e);
    b.cardIdx = e.idx === undefined ? -1 : e.idx;
    if (e.t === "turn") b.turn = e.turn;
    if (e.t === "attack") { b.flashE = 8; b.shake = 6; Snd.hit(); }
    if (e.t === "enemyAtk" && e.dmg > 0) { b.flashP = 8; b.shake = 6; Snd.hurt(); }
    if (e.t === "boost" || e.t === "awaken") Snd.buff();
    if (e.t === "reckless") Snd.hurt();
    if (e.t === "heal" || e.t === "guard" || e.t === "enemyHeal") Snd.move();
    if (e.t === "end") {
      b.done = true;
      if (e.result === "win") Snd.win(); else Snd.lose();
    }
  }

  function finishBattle() {
    const b = G.battle;
    G.result = b.result;
    G.gained = [];
    if (b.result === "win" && save.cleared.indexOf(G.stage.id) < 0) {
      save.cleared.push(G.stage.id);
      G.gained = G.stage.reward.slice();
      writeSave();
    }
    setScreen("result");
  }

  function drawBattle() {
    const b = G.battle;
    const s = b.state;
    const st = G.stage;
    fill(3);

    const sx = b.shake > 0 ? (b.shake % 2 ? 2 : -2) : 0;

    // enemy panel
    rect(0, 0, W, 24, 1);
    txt(st.name, 8, 3, 3, 16);
    txt("ターン " + b.turn, 232, 5, 3, 14);

    bar(12, 32, 180, s.ehp / st.hp, 10);
    txt("HP " + Math.max(0, s.ehp) + "/" + st.hp, 12, 46, 0, 14);
    const na = nextEnemyAct(st, s.eidx);
    const known = save.seen.indexOf(st.id) >= 0;
    txt("つぎ: " + (known ? actName(na) : "？？？"), 12, 66, na.t === "strong" && known ? 0 : 1, 14);
    if (st.armor) txt("いわのからだ: ダメージ-" + st.armor, 12, 84, 1, 12);

    sprite(st.sprite, 216 + sx, 26, 5, b.flashE > 0);

    // player panel
    rect(0, 108, W, 2, 1);
    sprite("hero", 14 + (b.flashP > 0 ? sx : 0), 118, 4, b.flashP > 0);
    txt("ゆうしゃ", 92, 118, 0, 16);
    bar(92, 140, 150, Math.max(0, s.php) / PLAYER_MAX_HP, 10);
    txt("HP " + Math.max(0, s.php) + "/" + PLAYER_MAX_HP, 92, 154, 0, 14);
    txt("こうげき力 " + s.patk, 92, 174, 0, 16);
    if (s.awaken && Math.floor(G.frame / 8) % 2 === 0) label("かくせい!", 232, 174);

    // deck progress dots
    for (let i = 0; i < G.deck.length; i++) {
      const x = 92 + i * 16, y = 196;
      rect(x, y, 12, 12, 0);
      rect(x + 1, y + 1, 10, 10, i === b.cardIdx ? 0 : 3);
      if (i === b.cardIdx) rect(x + 3, y + 3, 6, 6, 3);
    }
    txt("さくせん", 14, 194, 1, 14);

    // message window
    win(8, 216, 304, 64);
    txt(b.msg[0], 22, 228, 0, 16);
    txt(b.msg[1], 22, 252, b.msg[1].indexOf("ふせいりつ") >= 0 ? 1 : 0, 16);

    if (b.done) {
      if (Math.floor(G.frame / 16) % 2 === 0) txt("▼", 288, 258, 0, 14);
    } else {
      txt("A:はやおくり", 218, 258, 1, 12);
    }
  }

  // ---- result
  function drawResult() {
    fill(3);
    const win_ = G.result === "win";
    rect(0, 0, W, 46, win_ ? 1 : 0);
    txtCenter(win_ ? "しょうり！" : G.result === "lose" ? "はいぼく…" : "じかんぎれ", 12, 3, 24);

    sprite(win_ ? "hero" : G.stage.sprite, 128, 62, 4);

    if (win_) {
      if (G.gained.length) {
        win(24, 132, 272, 92);
        txt("あたらしい カードを おぼえた！", 38, 144, 0, 14);
        G.gained.forEach((id, i) => txt("・" + CARDS[id].name, 46, 168 + i * 22, 0, 16));
      } else {
        win(24, 132, 272, 92);
        txt("この ステージは クリアずみ", 44, 168, 0, 16);
      }
    } else {
      win(24, 132, 272, 92);
      txt("さくせんを くみなおして", 44, 152, 0, 16);
      txt("もういちど いどもう。", 44, 176, 0, 16);
      txt(G.stage.hint, 38, 200, 1, 12);
    }

    rect(0, H - 44, W, 44, 1);
    txt("A: さくせんへ", 8, H - 40, 3, 14);
    txt("B: ステージせんたくへ", 8, H - 20, 3, 14);
  }

  // ---- ending
  function drawEnding() {
    fill(3);
    rect(0, 0, W, 60, 1);
    txtCenter("ぜんステージ クリア！", 20, 3, 20);
    sprite("dragon", 128, 76, 4);
    win(20, 152, 280, 92);
    txt("さくせんだけで りゅうを たおした。", 32, 166, 0, 14);
    txt("つよさは ステータスでは なく", 32, 190, 0, 14);
    txt("くみたてた さくせんの ことだった。", 32, 212, 0, 14);
    rect(0, H - 22, W, 22, 1);
    txt("A: タイトルへ", 8, H - 20, 3, 14);
  }

  // ------------------------------------------------------------- drawing
  function draw() {
    switch (G.screen) {
      case "title": drawTitle(); break;
      case "howto": drawHowto(); break;
      case "map": drawMap(); break;
      case "info": drawInfo(); break;
      case "deck": drawDeck(); break;
      case "pick": drawPick(); break;
      case "battle": drawBattle(); break;
      case "result": drawResult(); break;
      case "ending": drawEnding(); break;
    }
    quantize();
  }

  // --------------------------------------------------------------- input
  function press(btn) {
    Snd.init();
    const s = G.screen;

    if (s === "title") {
      if (btn === "START" || btn === "A") { Snd.ok(); setScreen("map"); }
      else if (btn === "SELECT") { Snd.ok(); G.howtoPage = 0; setScreen("howto"); }
      return;
    }

    if (s === "howto") {
      if (btn === "A" || btn === "RIGHT" || btn === "START") {
        if (G.howtoPage < HOWTO.length - 1) { G.howtoPage++; Snd.move(); }
        else { Snd.back(); setScreen("title"); }
      } else if (btn === "LEFT") {
        if (G.howtoPage > 0) { G.howtoPage--; Snd.move(); }
      } else if (btn === "B") { Snd.back(); setScreen("title"); }
      return;
    }

    if (s === "map") {
      if (btn === "UP") { G.mapCur = (G.mapCur + STAGES.length - 1) % STAGES.length; Snd.move(); }
      else if (btn === "DOWN") { G.mapCur = (G.mapCur + 1) % STAGES.length; Snd.move(); }
      else if (btn === "A" || btn === "START") {
        const st = STAGES[G.mapCur];
        if (!stageUnlocked(st)) { Snd.back(); return; }
        Snd.ok();
        G.stage = st;
        G.deck = deckOf(st.id);
        G.deckCur = 0;
        setScreen("info");
      } else if (btn === "B") { Snd.back(); setScreen("title"); }
      return;
    }

    if (s === "info") {
      if (btn === "A" || btn === "START") { Snd.ok(); setScreen("deck"); }
      else if (btn === "B") { Snd.back(); setScreen("map"); }
      return;
    }

    if (s === "deck") {
      if (btn === "UP") { G.deckCur = (G.deckCur + MAX_DECK - 1) % MAX_DECK; Snd.move(); }
      else if (btn === "DOWN") { G.deckCur = (G.deckCur + 1) % MAX_DECK; Snd.move(); }
      else if (btn === "LEFT" || btn === "RIGHT") {
        const j = btn === "LEFT" ? G.deckCur - 1 : G.deckCur + 1;
        if (G.deckCur < G.deck.length && j >= 0 && j < G.deck.length) {
          const t = G.deck[G.deckCur]; G.deck[G.deckCur] = G.deck[j]; G.deck[j] = t;
          G.deckCur = j; Snd.move();
        } else Snd.back();
      } else if (btn === "A") { Snd.ok(); G.pickCur = 0; setScreen("pick"); }
      else if (btn === "SELECT") {
        if (G.deckCur < G.deck.length && G.deck.length > 1) {
          G.deck.splice(G.deckCur, 1);
          if (G.deckCur >= G.deck.length) G.deckCur = Math.max(0, G.deck.length - 1);
          Snd.back(); saveDeck();
        } else Snd.back();
      } else if (btn === "START") {
        if (!G.deck.length) { Snd.back(); return; }
        saveDeck(); Snd.ok(); startBattle();
      } else if (btn === "B") { saveDeck(); Snd.back(); setScreen("map"); }
      return;
    }

    if (s === "pick") {
      const owned = ownedCards();
      if (btn === "UP") { G.pickCur = (G.pickCur + owned.length - 1) % owned.length; Snd.move(); }
      else if (btn === "DOWN") { G.pickCur = (G.pickCur + 1) % owned.length; Snd.move(); }
      else if (btn === "A" || btn === "START") {
        const id = owned[G.pickCur];
        if (G.deckCur < G.deck.length) G.deck[G.deckCur] = id;
        else if (G.deck.length < MAX_DECK) { G.deck.push(id); G.deckCur = G.deck.length - 1; }
        saveDeck(); Snd.ok(); setScreen("deck");
      } else if (btn === "B") { Snd.back(); setScreen("deck"); }
      return;
    }

    if (s === "battle") {
      const b = G.battle;
      if (b.done && (btn === "A" || btn === "START" || btn === "B")) { finishBattle(); return; }
      if (btn === "A") { b.speed = 10; stepBattle(); }
      else if (btn === "START") { while (!b.done) stepBattle(); }
      return;
    }

    if (s === "result") {
      if (btn === "A" || btn === "START") {
        Snd.ok();
        if (G.result === "win" && G.stage.id === STAGES[STAGES.length - 1].id) { setScreen("ending"); return; }
        setScreen("deck");
      } else if (btn === "B") { Snd.back(); setScreen("map"); }
      return;
    }

    if (s === "ending") {
      if (btn === "A" || btn === "B" || btn === "START") { Snd.ok(); setScreen("title"); }
      return;
    }
  }

  function saveDeck() {
    if (!G.stage) return;
    save.decks[G.stage.id] = G.deck.slice();
    writeSave();
  }

  document.querySelectorAll("[data-btn]").forEach((el) => {
    el.addEventListener("pointerdown", (ev) => { ev.preventDefault(); press(el.dataset.btn); });
  });

  const KEYMAP = {
    ArrowUp: "UP", ArrowDown: "DOWN", ArrowLeft: "LEFT", ArrowRight: "RIGHT",
    z: "A", Z: "A", x: "B", X: "B", Enter: "START", Shift: "SELECT", " ": "A",
  };
  window.addEventListener("keydown", (e) => {
    const b = KEYMAP[e.key];
    if (!b) return;
    e.preventDefault();
    press(b);
  });

  // ---------------------------------------------------------------- loop
  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < 33) return;
    last = t;
    G.frame++;

    if (G.screen === "battle" && G.battle && !G.battle.done) {
      const b = G.battle;
      b.timer++;
      if (b.flashE > 0) b.flashE--;
      if (b.flashP > 0) b.flashP--;
      if (b.shake > 0) b.shake--;
      if (b.i < 0 || b.timer >= (b.speed / 2)) { b.timer = 0; stepBattle(); }
    } else if (G.battle) {
      if (G.battle.flashE > 0) G.battle.flashE--;
      if (G.battle.flashP > 0) G.battle.flashP--;
      if (G.battle.shake > 0) G.battle.shake--;
    }

    draw();
  }

  loadSave();
  const boot = () => { draw(); requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.load) {
    Promise.race([
      document.fonts.load('16px "DotGothic16"').then(() => document.fonts.ready),
      new Promise((r) => setTimeout(r, 1500)),
    ]).then(boot, boot);
  } else boot();
})();
</script>
</body>
