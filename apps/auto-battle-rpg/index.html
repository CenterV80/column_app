  :root {
    color-scheme: dark;
    /* the console look: black panels, hard white frames, saturated status */
    --bg: #101018;
    --paper: #16161f;
    --surface: #000000;
    --surface-2: #14141d;
    --line: #ffffff;
    --line-soft: #6a6a86;
    --text: #ffffff;
    --muted: #b6b6cb;
    --dim: #82829c;

    --accent: #4ea3ff;   /* your side, and every control you press */
    --accent-soft: #4ea3ff1f;
    --accent-deep: #2b7fd8;
    --coral: #ff4b3e;    /* the enemy, damage */
    --amber: #ffd23e;    /* awaken, warnings, the charge turn */
    --teal: #3ad14b;     /* health, healing */
    --sky: #b479ff;      /* defensive states */

    --radius: 4px;
    --tap: 48px;
    --frame: 3px;
    --dot: "DotGothic16", "Hiragino Sans", monospace;
    --shadow: none;
    --shadow-lift: 0 6px 0 #00000080;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    background-image:
      repeating-linear-gradient(45deg, #ffffff06 0 2px, transparent 2px 8px);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    overscroll-behavior: none;
  }

  #app {
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* ---------- chrome ---------- */
  #topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    border-bottom: var(--frame) solid var(--line);
    background: var(--surface);
  }
  #topbar .back {
    width: 40px; height: 40px;
    flex: none;
    border-radius: 3px;
    border: 2px solid var(--line);
    background: #000;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
  }
  #topbar .back:active { background: var(--line); color: #000; }
  #topbar h1 { font-family: var(--dot); font-size: 17px; font-weight: 400; letter-spacing: .02em;
               flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #topbar .meta { font-family: var(--dot); font-size: 13px; color: var(--amber); flex: none; }
  #topbar .icon-btn {
    width: 40px; height: 40px; flex: none;
    border-radius: 3px; border: 2px solid var(--line-soft);
    background: #000; color: var(--muted); font-size: 15px; cursor: pointer;
  }

  #view {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #actionbar {
    flex: none;
    display: flex;
    gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top: var(--frame) solid var(--line);
    background: var(--surface);
  }
  #actionbar:empty { display: none; }

  /* ---------- primitives ---------- */
  .btn {
    flex: 1;
    min-height: var(--tap);
    border-radius: var(--radius);
    border: var(--frame) solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-family: var(--dot);
    font-size: 16px;
    font-weight: 400;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform .06s ease, background .12s ease;
  }
  .btn:active { transform: scale(.985); background: var(--line); }
  .btn.primary { background: var(--accent); border-color: var(--line); color: #04121f; }
  .btn.primary:active { background: var(--accent-deep); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:active { transform: none; background: var(--surface-2); }

  .card {
    background: var(--surface);
    border: var(--frame) solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
  }
  .card h2 {
    font-family: var(--dot);
    font-size: 14px; font-weight: 400; color: var(--amber);
    letter-spacing: .04em; margin-bottom: 10px;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 3px;
    font-family: var(--dot); font-size: 13px; font-weight: 400;
    background: #000; color: var(--muted);
    border: 2px solid var(--line-soft);
  }
  .chip.teal { color: var(--teal); border-color: #3ad14b; background: #000; }
  .chip.coral { color: var(--coral); border-color: #ff4b3e; background: #000; }
  .chip.amber { color: var(--amber); border-color: #ffd23e; background: #000; }
  .chip.violet { color: var(--accent); border-color: #4ea3ff; background: #000; }
  .chip.sky { color: var(--sky); border-color: #b479ff; background: #000; }

  .sprite { image-rendering: pixelated; display: block; }

  .bar {
    height: 12px; border-radius: 0; background: #000; overflow: hidden;
    border: 2px solid var(--line-soft);
    background-image: repeating-linear-gradient(90deg, transparent 0 5px, #ffffff14 5px 6px);
  }
  .bar > i { display: block; height: 100%; border-radius: 0; transition: width .32s steps(12, end); }
  .bar.enemy > i { background: var(--coral); }
  .bar.player > i { background: var(--teal); }

  .stat-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; }
  .stat-row .k { font-family: var(--dot); font-size: 14px; }
  .stat-row .k { color: var(--muted); }
  .stat-row .v { font-family: var(--dot); font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 400; }

  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }

  /* ---------- title ---------- */
  .hero {
    border-radius: var(--radius);
    background: #000;
    background-image:
      repeating-linear-gradient(45deg, #4ea3ff22 0 12px, transparent 12px 24px),
      repeating-linear-gradient(-45deg, #b479ff1c 0 12px, transparent 12px 24px);
    border: var(--frame) solid var(--line);
    padding: 22px 104px 18px 18px;
    position: relative;
    overflow: hidden;
  }
  .hero .dragon { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); opacity: .9; }
  .hero .kicker { font-family: var(--dot); font-size: 13px; letter-spacing: .18em; color: var(--amber); }
  .hero h2 { font-family: var(--dot); font-size: 26px; line-height: 1.24; margin: 8px 0 10px; font-weight: 400; }
  .hero p { font-size: 13px; color: var(--muted); }

  .feature { display: flex; gap: 10px; align-items: flex-start; }
  .feature + .feature { margin-top: 12px; }
  .feature .ico {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    display: grid; place-items: center; font-size: 15px;
    background: var(--accent-soft); color: var(--accent);
  }
  .feature .t { font-size: 14px; font-weight: 650; }
  .feature .d { font-size: 12.5px; color: var(--muted); }

  /* ---------- stage list ---------- */
  .stage {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--surface); border: var(--frame) solid var(--line);
    border-radius: var(--radius); padding: 10px; cursor: pointer;
    font: inherit; color: var(--text);
    transition: transform .06s ease, border-color .12s ease;
  }
  .stage:active { transform: translateY(2px); border-color: var(--amber); }
  .stage.locked { opacity: .5; cursor: default; }
  .stage.locked:active { transform: none; border-color: var(--line); }
  .stage .thumb {
    width: 56px; height: 56px; flex: none; border-radius: 2px;
    background: #000; border: 2px solid var(--line-soft);
    display: grid; place-items: center; overflow: hidden;
  }
  .stage .body { flex: 1; min-width: 0; }
  .stage .name { font-family: var(--dot); font-weight: 400; font-size: 16px; }
  .stage .sub { font-size: 12.5px; color: var(--muted); }
  .stage .go { color: var(--dim); font-size: 18px; flex: none; }

  /* ---------- schedule ---------- */
  .sched { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .sched::-webkit-scrollbar { display: none; }
  .sched .t {
    flex: none; min-width: 58px; border-radius: 3px; padding: 5px 8px;
    background: #000; border: 2px solid var(--line-soft); text-align: center;
  }
  .sched .t.strong { border-color: var(--coral); background: #ff4b3e1f; }
  .sched .t.safe { border-color: var(--teal); background: #3ad14b1a; }
  .sched .t .n { font-size: 10.5px; color: var(--dim); font-weight: 700; letter-spacing: .06em; }
  .sched .t .a { font-family: var(--dot); font-size: 14px; font-weight: 400; white-space: nowrap; }
  .sched .t.strong .a { color: var(--coral); }
  .sched .t.safe .a { color: var(--teal); }

  /* ---------- deck slots ---------- */
  .slots { display: flex; flex-direction: column; gap: 8px; }
  .slot {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 2px solid var(--line-soft);
    border-radius: 3px; padding: 8px 8px 8px 4px;
    touch-action: pan-y;
  }
  .slot.indent { margin-left: 18px; border-left: 3px solid var(--amber); }
  .slot.dragging { opacity: .96; border-color: var(--accent); box-shadow: var(--shadow-lift); position: relative; z-index: 5; }
  .slot.drop-target { border-color: var(--accent); background: var(--accent-soft); }
  .slot .handle {
    width: 34px; min-height: 44px; flex: none;
    display: grid; place-items: center; color: var(--dim);
    cursor: grab; touch-action: none; font-size: 15px;
  }
  .slot .main { flex: 1; min-width: 0; }
  .slot .name { font-family: var(--dot); font-weight: 400; font-size: 16px; display: flex; align-items: center; gap: 7px; }
  .slot .desc { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .del {
    width: 42px; height: 42px; flex: none; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--muted); font-size: 15px; cursor: pointer;
  }
  .slot .del:active { background: var(--line); color: var(--coral); }
  .slot.dead { background: #0c0c12; border-style: dashed; border-color: var(--coral); }
  .slot.dead .name { color: var(--muted); }
  .slot.empty { border-style: dashed; justify-content: center; padding: 0; }
  .slot.empty button {
    width: 100%; min-height: var(--tap); background: none; border: 0;
    color: var(--muted); font: inherit; font-size: 13.5px; cursor: pointer;
  }

  .kind-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }

  .verdict {
    display: flex; align-items: center; gap: 10px;
    border-radius: 3px; padding: 10px 12px;
    border: 2px solid var(--line-soft); background: #000;
    font-size: 13.5px;
  }
  .verdict b { font-family: var(--dot); font-size: 16px; color: var(--amber); }
  .verdict.win  { border-color: var(--teal); }
  .verdict.lose { border-color: var(--coral); }
  .verdict b { font-variant-numeric: tabular-nums; }

  /* ---------- card picker ---------- */
  .pick-group + .pick-group { margin-top: 14px; }
  .pick-group h3 { font-size: 12px; color: var(--muted); font-weight: 650; letter-spacing: .05em; margin-bottom: 8px; }
  .pick {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
    background: var(--surface); border: 2px solid var(--line-soft); border-radius: 3px;
    padding: 11px 12px; min-height: var(--tap); cursor: pointer; font: inherit; color: var(--text);
  }
  .pick + .pick { margin-top: 8px; }
  .pick:active { border-color: var(--amber); background: var(--accent-soft); }
  .pick.locked { opacity: .42; cursor: default; }
  .pick.locked:active { border-color: var(--line); background: var(--surface); }
  .pick .n { font-family: var(--dot); font-weight: 400; font-size: 16px; }
  .pick .d { font-size: 12.5px; color: var(--muted); }

  /* ---------- plan table ---------- */
  table.plan { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.plan th { text-align: left; font-size: 11.5px; color: var(--dim); font-weight: 650; padding: 0 6px 8px; letter-spacing: .04em; }
  table.plan td { padding: 9px 6px; border-top: 1px solid var(--line-soft); vertical-align: top; font-family: var(--dot); font-size: 14px; }
  table.plan tr.hit td { background: #ff4b3e1a; }
  table.plan .turn { color: var(--dim); font-weight: 700; width: 20px; }
  table.plan .mine { font-weight: 600; }
  table.plan .num { text-align: right; width: 34px; }
  table.plan .efoe { color: var(--muted); font-size: 12px; }

  /* ---------- battle ---------- */
  .fighter { display: flex; gap: 12px; align-items: center; }
  .fighter .art {
    width: 92px; height: 92px; flex: none; border-radius: 2px;
    background: #000;
    border: 2px solid var(--line-soft);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .fighter .art::before {
    content: ""; position: absolute; inset: -50%;
    background:
      repeating-linear-gradient(45deg, var(--stage-a, #4ea3ff) 0 10px, transparent 10px 20px),
      repeating-linear-gradient(-45deg, var(--stage-b, #b479ff) 0 10px, transparent 10px 20px);
    opacity: .3;
    animation: drift 3.2s linear infinite;
  }
  .fighter .art > * { position: relative; z-index: 1; }
  @keyframes drift { to { transform: translate(20px, 20px); } }
  @media (prefers-reduced-motion: reduce) { .fighter .art::before { animation: none; } }
  .fighter.small .art { width: 72px; height: 72px; }
  .fighter .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .fighter .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fighter .nm { font-family: var(--dot); font-weight: 400; font-size: 17px; }

  @keyframes hit { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .art.shake { animation: hit .22s ease; }
  .art.flash > .sprite { filter: brightness(3) saturate(0); }
  .art.down > .sprite { opacity: .25; filter: grayscale(1); transition: opacity .4s ease; }

  .pop {
    position: absolute; left: 50%; top: 24%;
    transform: translateX(-50%);
    font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums;
    pointer-events: none; animation: rise .9s ease-out forwards;
    text-shadow: 0 2px 0 #000, 0 0 10px #000;
  }
  .pop.dmg { color: var(--coral); }
  .pop.heal { color: var(--teal); }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.8); }
                    22% { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
                    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); } }

  .odo { font-family: var(--dot); font-variant-numeric: tabular-nums; }
  .odo.rolling { color: var(--amber); }

  .trace { display: flex; gap: 5px; }
  .trace .s {
    flex: 1; height: 7px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line);
  }
  .trace .s.on { background: var(--accent); border-color: transparent; }
  .trace .s.ghost { opacity: .35; }

  #log { display: flex; flex-direction: column; gap: 6px; }
  #log .ln { font-size: 13.5px; color: var(--muted); }
  #log .ln.turn { color: var(--dim); font-size: 11.5px; font-weight: 700; letter-spacing: .07em;
                  margin-top: 4px; text-transform: uppercase; }
  #log .ln.now { color: var(--text); font-weight: 600; }
  #log .ln.good { color: var(--accent); }
  #log .ln.bad { color: var(--coral); }
  #log .ln.warn { color: var(--amber); }

  /* ---------- result ---------- */
  .banner { border-radius: var(--radius); padding: 18px 16px; text-align: center; border: var(--frame) solid var(--line); background: #000; }
  .banner.win { background: linear-gradient(180deg, #3ad14b33, #000); border-color: var(--teal); }
  .banner.lose { background: linear-gradient(180deg, #ff4b3e33, #000); border-color: var(--coral); }
  .banner h2 { font-family: var(--dot); font-size: 26px; font-weight: 400; }
  .banner .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .reward { display: flex; gap: 10px; align-items: flex-start; }
  .reward + .reward { margin-top: 10px; }

  #footer { display: none; }
</style>
</head>

<script>

  // =====================================================================

  const CARDS = {

    heal:     { id:"heal",     name:"かいふく",     kind:"state",  short:"かいふく",

    ifPinch:  { id:"ifPinch",  name:"ピンチ?",      kind:"cond",   short:"ピンチ?",
                desc:"じぶんの HPが 2いかなら すすむ" },
    ifHalf:   { id:"ifHalf",   name:"HPはんぶん?",  kind:"cond",   short:"はんぶん?",
                desc:"じぶんの HPが はんぶんいかなら" },
    ifStrong: { id:"ifStrong", name:"つよこうげき?",kind:"cond",   short:"つよこう?",
                desc:"てきの つぎの手が つよこうげきなら" },
    ifCharge: { id:"ifCharge", name:"ためる?",       kind:"cond",   short:"ためる?",
                desc:"てきの つぎの手が ためる なら" },
  };

  const START_CARDS = ["attack", "heal"];

  const STAGES = [
    {
      id: 1, name: "スライム", sprite: "slime", hp: 9, armor: 0,
      pattern: [{ t:"attack", v:3 }],
      reward: ["reckless", "plus2"],
      hint: "なぐり合うだけでは 1ターン たりない。かいふくを 入れて 1回ぶん ねばる。",
    },

      id: 2, name: "ゴブリン", sprite: "goblin", hp: 12, armor: 0,
      pattern: [{ t:"attack", v:3 }, { t:"attack", v:3 }, { t:"strong", v:6 }],

    },

      id: 3, name: "ゴーレム", sprite: "golem", hp: 12, armor: 1,
      pattern: [{ t:"attack", v:3 }, { t:"charge" }, { t:"strong", v:9 }],
      reward: ["times2", "ifHalf"],

    {
      id: 4, name: "ウィッチ", sprite: "witch", hp: 26, armor: 0,
      pattern: [{ t:"attack", v:2 }, { t:"heal", v:3 }, { t:"attack", v:2 }, { t:"strong", v:6 }],
      reward: ["power", "ifPinch"],
      hint: "じぶんを 3かいふくする。けずる はやさで まけると たおせない。",
    },

      id: 5, name: "らいりゅう", sprite: "dragon", hp: 34, armor: 1,
      pattern: [{ t:"attack", v:3 }, { t:"attack", v:3 }, { t:"charge" }, { t:"strong", v:10 }],
      reward: [],
      hint: "HP30。ふつうに たたかっては ぜったいに たりない。ピンチで かくせいし るいじょうを うて。",
    },
  ];

  const MAX_DECK = 6;
  const MAX_TURNS = 30;
  const HEAL_AMOUNT = 4;
  const PLAYER_MAX_HP = 10;
  const PLAYER_BASE_ATK = 2;
  const AWAKEN_HP = 2;

  // Jump target when a condition fails: skip past this block's action card.
  function skipBlock(deck, i) {
    for (let j = i + 1; j < deck.length; j++) {
      if (CARDS[deck[j]].kind === "action") return j + 1;
    }
    return deck.length;
  }

  function nextEnemyAct(stage, idx) {
    return stage.pattern[idx % stage.pattern.length];
  }

  function evalCond(id, P, E, stage) {
    if (id === "ifPinch") return P.hp <= AWAKEN_HP;
    if (id === "ifHalf") return P.hp * 2 <= P.maxHp;
    if (id === "ifStrong") return nextEnemyAct(stage, E.idx).t === "strong";
    if (id === "ifCharge") return nextEnemyAct(stage, E.idx).t === "charge";
    return false;
  }

  // Fully deterministic: the same deck against the same stage always
  // produces the same event list. No randomness anywhere.
  function simulate(stage, deck) {
    const P = { hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP, atk: PLAYER_BASE_ATK,
                awaken: false, used: {}, guard: 0 };
    const E = { hp: stage.hp, maxHp: stage.hp, armor: stage.armor || 0, idx: 0 };
    const events = [];
    let result = "draw";

    const snap = () => ({
      php: P.hp, patk: P.atk, ehp: E.hp, awaken: P.awaken,
      used: Object.assign({}, P.used), eidx: E.idx, guard: P.guard,
    });
    const push = (o) => { o.s = snap(); events.push(o); };

    const checkAwaken = () => {
      if (P.hp > 0 && P.hp <= AWAKEN_HP && !P.awaken) {
        P.awaken = true;
        push({ t: "awaken" });
      }
    };

    for (let turn = 1; turn <= MAX_TURNS; turn++) {
      push({ t: "turn", turn });

      let i = 0, acted = false;
      while (i < deck.length) {
        const c = CARDS[deck[i]];

        if (c.kind === "cond") {
          const ok = evalCond(c.id, P, E, stage);
          push({ t: "cond", card: c.id, idx: i, ok });
          i = ok ? i + 1 : skipBlock(deck, i);
          continue;
        }

        // Boosts and states are once-per-battle resources: they resolve
        // without ending the turn, so a block can brace and still act.
        if (c.kind === "boost" || c.kind === "state") {
          const blocked = P.used[c.id] ? "used"
                        : (c.needAwaken && !P.awaken) ? "noawaken"
                        : (c.id === "heal" && P.hp >= P.maxHp) ? "full" : null;
          if (blocked) {
            push({ t: "boostFail", card: c.id, idx: i, reason: blocked });
          } else if (c.id === "heal") {
            const before = P.hp;
            P.hp = Math.min(P.maxHp, P.hp + HEAL_AMOUNT);
            P.used[c.id] = true;
            push({ t: "heal", card: c.id, idx: i, amt: P.hp - before });
          } else if (c.id === "guard") {
            P.guard = 4;
            P.used[c.id] = true;
            push({ t: "guard", card: c.id, idx: i });
          } else {
            const from = P.atk;
            if (c.id === "plus2") P.atk += 2;
            else if (c.id === "times2") P.atk *= 2;
            else if (c.id === "power") { P.atk = P.atk * P.atk; P.awaken = false; }
            P.used[c.id] = true;
            push({ t: "boost", card: c.id, idx: i, from, to: P.atk });
          }
          i++;
          continue;
        }

        acted = true;
        if (c.id === "attack") {
          const dmg = Math.max(1, P.atk - E.armor);
          E.hp -= dmg;
          push({ t: "attack", card: c.id, idx: i, dmg });
        } else if (c.id === "heal") {
          const before = P.hp;
          P.hp = Math.min(P.maxHp, P.hp + 3);
          push({ t: "heal", card: c.id, idx: i, amt: P.hp - before });
        } else if (c.id === "reckless") {
          P.hp -= 2; P.atk += 2;
          push({ t: "reckless", card: c.id, idx: i });
        }
        break;
      }
      if (!acted) push({ t: "idle" });

      checkAwaken();
      if (E.hp <= 0) { result = "win"; break; }
      if (P.hp <= 0) { result = "lose"; break; }

      const act = nextEnemyAct(stage, E.idx);
      E.idx++;
      if (act.t === "attack" || act.t === "strong") {
        const dmg = Math.max(0, act.v - P.guard);
        P.hp -= dmg;
        push({ t: "enemyAtk", kind: act.t, raw: act.v, dmg, guarded: P.guard > 0 });
      } else if (act.t === "charge") {
        push({ t: "enemyCharge" });
      } else if (act.t === "heal") {
        const before = E.hp;
        E.hp = Math.min(E.maxHp, E.hp + act.v);
        push({ t: "enemyHeal", amt: E.hp - before });
      }
      P.guard = 0;

      checkAwaken();
      if (P.hp <= 0) { result = "lose"; break; }
      if (E.hp <= 0) { result = "win"; break; }
    }

    push({ t: "end", result });
    return { events, result };
  }

    goblin: ["#ffd23e", "#ff8a3e"],
    golem:  ["#8fa0b8", "#4ea3ff"],
    witch:  ["#b479ff", "#ff4bd8"],
    dragon: ["#ff4b3e", "#ffd23e"],
    hero:   ["#4ea3ff", "#3ad14b"],
  };

  const RAMPS = {
    slime:  ["#0c2417", "#1f9b46", "#5fe07a", "#c9ffd6"],
    goblin: ["#2a1a08", "#a56a1e", "#f0ad3c", "#ffe6a8"],
    golem:  ["#15171d", "#5a6472", "#98a6ba", "#e2e9f2"],
    witch:  ["#1c0f30", "#7038c8", "#b479ff", "#eddcff"],
    dragon: ["#2d0a0a", "#c42a20", "#ff6a4b", "#ffd0b0"],
    hero:   ["#0a1626", "#1f6fc4", "#4ea3ff", "#cfe9ff"],
  };
  const TONE_OF = { "0": 0, "1": 1, "2": 2, "3": 3 };
  const spriteCache = {};

  function spriteURL(name, scale) {
    const key = name + "@" + scale;
    if (spriteCache[key]) return spriteCache[key];
    const art = SPRITES[name], ramp = RAMPS[name] || RAMPS.golem;
    const size = art.length;
    const c = document.createElement("canvas");
    c.width = c.height = size * scale;
    const x = c.getContext("2d");
    for (let r = 0; r < size; r++) {
      const row = art[r];
      for (let i = 0; i < row.length; i++) {
        const t = TONE_OF[row[i]];
        if (t === undefined) continue;
        x.fillStyle = ramp[t];
        x.fillRect(i * scale, r * scale, scale, scale);
      }
    }
    return (spriteCache[key] = c.toDataURL());
  }

  function spriteImg(name, px) {
    const art = SPRITES[name];
    const scale = Math.max(1, Math.round(px / art.length));
    const img = new Image();
    img.className = "sprite";
    img.src = spriteURL(name, scale);
    img.width = img.height = art.length * scale;
    img.alt = "";
    return img;
  }

  // ----------------------------------------------------------------- audio
  const Snd = {
    ac: null, on: true,
    init() {
      if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ac = new AC();
    },
    tone(freq, dur, when, vol, type) {
      if (!this.on || !this.ac) return;
      const t0 = this.ac.currentTime + (when || 0);
      const osc = this.ac.createOscillator(), g = this.ac.createGain();
      osc.type = type || "triangle";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol === undefined ? 0.06 : vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.ac.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    },
    tap() { this.tone(620, 0.06, 0, 0.04); },
    ok() { this.tone(700, 0.07); this.tone(1040, 0.09, 0.05); },
    back() { this.tone(360, 0.09, 0, 0.045); },
    hit() { this.tone(190, 0.1, 0, 0.07, "square"); this.tone(120, 0.13, 0.04, 0.05, "square"); },
    hurt() { this.tone(150, 0.16, 0, 0.06, "sawtooth"); },
    buff() { [660, 880, 1170].forEach((f, i) => this.tone(f, 0.08, i * 0.05, 0.05)); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, i * 0.11, 0.06)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.24, i * 0.15, 0.055)); },
  };

  // ------------------------------------------------------------------ save
  const SAVE_KEY = "abrpg.save.v2";
  const save = { cleared: [], seen: [], decks: {} };

  function loadSave() {
    try {
      const o = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (!o) return;
      if (Array.isArray(o.cleared)) save.cleared = o.cleared;
      if (Array.isArray(o.seen)) save.seen = o.seen;
      if (o.decks && typeof o.decks === "object") save.decks = o.decks;
    } catch (e) { /* private mode: play without saving */ }
  }
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }
  }

  function ownedCards() {
    const owned = START_CARDS.slice();
    STAGES.forEach((st) => {
      if (save.cleared.indexOf(st.id) >= 0)
        st.reward.forEach((c) => { if (owned.indexOf(c) < 0) owned.push(c); });
    });
    return owned;
  }
  const stageUnlocked = (st) => st.id === 1 || save.cleared.indexOf(st.id - 1) >= 0;
  const hasSeen = (st) => save.seen.indexOf(st.id) >= 0;
  const deckOf = (id) => (Array.isArray(save.decks[id]) ? save.decks[id].slice() : ["attack"]);

  function actName(a) {
    if (a.t === "attack") return "こうげき " + a.v;
    if (a.t === "strong") return "つよこうげき " + a.v;
    if (a.t === "charge") return "ためる";
    if (a.t === "heal") return "かいふく " + a.v;
    return "？";
  }
  function actShort(a) {
    if (a.t === "attack") return "こう" + a.v;
    if (a.t === "strong") return "つよ" + a.v;
    if (a.t === "charge") return "ためる";
    if (a.t === "heal") return "かいふく";
    return "？";
  }

  function planRows(stage, deck) {
    const sim = simulate(stage, deck);
    const rows = [];
    let cur = null;
    const ACTS = { attack: "こうげき", heal: "かいふく", guard: "ぼうぎょ",
                   reckless: "すてみ", idle: "ようす見" };
    sim.events.forEach((e) => {
      if (e.t === "turn") {
        cur = { turn: e.turn, boosts: [], act: "", php: e.s.php, ehp: e.s.ehp, enemy: "" };
        rows.push(cur);
        return;
      }
      if (!cur) return;
      if (e.t === "boost") cur.boosts.push(CARDS[e.card].short);
      else if (ACTS[e.t]) cur.act = ACTS[e.t];
      else if (e.t === "guard") cur.boosts.push("ぼうぎょ");
      else if (e.t === "enemyAtk") cur.enemy = (e.kind === "strong" ? "つよ" : "こう") + e.dmg;
      else if (e.t === "enemyCharge") cur.enemy = "ためる";
      else if (e.t === "enemyHeal") cur.enemy = "かいふく";
      cur.php = e.s.php; cur.ehp = e.s.ehp;
    });
    return { rows, result: sim.result };
  }

  // Depth per card, so conditional blocks read as indented groups.
  function deckIndents(deck) {
    const out = [];
    let inBlock = false;
    deck.forEach((id) => {
      const c = CARDS[id];
      if (c.kind === "cond") { out.push(0); inBlock = true; return; }
      out.push(inBlock ? 1 : 0);
      if (c.kind === "action") inBlock = false;
    });
    return out;
  }

  // Index from which cards can never execute: once an action runs with no
  // condition guarding it, the turn ends there, every turn.
  function deadFrom(deck) {
    let guarded = false;
    for (let i = 0; i < deck.length; i++) {
      const c = CARDS[deck[i]];
      if (c.kind === "cond") { guarded = true; continue; }
      if (c.kind === "action") {
        if (!guarded) return i + 1;
        guarded = false;
      }
    }
    return deck.length;
  }

  // One-line verdict for the deck screen.
  function planSummary(stage, deck) {
    const { rows, result } = planRows(stage, deck);
    const last = rows[rows.length - 1];
    const n = last ? last.turn : 0;
    if (result === "win") return { s: n + "ターンめに しょうり  のこりHP" + Math.max(0, last.php), ok: true };
    if (result === "lose") return { s: n + "ターンめに はいぼく  てきHP" + Math.max(0, last.ehp) + "のこり", ok: false };
    return { s: "きまらない (" + n + "ターン ひきわけ)", ok: false };
  }

  function eventText(e) {
    const c = e.card ? CARDS[e.card] : null;
    switch (e.t) {
      case "turn": return ["- ターン " + e.turn + " -", ""];
      case "cond": return [c.name, e.ok ? "→ せいりつ！ つぎへ" : "→ ふせいりつ。とばす"];
      case "boost": return [c.name + " はつどう！", "こうげき力 " + e.from + " → " + e.to];
      case "guard": return ["ぼうぎょの かまえ！", "うけるダメージ -4"];
      case "boostFail": return [c.name + " は つかわない",
        e.reason === "used" ? "→ もう つかった"
        : e.reason === "full" ? "→ HPが まんタン。とっておく"
        : "→ かくせい していない"];
      case "attack": return ["こうげき！", "てきに " + e.dmg + " ダメージ"];
      case "heal": return ["かいふく！", e.amt > 0 ? "HPが " + e.amt + " かいふく" : "HPは まんタン"];
      case "reckless": return ["すてみ！", "HP-2 こうげき力+2"];
      case "idle": return ["ようすを みている…", "つかえる カードが ない"];
      case "awaken": return ["HPが 2いか！", "かくせい した！"];
      case "enemyAtk": return [e.kind === "strong" ? "てきの つよこうげき！" : "てきの こうげき！",
                               e.guarded ? e.dmg + " ダメージ (ぼうぎょ)" : e.dmg + " ダメージ"];
      case "enemyCharge": return ["てきは ちからを ためている", "つぎの こうげきに ちゅうい"];
      case "enemyHeal": return ["てきは かいふくした", "HPが " + e.amt + " もどった"];
      case "end": return [e.result === "win" ? "てきを たおした！" : e.result === "lose" ? "ちからつきた…" : "じかんぎれ…", ""];
      default: return ["", ""];
    }
  }

  const KIND = {
    cond:   { label: "じょうけん", cls: "amber",  color: "var(--amber)" },
    boost:  { label: "きょうか",   cls: "violet", color: "var(--accent)" },
    state:  { label: "まもり",     cls: "sky",    color: "var(--sky)" },
    action: { label: "こうどう",   cls: "teal",   color: "var(--teal)" },
  };

  // ------------------------------------------------------------------ view
  const G = {
    screen: "title", stage: null, deck: [], slotIndex: 0,
    battle: null, result: null, gained: [],
  };

  const el = (id) => document.getElementById(id);
  const viewEl = el("view"), barEl = el("actionbar"), titleEl = el("title"),
        metaEl = el("meta"), backEl = el("backBtn");

  function h(tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach((k) => {
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach((c) => { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function button(label, fn, opts) {
    const o = opts || {};
    return h("button", {
      class: "btn" + (o.primary ? " primary" : ""),
      disabled: o.disabled ? "" : null,
      onclick: () => { Snd.init(); Snd.ok(); fn(); },
    }, [label]);
  }

  function go(screen) { G.screen = screen; render(); }

  function bar(cls, ratio) {
    return h("div", { class: "bar " + cls }, [h("i", { style: "width:" + Math.max(0, Math.min(1, ratio)) * 100 + "%" })]);
  }

  function kindDot(kind) {
    return h("span", { class: "kind-dot", style: "background:" + KIND[kind].color });
  }

  // ---- title
  function viewTitle() {
    const dragon = spriteImg("dragon", 96);
    dragon.classList.add("dragon");
    return [
      h("div", { class: "hero" }, [
        dragon,

        h("h2", { html: "カードで<br>さくせんを<br>組む" }),
        h("p", { text: "戦闘中の操作はなし。組んだ作戦どおりに自動で戦います。乱数は一切なし。" }),
      ]),
      h("div", { class: "card" }, [
        feature("◇", "条件で 分岐する", "「ピンチなら」「敵が強攻撃なら」で作戦を切り替える"),
        feature("△", "強化は 1回だけ", "使う順番で結果が変わる。+2→×2 は 8、×2→+2 は 6"),
        feature("⏱", "敵の手は 読める", "何ターン目に何が来るか表示される。計算して組める"),

  function feature(ico, t, d) {

  // ---- how to play
  const HOWTO = [
    { t: "作戦の組みかた", d: "カードを上から順に並べると、それがそのまま作戦になります。スロットを押すとカードを選べ、左のハンドルをドラッグすると順番を入れ替えられます。" },
    { t: "1ターンの流れ", d: "上から順にカードを読みます。条件は、成立したら次へ、不成立ならそのブロックを飛ばして次の作戦へ。強化・守り・かいふくは発動して次へ進み、行動を1枚実行するとターンが終わります。" },
    { t: "順番がすべて", d: "行動を実行した時点でターンが終わるので、その下にあるカードには到達しません。かいふくや強化は、こうげきより上に置いてください。到達しないカードは作戦画面で「とどかない」と表示されます。" },
    { t: "ブロックの形", d: "［ピンチ?］→［るいじょう］→［こうげき］と並べると「ピンチのときだけ必殺」になります。その下に［こうげき］を置けば、条件を満たさない普段はそちらが使われます。" },
    { t: "大事なルール", d: "強化・守り・かいふくは1バトルに1回だけ。使う順番で結果が変わります。かいふくはHPが満タンのときは温存され、減ってから発動します。HP2以下で「かくせい」し、るいじょうはかくせい中しか撃てません。" },
    { t: "計算して組む", d: "作戦画面の上に敵の手がターン順に並びます。「ためしうち」を押せば、戦う前に結果を全部計算できます。" },
  ];
  function viewHowto() {
    return HOWTO.map((p, i) => h("div", { class: "card" }, [
      h("h2", { text: (i + 1) + ". " + p.t }),
      h("div", { class: "small muted", text: p.d }),
    ]));
  }

  // ---- stage select
  function viewMap() {
    return STAGES.map((st) => {
      const open = stageUnlocked(st), clear = save.cleared.indexOf(st.id) >= 0;
      const thumb = h("div", { class: "thumb" }, [open ? spriteImg(st.sprite, 48) : h("span", { class: "dim", text: "?" })]);
      const chip = clear ? h("span", { class: "chip teal", text: "クリア" })

        h("div", { class: "body" }, [

          h("div", { class: "sub", text: open ? "HP " + st.hp + (st.armor ? " ・ ダメージ-" + st.armor : "") : "前のステージをクリアで解放" }),
        ]),

        open ? h("span", { class: "go", text: "›" }) : null,

  // ---- enemy info
  function viewInfo() {
    const st = G.stage, seen = hasSeen(st);
    const out = [
      h("div", { class: "card" }, [
        h("div", { class: "fighter" }, [
          h("div", { class: "art" }, [spriteImg(st.sprite, 80)]),
          h("div", { class: "info" }, [
            h("div", { class: "nm", text: st.name }),
            h("div", { class: "stat-row" }, [h("span", { class: "k", text: "HP" }), h("span", { class: "v", text: String(st.hp) })]),
            h("div", { class: "stat-row" }, [h("span", { class: "k", text: "まもり" }),
              h("span", { class: "v", text: st.armor ? "ダメージ -" + st.armor : "なし" })]),
          ]),
        ]),
      ]),
      h("div", { class: "card" }, [
        h("h2", { text: "こうどう パターン" }),
        seen ? h("div", { class: "sched" }, st.pattern.map((a, i) => schedCell(i + 1, a)))
             : h("div", { class: "small muted", text: "？？？　1度でも戦えばわかります。" }),
        seen ? h("div", { class: "tiny dim", style: "margin-top:8px", text: "この順番でくりかえす" }) : null,
      ]),
      h("div", { class: "card" }, [
        h("h2", { text: "ヒント" }),
        h("div", { class: "small muted", text: seen ? st.hint : "まずは戦って観察しよう。" }),

  function schedCell(n, a) {
    const cls = a.t === "strong" ? " strong" : (a.t === "charge" ? " safe" : "");
    return h("div", { class: "t" + cls }, [
      h("div", { class: "n", text: "T" + n }),
      h("div", { class: "a", text: actShort(a) }),
    ]);
  }

  // ---- deck
  function viewDeck() {
    const st = G.stage, known = hasSeen(st);
    const ind = deckIndents(G.deck);
    const dead = deadFrom(G.deck);

    const sched = h("div", { class: "card" }, [
      h("h2", { text: "てきの手" }),
      h("div", { class: "sched" },
        known ? Array.from({ length: 7 }, (_, i) => schedCell(i + 1, st.pattern[i % st.pattern.length]))
              : [h("div", { class: "small muted", text: "1度でも戦うと、何ターン目に何が来るかわかります。" })]),
    ]);

    const slots = h("div", { class: "slots", id: "slots" });
    G.deck.forEach((id, i) => slots.appendChild(slotRow(id, i, ind[i], i >= dead)));
    if (G.deck.length < MAX_DECK) {
      slots.appendChild(h("div", { class: "slot empty" }, [
        h("button", {
          text: "＋ カードを追加",
          onclick: () => { Snd.init(); Snd.ok(); G.slotIndex = G.deck.length; go("pick"); },
        }),
      ]));
    }

    const deckCard = h("div", { class: "card" }, [h("h2", { text: "さくせん（上から順に実行）" }), slots]);
    if (dead < G.deck.length) {
      deckCard.appendChild(h("div", { class: "tiny", style: "color:var(--coral);margin-top:10px",
        text: "※ " + (dead + 1) + "番目より下のカードは実行されません。じょうけんで分けるか、上へ動かしてください。" }));
    }
    const out = [sched, deckCard];

    if (known && G.deck.length) {
      const p = planSummary(st, G.deck);
      out.push(h("div", { class: "verdict " + (p.ok ? "win" : "lose") }, [
        h("span", { class: "chip " + (p.ok ? "teal" : "coral"), text: "よそく" }),
        h("span", { html: p.s.replace(/(\d+)/g, "<b>$1</b>") }),
      ]));
    }
    return out;
  }

  function slotRow(id, i, indent, dead) {
    const c = CARDS[id];
    const row = h("div", { class: "slot" + (indent ? " indent" : "") + (dead ? " dead" : ""), "data-i": i }, [
      h("div", { class: "handle", text: "⠿" }),
      h("div", { class: "main", onclick: () => { Snd.init(); Snd.ok(); G.slotIndex = i; go("pick"); } }, [
        h("div", { class: "name" }, [
          kindDot(c.kind), c.name,
          (c.kind === "boost" || c.kind === "state") ? h("span", { class: "chip", text: "1回" }) : null,
          dead ? h("span", { class: "chip coral", text: "とどかない" }) : null,
        ]),
        h("div", { class: "desc", text: dead ? "上の行動でターンが終わるので、ここまで来ません" : c.desc }),
      ]),
      h("button", {
        class: "del", text: "✕", "aria-label": "けす",
        onclick: (ev) => {
          ev.stopPropagation();
          if (G.deck.length <= 1) { Snd.back(); return; }
          Snd.init(); Snd.back();
          G.deck.splice(i, 1);
          saveDeck(); render();
        },
      }),
    ]);
    enableDrag(row, i);
    return row;
  }

  // Ordering is the whole game, so reordering gets a real drag gesture.
  function enableDrag(row, index) {
    const handle = row.querySelector(".handle");
    let st = null;
    handle.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      Snd.init();
      handle.setPointerCapture(ev.pointerId);
      st = { y0: ev.clientY, dy: 0, h: row.getBoundingClientRect().height + 8 };
      row.classList.add("dragging");
    });
    handle.addEventListener("pointermove", (ev) => {
      if (!st) return;
      st.dy = ev.clientY - st.y0;
      row.style.transform = "translateY(" + st.dy + "px)";
      const to = target(st);
      [].forEach.call(row.parentNode.children, (c, i) => c.classList.toggle("drop-target", i === to && to !== index));
    });
    const finish = () => {
      if (!st) return;
      const to = target(st);
      row.style.transform = "";
      row.classList.remove("dragging");
      st = null;
      if (to !== index) {
        const card = G.deck.splice(index, 1)[0];
        G.deck.splice(to, 0, card);
        saveDeck(); Snd.ok();
      }
      render();
    };
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
    function target(s) {
      return Math.max(0, Math.min(G.deck.length - 1, index + Math.round(s.dy / s.h)));
    }
  }

  function saveDeck() {
    if (!G.stage) return;
    save.decks[G.stage.id] = G.deck.slice();
    writeSave();
  }

  // ---- card picker
  const ALL_CARDS = ["attack", "heal", "reckless", "guard", "plus2", "times2", "power",
                     "ifHalf", "ifStrong", "ifCharge", "ifPinch"];

  function viewPick() {
    const owned = ownedCards();
    const groups = [["action", "こうどう（実行してターン終了）"], ["boost", "きょうか（1バトル1回）"],
                    ["state", "まもり（1バトル1回）"], ["cond", "じょうけん（分岐）"]];
    return groups.map(([kind, label]) => {
      const ids = ALL_CARDS.filter((id) => CARDS[id].kind === kind);
      return h("div", { class: "pick-group" }, [h("h3", { text: label })].concat(
        ids.map((id) => {
          const c = CARDS[id], have = owned.indexOf(id) >= 0;
          return h("button", {
            class: "pick" + (have ? "" : " locked"),
            disabled: have ? null : "",
            onclick: have ? () => {
              Snd.init(); Snd.ok();
              if (G.slotIndex < G.deck.length) G.deck[G.slotIndex] = id;
              else if (G.deck.length < MAX_DECK) G.deck.push(id);
              saveDeck(); go("deck");
            } : null,
          }, [
            kindDot(c.kind),
            h("div", {}, [
              h("div", { class: "n", text: have ? c.name : "？？？" }),
              h("div", { class: "d", text: have ? c.desc : "まだ手に入れていないカード" }),
            ]),
          ]);
        })));
    });
  }

  // ---- dry run
  function viewPlan() {
    const { rows, result } = planRows(G.stage, G.deck);
    const table = h("table", { class: "plan" }, [
      h("thead", {}, [h("tr", {}, [
        h("th", { text: "T" }), h("th", { text: "じぶんの手" }), h("th", { class: "num", text: "HP" }),
        h("th", { text: "てきの手" }), h("th", { class: "num", text: "HP" }),
      ])]),
      h("tbody", {}, rows.map((r) => h("tr", { class: r.enemy && r.enemy.indexOf("つよ") === 0 ? "hit" : "" }, [
        h("td", { class: "turn", text: String(r.turn) }),
        h("td", { class: "mine", text: (r.boosts.length ? r.boosts.join("+") + " → " : "") + (r.act || "—") }),
        h("td", { class: "num", text: String(Math.max(0, r.php)) }),
        h("td", { class: "efoe", text: r.enemy || "—" }),
        h("td", { class: "num", text: String(Math.max(0, r.ehp)) }),
      ]))),
    ]);
    const verdict = h("div", { class: "verdict " + (result === "win" ? "win" : "lose") }, [
      h("span", { class: "chip " + (result === "win" ? "teal" : "coral"),
                  text: result === "win" ? "しょうり" : result === "lose" ? "はいぼく" : "ひきわけ" }),
      h("span", { html: "<b>" + rows.length + "</b> ターンで決着" }),
    ]);
    return [verdict, h("div", { class: "card" }, [table])];
  }

  // ---- battle
  function startBattle() {
    const sim = simulate(G.stage, G.deck);
    G.battle = {
      events: sim.events, result: sim.result, i: -1, done: false, fast: false,
      state: { php: PLAYER_MAX_HP, patk: PLAYER_BASE_ATK, ehp: G.stage.hp, awaken: false, eidx: 0 },
      turn: 1, cardIdx: -1, timer: null,
    };
    if (!hasSeen(G.stage)) { save.seen.push(G.stage.id); writeSave(); }
    go("battle");
    scheduleStep(520);
  }

  function scheduleStep(ms) {
    const b = G.battle;
    if (!b) return;
    clearTimeout(b.timer);
    b.timer = setTimeout(() => { stepBattle(); if (!b.done) scheduleStep(b.fast ? 130 : 520); }, ms);
  }

  function stepBattle() {
    const b = G.battle;
    if (!b || b.done) return;
    b.i++;
    if (b.i >= b.events.length) { b.done = true; renderBattleBar(); return; }
    const e = b.events[b.i];
    const prev = b.state;
    b.state = e.s;
    b.cardIdx = e.idx === undefined ? b.cardIdx : e.idx;
    if (e.t === "turn") b.turn = e.turn;
    applyBattleEvent(e, prev);
    if (e.t === "end") { b.done = true; renderBattleBar(); }
  }

  function applyBattleEvent(e, prev) {
    const b = G.battle, s = b.state;
    const enemyArt = el("enemyArt"), playerArt = el("playerArt");
    const line = eventText(e);

    if (e.t === "turn") pushLog("ターン " + e.turn, "turn");
    else {
      let cls = "";
      if (e.t === "attack" || e.t === "boost") cls = "good";
      else if (e.t === "enemyAtk" || e.t === "reckless") cls = "bad";
      else if (e.t === "awaken" || e.t === "cond") cls = e.t === "cond" && !e.ok ? "" : "warn";
      pushLog(line.filter(Boolean).join("　"), cls);
    }

    if (e.t === "attack") { punch(enemyArt, "-" + e.dmg, "dmg"); Snd.hit(); }
    if (e.t === "enemyAtk" && e.dmg > 0) { punch(playerArt, "-" + e.dmg, "dmg"); Snd.hurt(); }
    if (e.t === "reckless") { punch(playerArt, "-2", "dmg"); Snd.hurt(); }
    if (e.t === "heal" && e.amt > 0) { pop(playerArt, "+" + e.amt, "heal"); Snd.tap(); }
    if (e.t === "enemyHeal" && e.amt > 0) { pop(enemyArt, "+" + e.amt, "heal"); Snd.tap(); }
    if (e.t === "boost" || e.t === "awaken") Snd.buff();
    if (e.t === "end") { (e.result === "win" ? Snd.win() : Snd.lose()); }

    syncBattleStats();
  }

  function punch(art, txt, kind) {
    if (!art) return;
    art.classList.add("shake", "flash");
    setTimeout(() => art.classList.remove("shake", "flash"), 220);
    pop(art, txt, kind);
  }
  function pop(art, txt, kind) {
    if (!art) return;
    const n = h("div", { class: "pop " + kind, text: txt });
    art.appendChild(n);
    setTimeout(() => n.remove(), 950);
  }
  function pushLog(text, cls) {
    const log = el("log");
    if (!log || !text) return;
    [].forEach.call(log.children, (c) => c.classList.remove("now"));
    log.appendChild(h("div", { class: "ln now " + (cls || ""), text }));
    while (log.children.length > 40) log.firstChild.remove();
    log.parentNode.scrollTop = log.parentNode.scrollHeight;
  }

  // The counter rolls to its new value instead of jumping, the way a console
  // RPG shows damage landing.
  function rollTo(node, value) {
    const from = parseInt(node.dataset.v || node.textContent, 10);
    const to = Math.max(0, value);
    if (!isFinite(from) || from === to) { node.dataset.v = to; node.textContent = to; return; }
    clearInterval(node._roll);
    const step = from > to ? -1 : 1;
    let cur = from;
    node._roll = setInterval(() => {
      cur += step;
      node.textContent = cur;
      node.dataset.v = cur;
      node.classList.toggle("rolling", cur !== to);
      if (cur === to) { clearInterval(node._roll); node.classList.remove("rolling"); }
    }, 70);
  }

  function syncBattleStats() {
    const b = G.battle, s = b.state, st = G.stage;
    const set = (id, fn) => { const n = el(id); if (n) fn(n); };
    set("ehpBar", (n) => { n.style.width = Math.max(0, s.ehp) / st.hp * 100 + "%"; });
    set("ehpNum", (n) => rollTo(n, s.ehp));
    set("phpBar", (n) => { n.style.width = Math.max(0, s.php) / PLAYER_MAX_HP * 100 + "%"; });
    set("phpNum", (n) => rollTo(n, s.php));
    set("patkTxt", (n) => { n.textContent = String(s.patk); });
    set("turnTxt", (n) => { n.textContent = "ターン " + b.turn; });
    set("awakenChip", (n) => { n.hidden = !s.awaken; });
    set("nextRow", (n) => { n.hidden = s.ehp <= 0; });
    set("nextTxt", (n) => {
      const na = nextEnemyAct(st, s.eidx);
      n.textContent = hasSeen(st) ? actShort(na) : "？？？";
      n.className = "chip " + (na.t === "strong" ? "amber" : na.t === "charge" ? "teal" : "");
    });
    set("enemyArt", (n) => { n.classList.toggle("down", s.ehp <= 0); });
    set("playerArt", (n) => { n.classList.toggle("down", s.php <= 0); });
    const trace = el("trace");
    if (trace) [].forEach.call(trace.children, (c, i) => {
      c.classList.toggle("on", i === b.cardIdx);
      c.classList.toggle("ghost", i >= G.deck.length);
    });
  }

  function viewBattle() {
    const st = G.stage, s = G.battle.state;
    const enemy = h("div", { class: "card" }, [
      h("div", { class: "fighter" }, [
        h("div", { class: "art", id: "enemyArt",
                   style: "--stage-a:" + STAGE_HUES[st.sprite][0] + ";--stage-b:" + STAGE_HUES[st.sprite][1] },
          [spriteImg(st.sprite, 80)]),
        h("div", { class: "info" }, [
          h("div", { class: "row1" }, [
            h("span", { class: "nm", text: st.name }),
            h("span", { class: "tiny dim", id: "turnTxt", text: "ターン 1" }),
          ]),
          h("div", { class: "bar enemy" }, [h("i", { id: "ehpBar", style: "width:100%" })]),
          h("div", { class: "stat-row" }, [
            h("span", { class: "k", text: "HP" }),
            h("span", { class: "v" }, [
              h("span", { class: "odo", id: "ehpNum", text: String(st.hp) }),
              h("span", { class: "dim", text: " / " + st.hp }),
            ]),
          ]),
          h("div", { class: "row1", id: "nextRow" }, [
            h("span", { class: "tiny dim", text: "つぎの手" }),
            h("span", { class: "chip", id: "nextTxt", text: "…" }),
          ]),
        ]),
      ]),
    ]);

    const player = h("div", { class: "card" }, [
      h("div", { class: "fighter small" }, [
        h("div", { class: "art", id: "playerArt",
                   style: "--stage-a:" + STAGE_HUES.hero[0] + ";--stage-b:" + STAGE_HUES.hero[1] },
          [spriteImg("hero", 64)]),
        h("div", { class: "info" }, [
          h("div", { class: "row1" }, [
            h("span", { class: "nm", text: "ゆうしゃ" }),
            h("span", { class: "chip amber", id: "awakenChip", hidden: "", text: "かくせい" }),
          ]),
          h("div", { class: "bar player" }, [h("i", { id: "phpBar", style: "width:100%" })]),
          h("div", { class: "stat-row" }, [
            h("span", { class: "k", text: "HP" }),
            h("span", { class: "v" }, [
              h("span", { class: "odo", id: "phpNum", text: String(PLAYER_MAX_HP) }),
              h("span", { class: "dim", text: " / " + PLAYER_MAX_HP }),
            ]),
          ]),
          h("div", { class: "stat-row" }, [
            h("span", { class: "k", text: "こうげき力" }),
            h("span", { class: "v", id: "patkTxt", text: String(PLAYER_BASE_ATK) }),
          ]),
        ]),
      ]),
      h("div", { class: "trace", id: "trace", style: "margin-top:12px" },
        Array.from({ length: MAX_DECK }, (_, i) =>
          h("div", { class: "s" + (i >= G.deck.length ? " ghost" : "") }))),
    ]);

    const log = h("div", { class: "card", style: "flex:1;min-height:150px;overflow-y:auto" },
      [h("div", { id: "log" })]);

    return [enemy, player, log];
  }

  function renderBattleBar() {
    const b = G.battle;
    barEl.innerHTML = "";
    if (b.done) barEl.appendChild(button("けっかを見る", () => finishBattle(), { primary: true }));
    else {
      barEl.appendChild(button("1つ進める", () => { stepBattle(); scheduleStep(b.fast ? 130 : 520); }));
      barEl.appendChild(button("さいごまで", () => {
        b.fast = true;
        clearTimeout(b.timer);
        while (!b.done) stepBattle();
        renderBattleBar();
      }, { primary: true }));
    }
  }

  function finishBattle() {
    const b = G.battle;
    clearTimeout(b.timer);
    G.result = b.result;
    G.gained = [];
    if (b.result === "win" && save.cleared.indexOf(G.stage.id) < 0) {
      save.cleared.push(G.stage.id);
      G.gained = G.stage.reward.slice();
      writeSave();
    }
    go("result");
  }

  // ---- result
  function viewResult() {
    const won = G.result === "win";
    const out = [
      h("div", { class: "banner " + (won ? "win" : "lose") }, [
        h("h2", { text: won ? "しょうり！" : G.result === "lose" ? "はいぼく…" : "ひきわけ" }),
        h("div", { class: "sub", text: won ? G.stage.name + " を たおした" : "作戦を組み直して もう一度" }),
      ]),
    ];
    if (won && G.gained.length) {
      out.push(h("div", { class: "card" }, [h("h2", { text: "カードを おぼえた！" })].concat(
        G.gained.map((id) => {
          const c = CARDS[id];
          return h("div", { class: "reward" }, [
            kindDot(c.kind),
            h("div", {}, [h("div", { class: "n", style: "font-weight:650", text: c.name }),
                          h("div", { class: "d small muted", text: c.desc })]),
          ]);
        }))));
    } else if (!won) {
      out.push(h("div", { class: "card" }, [
        h("h2", { text: "ヒント" }),
        h("div", { class: "small muted", text: G.stage.hint }),
      ]));
    }
    return out;
  }

  function viewEnding() {
    return [
      h("div", { class: "banner win" }, [
        h("h2", { text: "ぜんステージ クリア！" }),
        h("div", { class: "sub", text: "作戦だけで 竜を たおした" }),
      ]),
      h("div", { class: "card", style: "text-align:center" }, [spriteImg("dragon", 128)]),
      h("div", { class: "card" }, [
        h("div", { class: "small muted", text: "強さはステータスではなく、組み立てた作戦のことでした。カードを変えれば、別の答えも見つかります。" }),
      ]),
    ];
  }

  // ------------------------------------------------------------- rendering
  const SCREENS = {
    title:  { title: "オートバトルRPG", view: viewTitle, back: null },
    howto:  { title: "あそびかた", view: viewHowto, back: "title" },
    map:    { title: "ステージ", view: viewMap, back: "title" },
    info:   { title: "てきの じょうほう", view: viewInfo, back: "map" },
    deck:   { title: "さくせん", view: viewDeck, back: "map" },
    pick:   { title: "カードを えらぶ", view: viewPick, back: "deck" },
    plan:   { title: "ためしうち", view: viewPlan, back: "deck" },
    battle: { title: "バトル", view: viewBattle, back: null },
    result: { title: "けっか", view: viewResult, back: null },
    ending: { title: "おわり", view: viewEnding, back: null },
  };

  function render() {
    const sc = SCREENS[G.screen];
    titleEl.textContent = sc.title;
    metaEl.textContent = metaFor(G.screen);
    backEl.hidden = !sc.back;
    backEl.onclick = sc.back ? () => { Snd.init(); Snd.back(); go(sc.back); } : null;

    viewEl.innerHTML = "";
    sc.view().forEach((n) => n && viewEl.appendChild(n));
    viewEl.scrollTop = 0;

    barEl.innerHTML = "";
    actionsFor(G.screen).forEach((b) => barEl.appendChild(b));

    if (G.screen === "battle") { syncBattleStats(); renderBattleBar(); }
  }

  function metaFor(screen) {
    if (screen === "map") return ownedCards().length + " / " + ALL_CARDS.length + " まい";
    if (screen === "deck" || screen === "plan") return "VS " + G.stage.name;
    if (screen === "info") return "ステージ " + G.stage.id;
    return "";
  }

  function actionsFor(screen) {
    switch (screen) {
      case "title":
        return [button("あそびかた", () => go("howto")), button("はじめる", () => go("map"), { primary: true })];
      case "howto":
        return [button("とじる", () => go("title"), { primary: true })];
      case "map":
        return [];
      case "info":
        return [button("さくせんへ", () => go("deck"), { primary: true })];
      case "deck":
        return [
          button("ためしうち", () => go("plan"), { disabled: !G.deck.length || !hasSeen(G.stage) }),
          button("たたかう", () => { saveDeck(); startBattle(); }, { primary: true, disabled: !G.deck.length }),
        ];
      case "pick":
        return [button("やめる", () => go("deck"))];
      case "plan":
        return [button("さくせんへ", () => go("deck")), button("たたかう", () => { saveDeck(); startBattle(); }, { primary: true })];
      case "battle":
        return [];
      case "result":
        return [
          button("ステージへ", () => go("map")),
          button(G.result === "win" && G.stage.id === STAGES[STAGES.length - 1].id ? "エンディング" : "さくせんへ",
            () => {
              if (G.result === "win" && G.stage.id === STAGES[STAGES.length - 1].id) go("ending");
              else go("deck");
            }, { primary: true }),
        ];
      case "ending":
        return [button("タイトルへ", () => go("title"), { primary: true })];
      default:
        return [];
    }
  }

  el("sndBtn").addEventListener("click", () => {
    Snd.init();
    Snd.on = !Snd.on;
    el("sndBtn").textContent = Snd.on ? "♪" : "🔇";
    el("sndBtn").style.color = Snd.on ? "" : "var(--dim)";
    if (Snd.on) Snd.ok();
  });

  // test hook: lets the automated checks assert what a tap actually did
  const probe = () => { window.__abrpg = { screen: G.screen, deck: G.deck.slice() }; };
  const origRender = render;
  render = function () { origRender(); probe(); };

  loadSave();
  render();
})();
</script>
</body>
</html>
