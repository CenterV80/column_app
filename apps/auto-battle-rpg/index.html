<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>オートバトルRPG</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1118;
    --surface: #171c28;
    --surface-2: #1f2637;
    --line: #2d3648;
    --text: #e9edf7;
    --muted: #98a2b8;
    --dim: #6b7690;
    --accent: #7c6cff;
    --accent-soft: #7c6cff26;
    --teal: #34d8a8;
    --coral: #ff6b7a;
    --amber: #ffc24b;
    --sky: #5bc8ff;
    --radius: 14px;
    --tap: 48px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    overscroll-behavior: none;
  }

  #app {
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* ---------- chrome ---------- */
  #topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  #topbar .back {
    width: 40px; height: 40px;
    flex: none;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
  }
  #topbar .back:active { background: var(--line); }
  #topbar h1 { font-size: 16px; font-weight: 650; letter-spacing: .01em; flex: 1; min-width: 0;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #topbar .meta { font-size: 12px; color: var(--muted); flex: none; }
  #topbar .icon-btn {
    width: 40px; height: 40px; flex: none;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--muted); font-size: 15px; cursor: pointer;
  }

  #view {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #actionbar {
    flex: none;
    display: flex;
    gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  #actionbar:empty { display: none; }

  /* ---------- primitives ---------- */
  .btn {
    flex: 1;
    min-height: var(--tap);
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform .06s ease, background .12s ease;
  }
  .btn:active { transform: scale(.985); background: var(--line); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:active { background: #6a5aee; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:active { transform: none; background: var(--surface-2); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  .card h2 { font-size: 13px; font-weight: 650; color: var(--muted); letter-spacing: .04em; margin-bottom: 10px; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--line);
  }
  .chip.teal  { color: var(--teal);   border-color: #34d8a840; background: #34d8a814; }
  .chip.coral { color: var(--coral);  border-color: #ff6b7a40; background: #ff6b7a14; }
  .chip.amber { color: var(--amber);  border-color: #ffc24b40; background: #ffc24b14; }
  .chip.violet{ color: var(--accent); border-color: #7c6cff40; background: var(--accent-soft); }
  .chip.sky   { color: var(--sky);    border-color: #5bc8ff40; background: #5bc8ff14; }

  .sprite { image-rendering: pixelated; display: block; }

  .bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; border-radius: 999px; transition: width .32s cubic-bezier(.4,0,.2,1); }
  .bar.enemy > i { background: linear-gradient(90deg, #ff8b7a, var(--coral)); }
  .bar.player > i { background: linear-gradient(90deg, #4be3b5, var(--teal)); }

  .stat-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; }
  .stat-row .k { color: var(--muted); }
  .stat-row .v { font-variant-numeric: tabular-nums; font-weight: 650; }

  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }

  /* ---------- title ---------- */
  .hero {
    border-radius: 18px;
    background: radial-gradient(120% 90% at 78% 12%, #2a2150 0%, #141a28 58%, #10131d 100%);
    border: 1px solid var(--line);
    padding: 22px 116px 18px 18px;
    position: relative;
    overflow: hidden;
  }
  .hero .dragon { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); opacity: .9; }
  .hero .kicker { font-size: 12px; letter-spacing: .18em; color: var(--accent); font-weight: 700; }
  .hero h2 { font-size: 27px; line-height: 1.2; margin: 6px 0 8px; font-weight: 750; letter-spacing: -.01em; }
  .hero p { font-size: 13px; color: var(--muted); }

  .feature { display: flex; gap: 10px; align-items: flex-start; }
  .feature + .feature { margin-top: 12px; }
  .feature .ico {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    display: grid; place-items: center; font-size: 15px;
    background: var(--accent-soft); color: var(--accent);
  }
  .feature .t { font-size: 14px; font-weight: 650; }
  .feature .d { font-size: 12.5px; color: var(--muted); }

  /* ---------- stage list ---------- */
  .stage {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; cursor: pointer;
    font: inherit; color: var(--text);
    transition: transform .06s ease, border-color .12s ease;
  }
  .stage:active { transform: scale(.99); border-color: var(--accent); }
  .stage.locked { opacity: .5; cursor: default; }
  .stage.locked:active { transform: none; border-color: var(--line); }
  .stage .thumb {
    width: 56px; height: 56px; flex: none; border-radius: 11px;
    background: var(--surface-2); display: grid; place-items: center; overflow: hidden;
  }
  .stage .body { flex: 1; min-width: 0; }
  .stage .name { font-weight: 650; font-size: 15px; }
  .stage .sub { font-size: 12.5px; color: var(--muted); }
  .stage .go { color: var(--dim); font-size: 18px; flex: none; }

  /* ---------- schedule ---------- */
  .sched { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .sched::-webkit-scrollbar { display: none; }
  .sched .t {
    flex: none; min-width: 58px; border-radius: 10px; padding: 6px 8px;
    background: var(--surface-2); border: 1px solid var(--line); text-align: center;
  }
  .sched .t.strong { border-color: #ffc24b66; background: #ffc24b1a; }
  .sched .t.safe { border-color: #34d8a855; background: #34d8a814; }
  .sched .t .n { font-size: 10.5px; color: var(--dim); font-weight: 700; letter-spacing: .06em; }
  .sched .t .a { font-size: 12.5px; font-weight: 650; white-space: nowrap; }
  .sched .t.strong .a { color: var(--amber); }
  .sched .t.safe .a { color: var(--teal); }

  /* ---------- deck slots ---------- */
  .slots { display: flex; flex-direction: column; gap: 8px; }
  .slot {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 8px 8px 4px;
    touch-action: pan-y;
  }
  .slot.indent { margin-left: 18px; border-left: 3px solid var(--amber); }
  .slot.dragging { opacity: .92; border-color: var(--accent); box-shadow: 0 10px 24px #0008; position: relative; z-index: 5; }
  .slot.drop-target { border-color: var(--accent); background: var(--accent-soft); }
  .slot .handle {
    width: 34px; min-height: 44px; flex: none;
    display: grid; place-items: center; color: var(--dim);
    cursor: grab; touch-action: none; font-size: 15px;
  }
  .slot .main { flex: 1; min-width: 0; }
  .slot .name { font-weight: 650; font-size: 14.5px; display: flex; align-items: center; gap: 7px; }
  .slot .desc { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .del {
    width: 42px; height: 42px; flex: none; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--muted); font-size: 15px; cursor: pointer;
  }
  .slot .del:active { background: var(--line); color: var(--coral); }
  .slot.empty { border-style: dashed; justify-content: center; padding: 0; }
  .slot.empty button {
    width: 100%; min-height: var(--tap); background: none; border: 0;
    color: var(--muted); font: inherit; font-size: 13.5px; cursor: pointer;
  }

  .kind-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }

  .verdict {
    display: flex; align-items: center; gap: 10px;
    border-radius: 12px; padding: 11px 13px;
    border: 1px solid var(--line); background: var(--surface);
    font-size: 13.5px;
  }
  .verdict.win  { border-color: #34d8a855; background: #34d8a812; }
  .verdict.lose { border-color: #ff6b7a55; background: #ff6b7a12; }
  .verdict b { font-variant-numeric: tabular-nums; }

  /* ---------- card picker ---------- */
  .pick-group + .pick-group { margin-top: 14px; }
  .pick-group h3 { font-size: 12px; color: var(--muted); font-weight: 650; letter-spacing: .05em; margin-bottom: 8px; }
  .pick {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 12px; min-height: var(--tap); cursor: pointer; font: inherit; color: var(--text);
  }
  .pick + .pick { margin-top: 8px; }
  .pick:active { border-color: var(--accent); background: var(--accent-soft); }
  .pick.locked { opacity: .42; cursor: default; }
  .pick.locked:active { border-color: var(--line); background: var(--surface); }
  .pick .n { font-weight: 650; font-size: 14.5px; }
  .pick .d { font-size: 12.5px; color: var(--muted); }

  /* ---------- plan table ---------- */
  table.plan { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.plan th { text-align: left; font-size: 11.5px; color: var(--dim); font-weight: 650; padding: 0 6px 8px; letter-spacing: .04em; }
  table.plan td { padding: 9px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  table.plan tr.hit td { background: #ff6b7a0d; }
  table.plan .turn { color: var(--dim); font-weight: 700; width: 20px; }
  table.plan .mine { font-weight: 600; }
  table.plan .num { text-align: right; width: 34px; }
  table.plan .efoe { color: var(--muted); font-size: 12px; }

  /* ---------- battle ---------- */
  .fighter { display: flex; gap: 12px; align-items: center; }
  .fighter .art {
    width: 92px; height: 92px; flex: none; border-radius: 13px;
    background: radial-gradient(70% 70% at 50% 35%, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .fighter.small .art { width: 72px; height: 72px; }
  .fighter .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .fighter .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fighter .nm { font-weight: 650; font-size: 15px; }

  @keyframes hit { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .art.shake { animation: hit .22s ease; }
  .art.flash > .sprite { filter: brightness(2.6) saturate(.3); }
  .art.down > .sprite { opacity: .25; filter: grayscale(1); transition: opacity .4s ease; }

  .pop {
    position: absolute; left: 50%; top: 24%;
    transform: translateX(-50%);
    font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums;
    pointer-events: none; animation: rise .9s ease-out forwards;
    text-shadow: 0 2px 8px #000a;
  }
  .pop.dmg { color: var(--coral); }
  .pop.heal { color: var(--teal); }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.8); }
                    22% { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
                    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); } }

  .trace { display: flex; gap: 5px; }
  .trace .s {
    flex: 1; height: 7px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line);
  }
  .trace .s.on { background: var(--accent); border-color: transparent; }
  .trace .s.ghost { opacity: .35; }

  #log { display: flex; flex-direction: column; gap: 6px; }
  #log .ln { font-size: 13.5px; color: var(--muted); }
  #log .ln.turn { color: var(--dim); font-size: 11.5px; font-weight: 700; letter-spacing: .07em;
                  margin-top: 4px; text-transform: uppercase; }
  #log .ln.now { color: var(--text); font-weight: 600; }
  #log .ln.good { color: var(--teal); }
  #log .ln.bad { color: var(--coral); }
  #log .ln.warn { color: var(--amber); }

  /* ---------- result ---------- */
  .banner { border-radius: 16px; padding: 20px 16px; text-align: center; border: 1px solid var(--line); }
  .banner.win { background: linear-gradient(180deg, #34d8a81f, transparent); border-color: #34d8a855; }
  .banner.lose { background: linear-gradient(180deg, #ff6b7a1a, transparent); border-color: #ff6b7a55; }
  .banner h2 { font-size: 24px; font-weight: 750; }
  .banner .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .reward { display: flex; gap: 10px; align-items: flex-start; }
  .reward + .reward { margin-top: 10px; }

  #footer { display: none; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="back" id="backBtn" aria-label="もどる" hidden>←</button>
    <h1 id="title">オートバトルRPG</h1>
    <span class="meta" id="meta"></span>
    <button class="icon-btn" id="sndBtn" aria-label="サウンド切り替え">♪</button>
  </header>
  <main id="view"></main>
  <footer id="actionbar"></footer>
</div>
<p id="footer"><a href="../../categories/mini-apps/index.html">← ミニアプリ一覧</a></p>

<script>
(function () {
  "use strict";

  // =====================================================================
  // ENGINE START  (dev-scripts/verify-auto-battle.js extracts this block)
  // =====================================================================

  const CARDS = {
    attack:   { id:"attack",   name:"こうげき",     kind:"action", short:"こうげき",
                desc:"こうげき力ぶん てきに ダメージ" },
    heal:     { id:"heal",     name:"かいふく",     kind:"action", short:"かいふく",
                desc:"じぶんの HPを 3かいふく する" },
    guard:    { id:"guard",    name:"ぼうぎょ",     kind:"state",  short:"ぼうぎょ",
                desc:"このターン うけるダメージ-4 1バトル1かい" },
    reckless: { id:"reckless", name:"すてみ",       kind:"action", short:"すてみ",
                desc:"HP-2 して こうげき力+2" },
    plus2:    { id:"plus2",    name:"+2",           kind:"boost",  short:"+2",
                desc:"こうげき力+2 1バトルに1かい" },
    times2:   { id:"times2",   name:"×2",           kind:"boost",  short:"×2",
                desc:"こうげき力×2 1バトルに1かい" },
    power:    { id:"power",    name:"るいじょう",   kind:"boost",  short:"るいじょう", needAwaken:true,
                desc:"こうげき力を 2じょう かくせい中のみ" },
    ifPinch:  { id:"ifPinch",  name:"ピンチ?",      kind:"cond",   short:"ピンチ?",
                desc:"じぶんの HPが 2いかなら すすむ" },
    ifHalf:   { id:"ifHalf",   name:"HPはんぶん?",  kind:"cond",   short:"はんぶん?",
                desc:"じぶんの HPが はんぶんいかなら" },
    ifStrong: { id:"ifStrong", name:"つよこうげき?",kind:"cond",   short:"つよこう?",
                desc:"てきの つぎの手が つよこうげきなら" },
    ifCharge: { id:"ifCharge", name:"ためる?",       kind:"cond",   short:"ためる?",
                desc:"てきの つぎの手が ためる なら" },
  };

  const START_CARDS = ["attack", "heal"];

  const STAGES = [
    {
      id: 1, name: "スライム", sprite: "slime", hp: 6, armor: 0,
      pattern: [{ t:"attack", v:2 }],
      reward: ["reckless", "plus2"],
      hint: "まいターン こうげき2。まずは なぐり合いで かてる。",
    },
    {
      id: 2, name: "ゴブリン", sprite: "goblin", hp: 12, armor: 0,
      pattern: [{ t:"attack", v:3 }, { t:"attack", v:3 }, { t:"strong", v:6 }],
      reward: ["guard", "ifStrong", "ifCharge"],
      hint: "3ターンめに つよこうげき6。こうげき力を あげないと 3ターンで たおせない。",
    },
    {
      id: 3, name: "ゴーレム", sprite: "golem", hp: 12, armor: 1,
      pattern: [{ t:"attack", v:3 }, { t:"charge" }, { t:"strong", v:9 }],
      reward: ["times2", "ifHalf"],
      hint: "ダメージを1へらす いわのからだ。つよこうげき9は ぼうぎょで うけろ。",
    },
    {
      id: 4, name: "ウィッチ", sprite: "witch", hp: 26, armor: 0,
      pattern: [{ t:"attack", v:2 }, { t:"heal", v:3 }, { t:"attack", v:2 }, { t:"strong", v:6 }],
      reward: ["power", "ifPinch"],
      hint: "じぶんを 3かいふくする。けずる はやさで まけると たおせない。",
    },
    {
      id: 5, name: "らいりゅう", sprite: "dragon", hp: 34, armor: 1,
      pattern: [{ t:"attack", v:3 }, { t:"attack", v:3 }, { t:"charge" }, { t:"strong", v:10 }],
      reward: [],
      hint: "HP30。ふつうに たたかっては ぜったいに たりない。ピンチで かくせいし るいじょうを うて。",
    },
  ];

  const MAX_DECK = 6;
  const MAX_TURNS = 30;
  const PLAYER_MAX_HP = 10;
  const PLAYER_BASE_ATK = 2;
  const AWAKEN_HP = 2;

  // Jump target when a condition fails: skip past this block's action card.
  function skipBlock(deck, i) {
    for (let j = i + 1; j < deck.length; j++) {
      if (CARDS[deck[j]].kind === "action") return j + 1;
    }
    return deck.length;
  }

  function nextEnemyAct(stage, idx) {
    return stage.pattern[idx % stage.pattern.length];
  }

  function evalCond(id, P, E, stage) {
    if (id === "ifPinch") return P.hp <= AWAKEN_HP;
    if (id === "ifHalf") return P.hp * 2 <= P.maxHp;
    if (id === "ifStrong") return nextEnemyAct(stage, E.idx).t === "strong";
    if (id === "ifCharge") return nextEnemyAct(stage, E.idx).t === "charge";
    return false;
  }

  // Fully deterministic: the same deck against the same stage always
  // produces the same event list. No randomness anywhere.
  function simulate(stage, deck) {
    const P = { hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP, atk: PLAYER_BASE_ATK,
                awaken: false, used: {}, guard: 0 };
    const E = { hp: stage.hp, maxHp: stage.hp, armor: stage.armor || 0, idx: 0 };
    const events = [];
    let result = "draw";

    const snap = () => ({
      php: P.hp, patk: P.atk, ehp: E.hp, awaken: P.awaken,
      used: Object.assign({}, P.used), eidx: E.idx, guard: P.guard,
    });
    const push = (o) => { o.s = snap(); events.push(o); };

    const checkAwaken = () => {
      if (P.hp > 0 && P.hp <= AWAKEN_HP && !P.awaken) {
        P.awaken = true;
        push({ t: "awaken" });
      }
    };

    for (let turn = 1; turn <= MAX_TURNS; turn++) {
      push({ t: "turn", turn });

      let i = 0, acted = false;
      while (i < deck.length) {
        const c = CARDS[deck[i]];

        if (c.kind === "cond") {
          const ok = evalCond(c.id, P, E, stage);
          push({ t: "cond", card: c.id, idx: i, ok });
          i = ok ? i + 1 : skipBlock(deck, i);
          continue;
        }

        // Boosts and states are once-per-battle resources: they resolve
        // without ending the turn, so a block can brace and still act.
        if (c.kind === "boost" || c.kind === "state") {
          const blocked = P.used[c.id] ? "used" : (c.needAwaken && !P.awaken ? "noawaken" : null);
          if (blocked) {
            push({ t: "boostFail", card: c.id, idx: i, reason: blocked });
          } else if (c.id === "guard") {
            P.guard = 4;
            P.used[c.id] = true;
            push({ t: "guard", card: c.id, idx: i });
          } else {
            const from = P.atk;
            if (c.id === "plus2") P.atk += 2;
            else if (c.id === "times2") P.atk *= 2;
            else if (c.id === "power") { P.atk = P.atk * P.atk; P.awaken = false; }
            P.used[c.id] = true;
            push({ t: "boost", card: c.id, idx: i, from, to: P.atk });
          }
          i++;
          continue;
        }

        acted = true;
        if (c.id === "attack") {
          const dmg = Math.max(1, P.atk - E.armor);
          E.hp -= dmg;
          push({ t: "attack", card: c.id, idx: i, dmg });
        } else if (c.id === "heal") {
          const before = P.hp;
          P.hp = Math.min(P.maxHp, P.hp + 3);
          push({ t: "heal", card: c.id, idx: i, amt: P.hp - before });
        } else if (c.id === "reckless") {
          P.hp -= 2; P.atk += 2;
          push({ t: "reckless", card: c.id, idx: i });
        }
        break;
      }
      if (!acted) push({ t: "idle" });

      checkAwaken();
      if (E.hp <= 0) { result = "win"; break; }
      if (P.hp <= 0) { result = "lose"; break; }

      const act = nextEnemyAct(stage, E.idx);
      E.idx++;
      if (act.t === "attack" || act.t === "strong") {
        const dmg = Math.max(0, act.v - P.guard);
        P.hp -= dmg;
        push({ t: "enemyAtk", kind: act.t, raw: act.v, dmg, guarded: P.guard > 0 });
      } else if (act.t === "charge") {
        push({ t: "enemyCharge" });
      } else if (act.t === "heal") {
        const before = E.hp;
        E.hp = Math.min(E.maxHp, E.hp + act.v);
        push({ t: "enemyHeal", amt: E.hp - before });
      }
      P.guard = 0;

      checkAwaken();
      if (P.hp <= 0) { result = "lose"; break; }
      if (E.hp <= 0) { result = "win"; break; }
    }

    push({ t: "end", result });
    return { events, result };
  }

  };
  const TONE_OF = { "0": 0, "1": 1, "2": 2, "3": 3 };
  const spriteCache = {};

  function spriteURL(name, scale) {
    const key = name + "@" + scale;
    if (spriteCache[key]) return spriteCache[key];
    const art = SPRITES[name], ramp = RAMPS[name] || RAMPS.golem;
    const size = art.length;
    const c = document.createElement("canvas");
    c.width = c.height = size * scale;
    const x = c.getContext("2d");
    for (let r = 0; r < size; r++) {
      const row = art[r];
      for (let i = 0; i < row.length; i++) {
        const t = TONE_OF[row[i]];
        if (t === undefined) continue;
        x.fillStyle = ramp[t];
        x.fillRect(i * scale, r * scale, scale, scale);
      }
    }
    return (spriteCache[key] = c.toDataURL());
  }

  function spriteImg(name, px) {
    const art = SPRITES[name];
    const scale = Math.max(1, Math.round(px / art.length));
    const img = new Image();
    img.className = "sprite";
    img.src = spriteURL(name, scale);
    img.width = img.height = art.length * scale;
    img.alt = "";
    return img;
  }

  const Snd = {
    ac: null, on: true,
    init() {
      if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ac = new AC();
    },
    tone(freq, dur, when, vol, type) {
      if (!this.on || !this.ac) return;
      const t0 = this.ac.currentTime + (when || 0);
      const osc = this.ac.createOscillator(), g = this.ac.createGain();
      osc.type = type || "triangle";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol === undefined ? 0.06 : vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.ac.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    },
    tap() { this.tone(620, 0.06, 0, 0.04); },
    ok() { this.tone(700, 0.07); this.tone(1040, 0.09, 0.05); },
    back() { this.tone(360, 0.09, 0, 0.045); },
    hit() { this.tone(190, 0.1, 0, 0.07, "square"); this.tone(120, 0.13, 0.04, 0.05, "square"); },
    hurt() { this.tone(150, 0.16, 0, 0.06, "sawtooth"); },
    buff() { [660, 880, 1170].forEach((f, i) => this.tone(f, 0.08, i * 0.05, 0.05)); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, i * 0.11, 0.06)); },

      if (Array.isArray(o.seen)) save.seen = o.seen;

  function planRows(stage, deck) {
    const sim = simulate(stage, deck);
    const rows = [];
    let cur = null;
    const ACTS = { attack: "こうげき", heal: "かいふく", guard: "ぼうぎょ",
                   reckless: "すてみ", idle: "ようす見" };
    sim.events.forEach((e) => {
      if (e.t === "turn") {
        cur = { turn: e.turn, boosts: [], act: "", php: e.s.php, ehp: e.s.ehp, enemy: "" };
        rows.push(cur);
        return;
      }
      if (!cur) return;
      if (e.t === "boost") cur.boosts.push(CARDS[e.card].short);
      else if (ACTS[e.t]) cur.act = ACTS[e.t];
      else if (e.t === "guard") cur.boosts.push("ぼうぎょ");
      else if (e.t === "enemyAtk") cur.enemy = (e.kind === "strong" ? "つよ" : "こう") + e.dmg;
      else if (e.t === "enemyCharge") cur.enemy = "ためる";
      else if (e.t === "enemyHeal") cur.enemy = "かいふく";
      cur.php = e.s.php; cur.ehp = e.s.ehp;
    });
    return { rows, result: sim.result };
  }

  // Depth per card, so conditional blocks read as indented groups.
  function deckIndents(deck) {
    const out = [];
    let inBlock = false;
    deck.forEach((id) => {
      const c = CARDS[id];
      if (c.kind === "cond") { out.push(0); inBlock = true; return; }
      out.push(inBlock ? 1 : 0);
      if (c.kind === "action") inBlock = false;
    });
    return out;
  }

  // One-line verdict for the deck screen.
  function planSummary(stage, deck) {
    const { rows, result } = planRows(stage, deck);
    const last = rows[rows.length - 1];
    const n = last ? last.turn : 0;
    if (result === "win") return { s: n + "ターンめに しょうり  のこりHP" + Math.max(0, last.php), ok: true };
    if (result === "lose") return { s: n + "ターンめに はいぼく  てきHP" + Math.max(0, last.ehp) + "のこり", ok: false };
    return { s: "きまらない (" + n + "ターン ひきわけ)", ok: false };
  }

  function slotRow(id, i, indent) {
    const c = CARDS[id];
    const row = h("div", { class: "slot" + (indent ? " indent" : ""), "data-i": i }, [
      h("div", { class: "handle", text: "⠿" }),
      h("div", { class: "main", onclick: () => { Snd.init(); Snd.ok(); G.slotIndex = i; go("pick"); } }, [
        h("div", { class: "name" }, [
          kindDot(c.kind), c.name,
          (c.kind === "boost" || c.kind === "state") ? h("span", { class: "chip", text: "1回" }) : null,
        ]),

          ev.stopPropagation();
          if (G.deck.length <= 1) { Snd.back(); return; }
          Snd.init(); Snd.back();
          G.deck.splice(i, 1);
          saveDeck(); render();
        },
      }),
    ]);
    enableDrag(row, i);
    return row;
  }

  // Ordering is the whole game, so reordering gets a real drag gesture.
  function enableDrag(row, index) {
    const handle = row.querySelector(".handle");
    let st = null;
    handle.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      Snd.init();
      handle.setPointerCapture(ev.pointerId);
      st = { y0: ev.clientY, dy: 0, h: row.getBoundingClientRect().height + 8 };
      row.classList.add("dragging");
    });
    handle.addEventListener("pointermove", (ev) => {
      if (!st) return;
      st.dy = ev.clientY - st.y0;
      row.style.transform = "translateY(" + st.dy + "px)";
      const to = target(st);
      [].forEach.call(row.parentNode.children, (c, i) => c.classList.toggle("drop-target", i === to && to !== index));
    });
    const finish = () => {
      if (!st) return;
      const to = target(st);
      row.style.transform = "";
      row.classList.remove("dragging");
      st = null;
      if (to !== index) {
        const card = G.deck.splice(index, 1)[0];
        G.deck.splice(to, 0, card);
        saveDeck(); Snd.ok();
      }
      render();
    };
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
    function target(s) {
      return Math.max(0, Math.min(G.deck.length - 1, index + Math.round(s.dy / s.h)));
    }
  }

  function saveDeck() {
    if (!G.stage) return;
    save.decks[G.stage.id] = G.deck.slice();
    writeSave();
  }

  // ---- card picker
  const ALL_CARDS = ["attack", "heal", "reckless", "guard", "plus2", "times2", "power",
                     "ifHalf", "ifStrong", "ifCharge", "ifPinch"];

  function viewPick() {

    const groups = [["action", "こうどう（実行してターン終了）"], ["boost", "きょうか（1バトル1回）"],

    return groups.map(([kind, label]) => {

  // ---- battle
  function startBattle() {
    const sim = simulate(G.stage, G.deck);
    G.battle = {
      events: sim.events, result: sim.result, i: -1, done: false, fast: false,
      state: { php: PLAYER_MAX_HP, patk: PLAYER_BASE_ATK, ehp: G.stage.hp, awaken: false, eidx: 0 },
      turn: 1, cardIdx: -1, timer: null,
    };
    if (!hasSeen(G.stage)) { save.seen.push(G.stage.id); writeSave(); }
    go("battle");
    scheduleStep(520);
  }

  function scheduleStep(ms) {
    const b = G.battle;
    if (!b) return;
    clearTimeout(b.timer);
    b.timer = setTimeout(() => { stepBattle(); if (!b.done) scheduleStep(b.fast ? 130 : 520); }, ms);
  }

  function stepBattle() {
    const b = G.battle;
    if (!b || b.done) return;
    b.i++;
    if (b.i >= b.events.length) { b.done = true; renderBattleBar(); return; }
    const e = b.events[b.i];
    const prev = b.state;
    b.state = e.s;
    b.cardIdx = e.idx === undefined ? b.cardIdx : e.idx;
    if (e.t === "turn") b.turn = e.turn;
    applyBattleEvent(e, prev);
    if (e.t === "end") { b.done = true; renderBattleBar(); }
  }

  function applyBattleEvent(e, prev) {
    const b = G.battle, s = b.state;
    const enemyArt = el("enemyArt"), playerArt = el("playerArt");
    const line = eventText(e);

    if (e.t === "turn") pushLog("ターン " + e.turn, "turn");
    else {
      let cls = "";
      if (e.t === "attack" || e.t === "boost") cls = "good";
      else if (e.t === "enemyAtk" || e.t === "reckless") cls = "bad";
      else if (e.t === "awaken" || e.t === "cond") cls = e.t === "cond" && !e.ok ? "" : "warn";
      pushLog(line.filter(Boolean).join("　"), cls);
    }

    if (e.t === "attack") { punch(enemyArt, "-" + e.dmg, "dmg"); Snd.hit(); }
    if (e.t === "enemyAtk" && e.dmg > 0) { punch(playerArt, "-" + e.dmg, "dmg"); Snd.hurt(); }
    if (e.t === "reckless") { punch(playerArt, "-2", "dmg"); Snd.hurt(); }
    if (e.t === "heal" && e.amt > 0) { pop(playerArt, "+" + e.amt, "heal"); Snd.tap(); }
    if (e.t === "enemyHeal" && e.amt > 0) { pop(enemyArt, "+" + e.amt, "heal"); Snd.tap(); }
    if (e.t === "boost" || e.t === "awaken") Snd.buff();
    if (e.t === "end") { (e.result === "win" ? Snd.win() : Snd.lose()); }

    syncBattleStats();
  }

  function punch(art, txt, kind) {
    if (!art) return;
    art.classList.add("shake", "flash");
    setTimeout(() => art.classList.remove("shake", "flash"), 220);
    pop(art, txt, kind);
  }
  function pop(art, txt, kind) {
    if (!art) return;
    const n = h("div", { class: "pop " + kind, text: txt });
    art.appendChild(n);
    setTimeout(() => n.remove(), 950);
  }
  function pushLog(text, cls) {
    const log = el("log");
    if (!log || !text) return;
    [].forEach.call(log.children, (c) => c.classList.remove("now"));
    log.appendChild(h("div", { class: "ln now " + (cls || ""), text }));
    while (log.children.length > 40) log.firstChild.remove();
    log.parentNode.scrollTop = log.parentNode.scrollHeight;
  }

  function syncBattleStats() {
    const b = G.battle, s = b.state, st = G.stage;
    const set = (id, fn) => { const n = el(id); if (n) fn(n); };
    set("ehpBar", (n) => { n.style.width = Math.max(0, s.ehp) / st.hp * 100 + "%"; });
    set("ehpTxt", (n) => { n.textContent = Math.max(0, s.ehp) + " / " + st.hp; });
    set("phpBar", (n) => { n.style.width = Math.max(0, s.php) / PLAYER_MAX_HP * 100 + "%"; });
    set("phpTxt", (n) => { n.textContent = Math.max(0, s.php) + " / " + PLAYER_MAX_HP; });
    set("patkTxt", (n) => { n.textContent = String(s.patk); });
    set("turnTxt", (n) => { n.textContent = "ターン " + b.turn; });
    set("awakenChip", (n) => { n.hidden = !s.awaken; });
    set("nextRow", (n) => { n.hidden = s.ehp <= 0; });
    set("nextTxt", (n) => {
      const na = nextEnemyAct(st, s.eidx);
      n.textContent = hasSeen(st) ? actShort(na) : "？？？";
      n.className = "chip " + (na.t === "strong" ? "amber" : na.t === "charge" ? "teal" : "");
    });
    set("enemyArt", (n) => { n.classList.toggle("down", s.ehp <= 0); });
    set("playerArt", (n) => { n.classList.toggle("down", s.php <= 0); });
    const trace = el("trace");
    if (trace) [].forEach.call(trace.children, (c, i) => {
      c.classList.toggle("on", i === b.cardIdx);
      c.classList.toggle("ghost", i >= G.deck.length);
    });
  }

  function viewBattle() {
    const st = G.stage, s = G.battle.state;
    const enemy = h("div", { class: "card" }, [
      h("div", { class: "fighter" }, [
        h("div", { class: "art", id: "enemyArt" }, [spriteImg(st.sprite, 80)]),

        h("div", { class: "info" }, [
          h("div", { class: "row1" }, [
            h("span", { class: "nm", text: "ゆうしゃ" }),

          h("div", { class: "stat-row" }, [

    const log = h("div", { class: "card", style: "flex:1;min-height:150px;overflow-y:auto" },
      [h("div", { id: "log" })]);

    return [enemy, player, log];

  function renderBattleBar() {
    const b = G.battle;
    barEl.innerHTML = "";
    if (b.done) barEl.appendChild(button("けっかを見る", () => finishBattle(), { primary: true }));
    else {
      barEl.appendChild(button("1つ進める", () => { stepBattle(); scheduleStep(b.fast ? 130 : 520); }));
      barEl.appendChild(button("さいごまで", () => {
        b.fast = true;
        clearTimeout(b.timer);
        while (!b.done) stepBattle();
        renderBattleBar();
      }, { primary: true }));
    }

  function finishBattle() {
    const b = G.battle;
    clearTimeout(b.timer);
    G.result = b.result;
    G.gained = [];
    if (b.result === "win" && save.cleared.indexOf(G.stage.id) < 0) {
      save.cleared.push(G.stage.id);
      G.gained = G.stage.reward.slice();
      writeSave();

    go("result");

  // ------------------------------------------------------------- rendering
  const SCREENS = {
    title:  { title: "オートバトルRPG", view: viewTitle, back: null },
    howto:  { title: "あそびかた", view: viewHowto, back: "title" },
    map:    { title: "ステージ", view: viewMap, back: "title" },
    info:   { title: "てきの じょうほう", view: viewInfo, back: "map" },
    deck:   { title: "さくせん", view: viewDeck, back: "map" },
    pick:   { title: "カードを えらぶ", view: viewPick, back: "deck" },
    plan:   { title: "ためしうち", view: viewPlan, back: "deck" },
    battle: { title: "バトル", view: viewBattle, back: null },
    result: { title: "けっか", view: viewResult, back: null },
    ending: { title: "おわり", view: viewEnding, back: null },
  };

  function render() {
    const sc = SCREENS[G.screen];
    titleEl.textContent = sc.title;
    metaEl.textContent = metaFor(G.screen);
    backEl.hidden = !sc.back;
    backEl.onclick = sc.back ? () => { Snd.init(); Snd.back(); go(sc.back); } : null;

    viewEl.innerHTML = "";
    sc.view().forEach((n) => n && viewEl.appendChild(n));
    viewEl.scrollTop = 0;

    barEl.innerHTML = "";
    actionsFor(G.screen).forEach((b) => barEl.appendChild(b));

    if (G.screen === "battle") { syncBattleStats(); renderBattleBar(); }
  }

  function metaFor(screen) {
    if (screen === "map") return ownedCards().length + " / " + ALL_CARDS.length + " まい";
    if (screen === "deck" || screen === "plan") return "VS " + G.stage.name;
    if (screen === "info") return "ステージ " + G.stage.id;
    return "";
  }

  function actionsFor(screen) {
    switch (screen) {
      case "title":
        return [button("あそびかた", () => go("howto")), button("はじめる", () => go("map"), { primary: true })];
      case "howto":
        return [button("とじる", () => go("title"), { primary: true })];
      case "map":
        return [];
      case "info":
        return [button("さくせんへ", () => go("deck"), { primary: true })];
      case "deck":
        return [
          button("ためしうち", () => go("plan"), { disabled: !G.deck.length || !hasSeen(G.stage) }),
          button("たたかう", () => { saveDeck(); startBattle(); }, { primary: true, disabled: !G.deck.length }),
        ];
      case "pick":
        return [button("やめる", () => go("deck"))];
      case "plan":
        return [button("さくせんへ", () => go("deck")), button("たたかう", () => { saveDeck(); startBattle(); }, { primary: true })];
      case "battle":
        return [];
      case "result":
        return [
          button("ステージへ", () => go("map")),
          button(G.result === "win" && G.stage.id === STAGES[STAGES.length - 1].id ? "エンディング" : "さくせんへ",
            () => {
              if (G.result === "win" && G.stage.id === STAGES[STAGES.length - 1].id) go("ending");
              else go("deck");
            }, { primary: true }),
        ];
      case "ending":
        return [button("タイトルへ", () => go("title"), { primary: true })];
      default:
        return [];
    }
  }

  el("sndBtn").addEventListener("click", () => {
    Snd.init();
    Snd.on = !Snd.on;
    el("sndBtn").textContent = Snd.on ? "♪" : "🔇";
    el("sndBtn").style.color = Snd.on ? "" : "var(--dim)";
    if (Snd.on) Snd.ok();
  });

  // test hook: lets the automated checks assert what a tap actually did
  const probe = () => { window.__abrpg = { screen: G.screen, deck: G.deck.slice() }; };
  const origRender = render;
  render = function () { origRender(); probe(); };

  loadSave();
  render();
})();
</script>
</body>
</html>
