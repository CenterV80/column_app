  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --page: #171a14;
    --bezel: #2f3328;
    --bezel-edge: #444a3a;
    --screen-on: #9bbc0f;
    --muted: #7d8570;
  }

  html, body { height: 100%; }

  body {
    background: var(--page);
    color: var(--muted);
    font-family: "DotGothic16", "Hiragino Sans", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-height: 100%;
    min-height: 0;
  }

  #bezel {
    background: var(--bezel);
    border: 2px solid var(--bezel-edge);
    border-radius: 10px;
    padding: 8px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
    min-height: 0;
  }

  canvas#screen {
    display: block;
    aspect-ratio: 320 / 512;
    max-width: 100%;
    max-height: calc(100dvh - 60px);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--screen-on);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #footer { font-size: 11px; text-align: center; }
  #footer a { color: #8f9a78; text-decoration: none; }
</style>
</head>

  const MAX_DECK = 6;
  const MAX_TURNS = 30;
  const PLAYER_MAX_HP = 10;
  const PLAYER_BASE_ATK = 2;
  const AWAKEN_HP = 2;

  // Jump target when a condition fails: skip past this block's action card.
  function skipBlock(deck, i) {
    for (let j = i + 1; j < deck.length; j++) {
      if (CARDS[deck[j]].kind === "action") return j + 1;
    }
    return deck.length;
  }

  function nextEnemyAct(stage, idx) {
    return stage.pattern[idx % stage.pattern.length];
  }

  function evalCond(id, P, E, stage) {
    if (id === "ifPinch") return P.hp <= AWAKEN_HP;
    if (id === "ifHalf") return P.hp * 2 <= P.maxHp;
    if (id === "ifStrong") return nextEnemyAct(stage, E.idx).t === "strong";
    if (id === "ifCharge") return nextEnemyAct(stage, E.idx).t === "charge";
    return false;
  }

  // Fully deterministic: the same deck against the same stage always
  // produces the same event list. No randomness anywhere.
  function simulate(stage, deck) {
    const P = { hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP, atk: PLAYER_BASE_ATK,
                awaken: false, used: {}, guard: 0 };
    const E = { hp: stage.hp, maxHp: stage.hp, armor: stage.armor || 0, idx: 0 };
    const events = [];
    let result = "draw";

    const snap = () => ({
      php: P.hp, patk: P.atk, ehp: E.hp, awaken: P.awaken,
      used: Object.assign({}, P.used), eidx: E.idx, guard: P.guard,
    });
    const push = (o) => { o.s = snap(); events.push(o); };

    const checkAwaken = () => {
      if (P.hp > 0 && P.hp <= AWAKEN_HP && !P.awaken) {
        P.awaken = true;
        push({ t: "awaken" });
      }
    };

    for (let turn = 1; turn <= MAX_TURNS; turn++) {
      push({ t: "turn", turn });

      let i = 0, acted = false;
      while (i < deck.length) {
        const c = CARDS[deck[i]];

        if (c.kind === "cond") {
          const ok = evalCond(c.id, P, E, stage);
          push({ t: "cond", card: c.id, idx: i, ok });
          i = ok ? i + 1 : skipBlock(deck, i);
          continue;
        }

        // Boosts and states are once-per-battle resources: they resolve
        // without ending the turn, so a block can brace and still act.
        if (c.kind === "boost" || c.kind === "state") {
          const blocked = P.used[c.id] ? "used" : (c.needAwaken && !P.awaken ? "noawaken" : null);
          if (blocked) {
            push({ t: "boostFail", card: c.id, idx: i, reason: blocked });
          } else if (c.id === "guard") {
            P.guard = 4;
            P.used[c.id] = true;
            push({ t: "guard", card: c.id, idx: i });
          } else {
            const from = P.atk;
            if (c.id === "plus2") P.atk += 2;
            else if (c.id === "times2") P.atk *= 2;
            else if (c.id === "power") { P.atk = P.atk * P.atk; P.awaken = false; }
            P.used[c.id] = true;
            push({ t: "boost", card: c.id, idx: i, from, to: P.atk });
          }
          i++;
          continue;
        }

        acted = true;
        if (c.id === "attack") {
          const dmg = Math.max(1, P.atk - E.armor);
          E.hp -= dmg;
          push({ t: "attack", card: c.id, idx: i, dmg });
        } else if (c.id === "heal") {
          const before = P.hp;
          P.hp = Math.min(P.maxHp, P.hp + 3);
          push({ t: "heal", card: c.id, idx: i, amt: P.hp - before });
        } else if (c.id === "reckless") {
          P.hp -= 2; P.atk += 2;
          push({ t: "reckless", card: c.id, idx: i });
        }
        break;
      }
      if (!acted) push({ t: "idle" });

      checkAwaken();
      if (E.hp <= 0) { result = "win"; break; }
      if (P.hp <= 0) { result = "lose"; break; }

      const act = nextEnemyAct(stage, E.idx);
      E.idx++;
      if (act.t === "attack" || act.t === "strong") {
        const dmg = Math.max(0, act.v - P.guard);
        P.hp -= dmg;
        push({ t: "enemyAtk", kind: act.t, raw: act.v, dmg, guarded: P.guard > 0 });
      } else if (act.t === "charge") {
        push({ t: "enemyCharge" });
      } else if (act.t === "heal") {
        const before = E.hp;
        E.hp = Math.min(E.maxHp, E.hp + act.v);
        push({ t: "enemyHeal", amt: E.hp - before });
      }
      P.guard = 0;

      checkAwaken();
      if (P.hp <= 0) { result = "lose"; break; }
      if (E.hp <= 0) { result = "win"; break; }
    }

    push({ t: "end", result });
    return { events, result };
  }

  // ------------------------------------------------------------ renderer
  const W = 320, H = 512;
  const PAL = [[15,56,15], [48,98,48], [139,172,15], [155,188,15]];
  const cv = document.getElementById("screen");
  const ctx = cv.getContext("2d", { willReadFrequently: true });

  const rgb = (t) => `rgb(${PAL[t][0]},${PAL[t][1]},${PAL[t][2]})`;
  function rect(x, y, w, h, tone) { ctx.fillStyle = rgb(tone); ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

  // 2px checkerboards give the mid tones real texture instead of flat fills.
  function makePat(a, b) {
    const p = document.createElement("canvas");
    p.width = p.height = 4;
    const c = p.getContext("2d");
    c.fillStyle = rgb(a); c.fillRect(0, 0, 4, 4);
    c.fillStyle = rgb(b); c.fillRect(0, 0, 2, 2); c.fillRect(2, 2, 2, 2);
    return ctx.createPattern(p, "repeat");
  }
  let PAT_FIELD, PAT_GROUND, PAT_DARK, PAT_ARENA;
  function initPatterns() {
    PAT_FIELD = makePat(2, 1);   // page field: dark enough for windows to read
    PAT_GROUND = makePat(1, 0);  // empty slots and locked tiles
    PAT_DARK = makePat(1, 0);    // night sky
    PAT_ARENA = makePat(3, 2);   // lit ground: sprites are dark figures on it
  }
  function patFill(pat, x, y, w, h) { ctx.fillStyle = pat; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

  // Every screen sits on a dithered field so windows have figure/ground.
  function field() { patFill(PAT_FIELD, 0, 0, W, H); }

  const FONT = 16, FONT_BIG = 32;
  function setFont(size) { ctx.font = `${size}px "DotGothic16", monospace`; }
  function txt(s, x, y, tone, size) {
    setFont(size || FONT);
    ctx.fillStyle = rgb(tone === undefined ? 0 : tone);
    ctx.textBaseline = "top";
    ctx.fillText(s, (x | 0), (y | 0));
  }
  function txtW(s, size) { setFont(size || FONT); return ctx.measureText(s).width; }
  function txtMid(s, y, tone, size) { txt(s, ((W - txtW(s, size)) / 2) | 0, y, tone, size); }
  // Right-aligned, for stat numerals.
  function txtR(s, right, y, tone, size) { txt(s, (right - txtW(s, size)) | 0, y, tone, size); }

  // Console window: solid light interior, hard frame, inner rule.
  function win(x, y, w, h) {
    rect(x, y, w, h, 3);
    rect(x, y, w, 2, 0); rect(x, y + h - 2, w, 2, 0);
    rect(x, y, 2, h, 0); rect(x + w - 2, y, 2, h, 0);
    rect(x + 4, y + 4, w - 8, 1, 1); rect(x + 4, y + h - 5, w - 8, 1, 1);
    rect(x + 4, y + 4, 1, h - 8, 1); rect(x + w - 5, y + 4, 1, h - 8, 1);
  }

  // A window with an inverted title strip: the console equivalent of a header.
  function titledWin(x, y, w, h, title) {
    win(x, y, w, h);
    rect(x + 2, y + 2, w - 4, 20, 0);
    txt(title, x + 8, y + 3, 3);
  }

  // Page header: one solid bar, no hollow body beneath it.
  function header(title, right) {
    rect(8, 8, 304, 36, 0);
    txtClip(title, 18, 15, right ? 180 : 286, 3);
    if (right) txtR(fitStr(right, 110, 14), 302, 19, 2, 14);
  }

  // Inverted plate — the GB convention for a status tag.
  function plate(s, x, y) {
    const w = txtW(s) + 10;
    rect(x, y, w, 20, 0);
    txt(s, x + 5, y + 2, 3);
    return w;
  }

  // Button prompt: a key cap plus its label. Returns the next free x.
  function keyHint(x, y, key, labelText) {
    const kw = Math.max(18, txtW(key) + 8);
    rect(x, y, kw, 18, 0);
    txt(key, x + (kw - txtW(key)) / 2, y + 1, 3);
    txt(labelText, x + kw + 5, y + 1, 0);
    return x + kw + 5 + txtW(labelText) + 12;
  }

  // Button prompts belong on a framed strip, never loose on the field.
  function hintWin(y, pairs) {
    win(8, y, 304, 26);
    let x = 16;
    pairs.forEach((p) => { x = keyHint(x, y + 4, p[0], p[1]); });
  }

  function bar(x, y, w, ratio) {
    const h = 12;
    rect(x, y, w, h, 0);
    rect(x + 2, y + 2, w - 4, h - 4, 3);
    const inner = Math.max(0, Math.round((w - 4) * Math.max(0, Math.min(1, ratio))));
    rect(x + 2, y + 2, inner, h - 4, 0);
    if (inner > 2) rect(x + 2, y + 2, inner, 1, 1);
  }

  function sprite(name, x, y, scale, flash) {
    const art = SPRITES[name];
    if (!art) return;
    const s = scale || 2;
    for (let r = 0; r < art.length; r++) {
      const row = art[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === ".") continue;
        let tone = ch.charCodeAt(0) - 48;
        if (flash) tone = 3 - tone;
        rect(x + c * s, y + r * s, s, s, tone);
      }
    }
  }

  // A lit stage for a fighter: light interior, hard frame, dark floor strip.
  function arena(x, y, w, h) {
    rect(x, y, w, h, 0);
    patFill(PAT_ARENA, x + 2, y + 2, w - 4, h - 4);
    patFill(PAT_GROUND, x + 2, y + h - 14, w - 4, 12);
    rect(x + 2, y + h - 16, w - 4, 2, 0);
  }

  // Sprites need something to stand on or they float in a void.
  function shadow(cx, y, w) {
    rect(cx - w / 2, y, w, 4, 1);
    rect(cx - w / 2 + 4, y - 2, w - 8, 2, 1);
    rect(cx - w / 2 + 4, y + 4, w - 8, 2, 1);
  }

  function cursor(x, y, tone) {
    const t = tone === undefined ? 0 : tone;
    for (let i = 0; i < 6; i++) {
      rect(x, y + i, 6 - i, 1, t);
      rect(x, y + 11 - i, 6 - i, 1, t);
    }
  }

  // Card kind glyphs drawn as pixels, not font characters.
  function kindIcon(kind, x, y, tone) {
    const t = tone === undefined ? 0 : tone;
    if (kind === "cond") {           // diamond
      for (let i = 0; i < 5; i++) { rect(x + 5 - i, y + i, 1 + i * 2, 1, t); rect(x + 5 - i, y + 9 - i, 1 + i * 2, 1, t); }
    } else if (kind === "boost") {   // up triangle
      for (let i = 0; i < 5; i++) rect(x + 5 - i, y + 4 + i, 1 + i * 2, 1, t);
    } else if (kind === "state") {   // filled square
      rect(x + 1, y + 3, 9, 7, t);
    } else {                          // action: filled circle
      rect(x + 3, y + 2, 5, 9, t); rect(x + 2, y + 3, 7, 7, t);
    }
  }

  function quantize() {
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const lum = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
      let best = 0, bestD = 1e9;
      for (let p = 0; p < 4; p++) {
        const c = PAL[p];
        const pl = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
        const dist = Math.abs(pl - lum);
        if (dist < bestD) { bestD = dist; best = p; }
      }
      d[i] = PAL[best][0]; d[i + 1] = PAL[best][1]; d[i + 2] = PAL[best][2]; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  // --------------------------------------------------------------- audio
  const Snd = {
    ac: null, on: true,
    init() {
      if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ac = new AC();
    },
    tone(freq, dur, when, vol) {
      if (!this.on || !this.ac) return;
      const t0 = this.ac.currentTime + (when || 0);
      const osc = this.ac.createOscillator();
      const g = this.ac.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol === undefined ? 0.05 : vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.ac.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.01);
    },
    move() { this.tone(520, 0.05); },
    ok() { this.tone(700, 0.06); this.tone(950, 0.08, 0.06); },
    back() { this.tone(320, 0.08); },
    hit() { this.tone(200, 0.06); this.tone(130, 0.1, 0.04); },
    hurt() { this.tone(150, 0.14, 0, 0.06); },
    buff() { this.tone(600, 0.05); this.tone(800, 0.05, 0.05); this.tone(1050, 0.08, 0.1); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, i * 0.12)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, i * 0.16)); },
  };

  // ---------------------------------------------------------------- save
  const SAVE_KEY = "abrpg.save.v2";
  const save = { cleared: [], seen: [], decks: {} };

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (Array.isArray(o.cleared)) save.cleared = o.cleared;
      if (Array.isArray(o.seen)) save.seen = o.seen;
      if (o.decks && typeof o.decks === "object") save.decks = o.decks;
    } catch (e) { /* private mode: play without saving */ }
  }
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }
  }

  function ownedCards() {

      }
    });
    return owned;
  }

  const isCleared = (st) => save.cleared.indexOf(st.id) >= 0;
  const hasSeen = (st) => save.seen.indexOf(st.id) >= 0;
  function deckOf(stageId) {
    const d = save.decks[stageId];
    return Array.isArray(d) ? d.slice() : ["attack"];

  // ---------------------------------------------------------- text helpers
  // helper: center text inside a box
  function txtMidIn(x, w, y, s, tone) { txt(s, (x + (w - txtW(s)) / 2) | 0, y, tone); }

  // Drop trailing characters until the string fits maxW pixels. Card names and
  // descriptions vary a lot in width, so every bounded string goes through this.
  function fitStr(s, maxW, size) {
    let t = s;
    while (t.length > 1 && txtW(t, size) > maxW) t = t.slice(0, -1);
    return t;
  }

  function txtClip(s, x, y, maxW, tone, size) {
    txt(fitStr(s, maxW, size), x, y, tone, size);
  }

  // Flow a long string over up to `lines` rows, breaking on spaces where it can.
  function wrapClip(s, x, y, maxW, tone, lines, size) {
    let rest = s;
    for (let i = 0; i < lines && rest.length; i++) {
      let take = fitStr(rest, maxW, size);
      if (take.length < rest.length && i < lines - 1) {
        const sp = take.lastIndexOf(" ");
        if (sp > take.length / 2) take = take.slice(0, sp);
      }
      txt(take.trim(), x, y + i * 22, tone, size);
      rest = rest.slice(take.length).replace(/^ +/, "");
    }
  }

  // Label left, value right, both inside [x, x+w). The value only gets the
  // space the label leaves, so the two can never overlap.
  function txtPair(labelStr, valueStr, x, y, w, labelTone, valueTone, size) {
    const lw = txtW(labelStr, size);
    txt(labelStr, x, y, labelTone, size);
    const v = fitStr(valueStr, w - lw - 8, size);
    txt(v, x + w - txtW(v, size), y, valueTone, size);
  }

  // Rolls the event list up into one row per turn: what you did, and where
  // both HP bars ended up. This is the whole point of a deterministic battle —
  // the player can read the fight off a table instead of guessing.
  function planRows(stage, deck) {
    const sim = simulate(stage, deck);
    const rows = [];
    let cur = null;
    const ACTS = { attack: "こうげき", heal: "かいふく", guard: "ぼうぎょ",
                   reckless: "すてみ", idle: "ようす見" };
    sim.events.forEach((e) => {
      if (e.t === "turn") {
        cur = { turn: e.turn, boosts: [], act: "", php: e.s.php, ehp: e.s.ehp, enemy: "" };
        rows.push(cur);
        return;
      }
      if (!cur) return;
      if (e.t === "boost") cur.boosts.push(CARDS[e.card].short);
      else if (ACTS[e.t]) cur.act = ACTS[e.t];
      else if (e.t === "guard") cur.boosts.push("ぼうぎょ");
      else if (e.t === "enemyAtk") cur.enemy = (e.kind === "strong" ? "つよ" : "こう") + e.dmg;
      else if (e.t === "enemyCharge") cur.enemy = "ためる";
      else if (e.t === "enemyHeal") cur.enemy = "かいふく";
      cur.php = e.s.php; cur.ehp = e.s.ehp;
    });
    return { rows, result: sim.result };
  }

  // One-line verdict for the deck screen.
  function planSummary(stage, deck) {
    const { rows, result } = planRows(stage, deck);
    const last = rows[rows.length - 1];
    const n = last ? last.turn : 0;
    if (result === "win") return { s: n + "ターンめに しょうり  のこりHP" + Math.max(0, last.php), ok: true };
    if (result === "lose") return { s: n + "ターンめに はいぼく  てきHP" + Math.max(0, last.ehp) + "のこり", ok: false };
    return { s: "きまらない (" + n + "ターン ひきわけ)", ok: false };
  }

  // ---- deck edit
  // Depth per card, so conditional blocks read as indented groups.
  function deckIndents(deck) {
    const out = [];
    let inBlock = false;
    deck.forEach((id) => {
      const c = CARDS[id];
      if (c.kind === "cond") { out.push(0); inBlock = true; return; }
      out.push(inBlock ? 1 : 0);
      if (c.kind === "action") inBlock = false;
    });
    return out;
  }

  // --------------------------------------------------------- touch widgets
  // Everything the finger can hit is at least TAP_MIN tall. The screen is
  // 320x512 logical pixels shown at roughly 1.2x on a phone, so 44 here is
  // about 54 real pixels — a comfortable target.
  const TAP_MIN = 44;

  // A pressable slab. Draws itself and registers its own hit area, so the
  // picture and the touch target are always the same rectangle.
  function button(x, y, w, h, labelText, fn, opts) {
    const o = opts || {};
    const held = G.held === labelText + "@" + y;
    rect(x, y, w, h, 0);
    rect(x + 2, y + 2, w - 4, h - 4, o.disabled ? 1 : (held || o.primary) ? 0 : 3);
    if (!o.disabled && !o.primary && !held) rect(x + 4, y + h - 6, w - 8, 2, 1);
    const tone = o.disabled ? 2 : (held || o.primary) ? 3 : 0;
    const size = o.small ? 14 : FONT;
    const lbl = fitStr(labelText, w - 16, size);
    txt(lbl, (x + (w - txtW(lbl, size)) / 2) | 0, y + (h - size) / 2 - 1, tone, size);
    if (!o.disabled) {
      tapArea(x, y, w, h, {
        down: () => { G.held = labelText + "@" + y; },
        cancel: () => { G.held = null; },
        tap: () => { G.held = null; Snd.ok(); fn(); },
      });
    }
  }

  // Row-shaped target: a list entry the whole width of its box.
  function rowButton(x, y, w, h, fn, drawFn, held) {
    drawFn(held);
    tapArea(x, y, w, h, { tap: () => { Snd.ok(); fn(); } });
  }

  function drawSlot(i, y, indent, floating) {
    const filled = i < G.deck.length;
    const x = 8 + (filled && indent ? 16 : 0);
    const w = 244 - (filled && indent ? 16 : 0);
    rect(x, y, w, 44, 0);
    if (filled) {
      const c = CARDS[G.deck[i]];
      rect(x + 2, y + 2, w - 4, 40, floating ? 0 : 3);
      const tone = floating ? 3 : 0;
      kindIcon(c.kind, x + 8, y + 15, tone);
      txtClip(c.name, x + 28, y + 12, w - 80, tone);
      if (c.kind === "boost" || c.kind === "state") txtR("1かい", x + w - 8, y + 15, floating ? 2 : 1, 12);
      if (indent) rect(x - 12, y + 6, 4, 32, 1);
      if (!floating) {
        tapArea(x, y, w, 44, {
          down: () => {},
          drag: (p) => { if (!G.drag) { G.drag = { from: i, y: p.y }; Snd.move(); } else G.drag.y = p.y; },
          drop: () => {
            if (!G.drag) return;
            const to = dragTargetIndex(G.drag.y);
            const card = G.deck.splice(G.drag.from, 1)[0];
            G.deck.splice(Math.min(to, G.deck.length), 0, card);
            G.drag = null; saveDeck(); Snd.ok();
          },
          cancel: () => { G.drag = null; },
          tap: () => { G.deckCur = i; G.pickCur = 0; setScreen("pick"); },
        });
        // remove button
        button(258, y, 54, 44, "けす", () => {
          if (G.deck.length <= 1) { Snd.back(); return; }
          G.deck.splice(i, 1);
          saveDeck();
        }, { small: true });
      }
    } else {
      patFill(PAT_GROUND, x + 2, y + 2, w - 4, 40);
      rect(x + 8, y + 12, 20, 20, 3);
      txt(String(i + 1), x + 13, y + 11, 0, 14);

      tapArea(x, y, w, 44, { tap: () => { Snd.ok(); G.deckCur = i; G.pickCur = 0; setScreen("pick"); } });
    }
  }

  function startBattle() {
    const sim = simulate(G.stage, G.deck);
    G.battle = {
      events: sim.events, result: sim.result, i: -1,
      state: { php: PLAYER_MAX_HP, patk: PLAYER_BASE_ATK, ehp: G.stage.hp, awaken: false, used: {}, eidx: 0 },
      msg: ["", ""], cardIdx: -1, turn: 1, timer: 0, speed: 30,
      flashE: 0, flashP: 0, lungeP: 0, lungeE: 0, pop: null, done: false,
    };
    if (!hasSeen(G.stage)) { save.seen.push(G.stage.id); writeSave(); }
    setScreen("battle");
  }

  function eventText(e) {
    const c = e.card ? CARDS[e.card] : null;
    switch (e.t) {
      case "turn": return ["- ターン " + e.turn + " -", ""];
      case "cond": return [c.name, e.ok ? "→ せいりつ！ つぎへ" : "→ ふせいりつ。とばす"];
      case "boost": return [c.name + " はつどう！", "こうげき力 " + e.from + " → " + e.to];
      case "guard": return ["ぼうぎょの かまえ！", "うけるダメージ -4"];
      case "boostFail": return [c.name + " は つかえない", e.reason === "used" ? "→ もう つかった" : "→ かくせい していない"];
      case "attack": return ["こうげき！", "てきに " + e.dmg + " ダメージ"];
      case "heal": return ["かいふく！", e.amt > 0 ? "HPが " + e.amt + " かいふく" : "HPは まんタン"];
      case "reckless": return ["すてみ！", "HP-2 こうげき力+2"];
      case "idle": return ["ようすを みている…", "つかえる カードが ない"];
      case "awaken": return ["HPが 2いか！", "かくせい した！"];
      case "enemyAtk": return [e.kind === "strong" ? "てきの つよこうげき！" : "てきの こうげき！",
                               e.guarded ? e.dmg + " ダメージ (ぼうぎょ)" : e.dmg + " ダメージ"];
      case "enemyCharge": return ["てきは ちからを ためている", "つぎの こうげきに ちゅうい"];
      case "enemyHeal": return ["てきは かいふくした", "HPが " + e.amt + " もどった"];
      case "end": return [e.result === "win" ? "てきを たおした！" : e.result === "lose" ? "ちからつきた…" : "じかんぎれ…", ""];
      default: return ["", ""];
    }
  }

  function stepBattle() {
    const b = G.battle;
    b.i++;
    if (b.i >= b.events.length) { finishBattle(); return; }
    const e = b.events[b.i];
    b.state = e.s;
    b.msg = eventText(e);
    b.cardIdx = e.idx === undefined ? -1 : e.idx;
    if (e.t === "turn") b.turn = e.turn;
    if (e.t === "attack") { b.flashE = 6; b.lungeP = 8; b.pop = { v: "-" + e.dmg, x: 228, y: 96, life: 16 }; Snd.hit(); }
    if (e.t === "enemyAtk" && e.dmg > 0) { b.flashP = 6; b.lungeE = 8; b.pop = { v: "-" + e.dmg, x: 30, y: 226, life: 16 }; Snd.hurt(); }
    if (e.t === "boost" || e.t === "awaken") Snd.buff();
    if (e.t === "reckless") { b.pop = { v: "-2", x: 30, y: 226, life: 14 }; Snd.hurt(); }
    if (e.t === "heal") { b.pop = { v: "+" + e.amt, x: 30, y: 226, life: 14 }; Snd.move(); }
    if (e.t === "enemyHeal") { b.pop = { v: "+" + e.amt, x: 228, y: 96, life: 14 }; Snd.move(); }
    if (e.t === "guard") Snd.move();
    if (e.t === "end") { b.done = true; if (e.result === "win") Snd.win(); else Snd.lose(); }
  }

  function finishBattle() {
    const b = G.battle;
    G.result = b.result;
    G.gained = [];
    if (b.result === "win" && !isCleared(G.stage)) {
      save.cleared.push(G.stage.id);
      G.gained = G.stage.reward.slice();
      writeSave();
    }
    setScreen("result");
  }

  function drawBattle() {
    const b = G.battle, s = b.state, st = G.stage;
    field();
    const sx = b.shake > 0 ? (b.shake % 2 ? 3 : -3) : 0;

    // enemy
    arena(168, 56, 144, 120);
    const dead = s.ehp <= 0;
    const ex = 200 + (b.lungeE > 0 ? -8 : 0) + sx;
    if (!dead || Math.floor(G.frame / 3) % 2 === 0) {
      if (!dead) shadow(ex + 40, 158, 56);
      sprite(st.sprite, ex, 72, 2.5, b.flashE > 0);
    }

    header(st.name, "ターン " + b.turn);

    win(8, 56, 152, 120);
    bar(18, 74, 132, Math.max(0, s.ehp) / st.hp);
    txtPair("HP", Math.max(0, s.ehp) + "/" + st.hp, 18, 94, 132, 1, 0);
    const na = nextEnemyAct(st, s.eidx), known = hasSeen(st);
    txt("つぎの て", 18, 122, 1, 14);
    txtClip(known ? actShort(na) : "？？？", 18, 144, 132,
            na.t === "strong" && known ? 0 : 1);

    // player
    arena(8, 192, 104, 112);
    const px = 20 + (b.lungeP > 0 ? 10 : 0);
    shadow(px + 32, 288, 46);
    sprite("hero", px, 208, 2, b.flashP > 0);

    win(120, 192, 192, 112);
    txt("ゆうしゃ", 130, 200, 0);
    if (s.awaken && Math.floor(G.frame / 6) % 2 === 0) plate("かくせい!", 232, 199);
    bar(130, 226, 172, Math.max(0, s.php) / PLAYER_MAX_HP);
    txtPair("HP", Math.max(0, s.php) + "/" + PLAYER_MAX_HP, 130, 246, 172, 1, 0);
    txtPair("ATK", String(s.patk), 130, 274, 172, 1, 0);

    // deck trace
    win(8, 314, 304, 36);
    txt("さくせん", 16, 322, 1, 14);
    for (let i = 0; i < MAX_DECK; i++) {
      const x = 96 + i * 34, y = 320;
      rect(x, y, 30, 24, 0);
      if (i < G.deck.length) {
        const active = i === b.cardIdx;
        rect(x + 1, y + 1, 28, 22, active ? 0 : 3);
        if (!active) kindIcon(CARDS[G.deck[i]].kind, x + 8, y + 6);
        else rect(x + 9, y + 8, 12, 8, 3);
      } else patFill(PAT_GROUND, x + 1, y + 1, 28, 22);
    }

    // message
    win(8, 358, 304, 90);
    wrapClip(b.msg[0], 20, 372, 280, 0, 1);
    wrapClip(b.msg[1], 20, 402, 280, 0, 2);

    if (b.pop && b.pop.life > 0) {
      const rise = (16 - b.pop.life) / 2, y = b.pop.y - rise;
      txt(b.pop.v, b.pop.x + 3, y + 3, 3, FONT_BIG);
      txt(b.pop.v, b.pop.x, y, 0, FONT_BIG);
    }

    if (b.done) {
      button(8, 456, 304, 48, "けっかへ", () => finishBattle(), { primary: true });
    } else {
      button(8, 456, 304, 48, b.fast ? "はやおくり中" : "はやおくり",
             () => { b.fast = true; b.speed = 8; }, { primary: b.fast });
      // tapping the screen also advances, the way a message box should
      tapArea(0, 48, W, 400, { tap: () => stepBattle() });
    }
  }

  // ---- result
  function drawResult() {
    const won = G.result === "win";
    field();
    rect(8, 8, 304, 44, won ? 1 : 0);
    txtMid(won ? "しょうり！" : G.result === "lose" ? "はいぼく…" : "じかんぎれ", 18, 3, FONT_BIG);

    arena(104, 68, 112, 104);
    sprite(won ? "hero" : G.stage.sprite, 120, 76, 2.5);
    shadow(160, 158, 50);

    if (won) {
      titledWin(8, 188, 304, 196, G.gained.length ? "カードを おぼえた！" : "クリアずみ");
      if (G.gained.length) {
        G.gained.forEach((id, i) => {
          const c = CARDS[id], y = 228 + i * 52;
          rect(24, y, 272, 46, 0);
          rect(26, y + 2, 268, 42, 3);
          kindIcon(c.kind, 34, y + 16);
          txtClip(c.name, 56, y + 4, 232, 0);
          txtClip(c.desc, 56, y + 24, 232, 1, 13);
        });
      } else txtClip("この ステージは クリアずみ。", 24, 232, 276, 0);
    } else {
      titledWin(8, 188, 304, 196, "ヒント");
      wrapClip("さくせんを くみなおして もういちど いどもう。", 24, 228, 268, 0, 2);
      wrapClip(G.stage.hint, 24, 292, 268, 1, 3);
    }

    button(8, 396, 304, 52, "さくせんを なおす", () => {
      if (won && G.stage.id === STAGES[STAGES.length - 1].id) { setScreen("ending"); return; }
      setScreen("deck");
    }, { primary: true });
    button(8, 456, 304, 48, "ステージへ", () => setScreen("map"));
  }

  // ---- ending
  function drawEnding() {
    field();
    patFill(PAT_DARK, 0, 0, W, 180);
    rect(8, 12, 304, 44, 0);
    txtMid("ぜんステージ クリア！", 22, 3);
    sprite("dragon", 112, 72, 3);

    win(8, 200, 304, 200);
    wrapClip("さくせんだけで りゅうを たおした。", 22, 216, 276, 0, 2);
    wrapClip("つよさは ステータスでは なく、くみたてた さくせんの ことだった。",
             22, 274, 276, 0, 3);
    txtClip("カードを かえて べつの こたえも さがせる。", 22, 360, 276, 1, 14);

    button(8, 430, 304, 56, "タイトルへ", () => setScreen("title"), { primary: true });
  }

  // ------------------------------------------------------------- drawing
  function draw() {
    clearHits();
    if (window.__abrpgProbe !== false) { window.__abrpgScreen = G.screen; window.__abrpgDeck = G.deck.slice(); }
    switch (G.screen) {
      case "title": drawTitle(); break;
      case "howto": drawHowto(); break;
      case "map": drawMap(); break;
      case "info": drawInfo(); break;
      case "deck": drawDeck(); break;
      case "plan": drawPlan(); break;
      case "pick": drawPick(); break;
      case "battle": drawBattle(); break;
      case "result": drawResult(); break;
      case "ending": drawEnding(); break;
    }
    quantize();
  }

  // --------------------------------------------------------------- input
  function saveDeck() {
    if (!G.stage) return;
    save.decks[G.stage.id] = G.deck.slice();
    writeSave();
  }

  // ---------------------------------------------------------------- touch
  // Every screen registers its tappable areas while it draws, so a hit region
  // can never drift away from the thing the player actually sees.
  let HITS = [];
  function clearHits() { HITS = []; }
  function tapArea(x, y, w, h, handlers) { HITS.push({ x, y, w, h, h_: handlers }); }

  function toScreen(ev) {
    const r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  }
  function hitAt(p) {
    for (let i = HITS.length - 1; i >= 0; i--) {
      const h = HITS[i];
      if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h;
    }
    return null;
  }
  const call = (h, name, arg) => {
    const fn = h && h.h_ && (typeof h.h_ === "function" ? (name === "tap" ? h.h_ : null) : h.h_[name]);
    if (fn) fn(arg);
    return !!fn;
  };

  // A press becomes a drag once the finger travels far enough. Only the deck
  // slots use that, but ordering is the whole game, so it earns the gesture.
  const DRAG_SLOP = 10;
  let touch = null;

  cv.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    Snd.init();
    const p = toScreen(ev);
    touch = { p0: p, p, hit: hitAt(p), moved: false };
    if (cv.setPointerCapture) { try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* older iOS */ } }
    call(touch.hit, "down", p);
  });

  cv.addEventListener("pointermove", (ev) => {
    if (!touch) return;
    const p = toScreen(ev);
    touch.p = p;
    if (!touch.moved && Math.hypot(p.x - touch.p0.x, p.y - touch.p0.y) > DRAG_SLOP) touch.moved = true;
    if (touch.moved) call(touch.hit, "drag", p);
  });

  function endTouch() {
    if (!touch) return;
    const t = touch;
    touch = null;
    if (t.moved) {
      if (!call(t.hit, "drop", t.p)) call(t.hit, "cancel");
      return;
    }
    // a tap only fires if it lifts on the region it started in
    if (t.hit && hitAt(t.p) === t.hit) call(t.hit, "tap", t.p);
    else call(t.hit, "cancel");
  }
  cv.addEventListener("pointerup", (ev) => { ev.preventDefault(); endTouch(); });
  cv.addEventListener("pointercancel", () => { call(touch && touch.hit, "cancel"); touch = null; });

  // ---------------------------------------------------------------- loop
  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < 33) return;
    last = t;
    G.frame++;

    const b = G.battle;
    if (b) {
      if (b.flashE > 0) b.flashE--;
      if (b.flashP > 0) b.flashP--;
      if (b.lungeP > 0) b.lungeP--;
      if (b.lungeE > 0) b.lungeE--;
      if (b.pop && b.pop.life > 0) b.pop.life--;
      if (G.screen === "battle" && !b.done) {
        b.timer++;
        if (b.i < 0 || b.timer >= b.speed / 2) { b.timer = 0; stepBattle(); }
      }
    }
    draw();
  }

  loadSave();
  const boot = () => { initPatterns(); draw(); requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.load) {
    Promise.race([
      document.fonts.load('16px "DotGothic16"').then(() => document.fonts.ready),
      new Promise((r) => setTimeout(r, 1500)),
    ]).then(boot, boot);
  } else boot();
})();
</script>
</body>
</html>
